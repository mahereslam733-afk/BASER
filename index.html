<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>قارئ المستندات العربي - Offline</title>

<!--
========================================================
مهم:
هذه الملفات يجب أن تكون موجودة محليًا بجانب index.html

./tesseract.min.js
./worker.min.js
./tessdata/ara.traineddata.gz
========================================================
-->

<script src="./tesseract.min.js"></script>


<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{

    background:#0f172a;

    color:white;

    font-family:
        Arial,
        Tahoma,
        sans-serif;

    padding:15px;
}


.app{

    width:100%;

    max-width:600px;

    margin:auto;

}


/* ==========================================
   العنوان
========================================== */

.header{

    background:#3730a3;

    border-radius:20px;

    padding:18px;

    text-align:center;

    margin-bottom:15px;

}

.header h1{

    margin:0;

    font-size:25px;

}

.header p{

    margin:7px 0 0;

    color:#dbeafe;

    font-size:14px;

}


/* ==========================================
   الكاميرا
========================================== */

.camera-box{

    position:relative;

    width:100%;

    height:62vh;

    min-height:380px;

    max-height:700px;

    background:#000;

    border:4px solid #6366f1;

    border-radius:22px;

    overflow:hidden;

    margin-bottom:15px;

}


#video{

    width:100%;

    height:100%;

    object-fit:cover;

}


.camera-message{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:20px;

    color:#ddd;

    font-size:18px;

}


/* ==========================================
   الأزرار
========================================== */

button,
.file-label{

    width:100%;

    border:0;

    border-radius:18px;

    padding:16px;

    margin-bottom:10px;

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

}


button:disabled{

    opacity:.45;

}


.capture{

    background:#059669;

}


.gallery{

    background:#2563eb;

}


.repeat{

    background:#d97706;

}


.stop{

    background:#dc2626;

}


.file-label{

    display:flex;

    align-items:center;

    justify-content:center;

}


.file-label input{

    display:none;

}


/* ==========================================
   الحالة
========================================== */

.status{

    background:#172554;

    border:1px solid #3730a3;

    border-radius:15px;

    padding:12px;

    text-align:center;

    margin-top:5px;

    margin-bottom:12px;

    font-size:14px;

}


/* ==========================================
   النص
========================================== */

.result{

    background:#1e293b;

    border:1px solid #475569;

    border-radius:20px;

    padding:15px;

}


.result-title{

    color:#a5b4fc;

    font-weight:bold;

    margin-bottom:10px;

}


#resultText{

    white-space:pre-wrap;

    line-height:2;

    font-size:17px;

    min-height:130px;

}


/* ==========================================
   شاشة البداية
========================================== */

#welcome{

    position:fixed;

    inset:0;

    background:#020617;

    z-index:1000;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

}


.welcome-box{

    width:100%;

    max-width:420px;

    background:#312e81;

    border:3px solid #6366f1;

    border-radius:25px;

    padding:30px 20px;

    text-align:center;

}


.welcome-box h2{

    font-size:30px;

    margin-top:0;

}


.start{

    background:#059669;

    margin-top:15px;

}


/* ==========================================
   شاشة المعالجة
========================================== */

#loading{

    display:none;

    position:fixed;

    inset:0;

    z-index:2000;

    background:rgba(0,0,0,.78);

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:20px;

}


.loading-box{

    background:#1e293b;

    border-radius:22px;

    padding:25px;

    width:90%;

    max-width:350px;

}


.spinner{

    width:48px;

    height:48px;

    border-radius:50%;

    border:5px solid #475569;

    border-top-color:#22c55e;

    animation:
        spin 1s linear infinite;

    margin:0 auto 15px;

}


@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* ==========================================
   إطار التصوير
========================================== */

.scan-frame{

    position:absolute;

    width:86%;

    height:70%;

    border:2px solid rgba(255,255,255,.7);

    left:7%;

    top:15%;

    pointer-events:none;

    border-radius:10px;

}

</style>

</head>


<body>


<!-- ==========================================
     شاشة البداية
========================================== -->

<div id="welcome">

    <div class="welcome-box">

        <h2>
            📖 قارئ عربي
        </h2>

        <p>
            قارئ المستندات العربية
        </p>

        <p style="font-size:14px;color:#c7d2fe;">

            يعمل محليًا بدون API

        </p>

        <button
            id="startButton"
            class="start">

            🚀 ابدأ التطبيق

        </button>

    </div>

</div>


<!-- ==========================================
     شاشة المعالجة
========================================== -->

<div id="loading">

    <div class="loading-box">

        <div class="spinner"></div>

        <div id="loadingText">

            جاري قراءة الصفحة...

        </div>

    </div>

</div>


<div class="app">


<!-- ==========================================
     العنوان
========================================== -->

<div class="header">

    <h1>
        قارئ المستندات العربي
    </h1>

    <p>
        قراءة النصوص العربية بدون إنترنت
    </p>

</div>


<!-- ==========================================
     الكاميرا
========================================== -->

<div class="camera-box">

    <video
        id="video"
        autoplay
        playsinline
        muted>
    </video>


    <div
        id="cameraMessage"
        class="camera-message">

        اضغط ابدأ لتشغيل الكاميرا

    </div>


    <div class="scan-frame"></div>

</div>


<!-- Canvas -->

<canvas
    id="canvas"
    style="display:none;">
</canvas>


<!-- ==========================================
     التصوير
========================================== -->

<button
    id="captureButton"
    class="capture"
    disabled>

    📸 تصوير وقراءة الصفحة

</button>


<!-- ==========================================
     المعرض
========================================== -->

<label
    class="file-label gallery">

    📁 اختيار صورة من الهاتف

    <input
        id="fileInput"
        type="file"
        accept="image/*">

</label>


<!-- ==========================================
     إعادة القراءة
========================================== -->

<button
    id="repeatButton"
    class="repeat">

    🔊 إعادة قراءة النص

</button>


<!-- ==========================================
     إيقاف الصوت
========================================== -->

<button
    id="stopButton"
    class="stop">

    🔇 إيقاف القراءة

</button>


<!-- ==========================================
     الحالة
========================================== -->

<div
    id="status"
    class="status">

    التطبيق جاهز

</div>


<!-- ==========================================
     النتيجة
========================================== -->

<div class="result">

    <div class="result-title">

        النص المستخرج:

    </div>


    <div id="resultText">

        وجّه الكاميرا نحو الصفحة
        واضغط تصوير.

    </div>

</div>


</div>


<script>


/* =================================================
   المتغيرات
================================================= */

const video =
    document.getElementById(
        "video"
    );


const canvas =
    document.getElementById(
        "canvas"
    );


const cameraMessage =
    document.getElementById(
        "cameraMessage"
    );


const captureButton =
    document.getElementById(
        "captureButton"
    );


const fileInput =
    document.getElementById(
        "fileInput"
    );


const repeatButton =
    document.getElementById(
        "repeatButton"
    );


const stopButton =
    document.getElementById(
        "stopButton"
    );


const status =
    document.getElementById(
        "status"
    );


const resultText =
    document.getElementById(
        "resultText"
    );


const welcome =
    document.getElementById(
        "welcome"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const loading =
    document.getElementById(
        "loading"
    );


const loadingText =
    document.getElementById(
        "loadingText"
    );


let stream = null;

let worker = null;

let lastText = "";

let busy = false;


/* =================================================
   الحالة
================================================= */

function setStatus(text){

    status.textContent =
        text;

}


/* =================================================
   النطق
================================================= */

function speak(text){

    if(!text){

        return;

    }


    if(
        !("speechSynthesis" in window)
    ){

        return;

    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "ar-EG";


    utterance.rate =
        0.78;


    utterance.pitch =
        1;


    utterance.volume =
        1;


    const voices =
        speechSynthesis.getVoices();


    const arabic =
        voices.find(
            v =>
            v.lang === "ar-EG"
        )
        ||
        voices.find(
            v =>
            v.lang.startsWith("ar")
        );


    if(arabic){

        utterance.voice =
            arabic;

    }


    speechSynthesis.speak(
        utterance
    );


    lastText =
        text;

}


/* =================================================
   تشغيل الكاميرا
================================================= */

async function startCamera(){

    try{

        stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video:{

                        facingMode:{
                            ideal:
                            "environment"
                        },

                        width:{
                            ideal:1920
                        },

                        height:{
                            ideal:1080
                        }

                    },

                    audio:false

                });


        video.srcObject =
            stream;


        cameraMessage.style.display =
            "none";


        captureButton.disabled =
            false;


        setStatus(
            "الكاميرا جاهزة."
        );


    }

    catch(error){

        console.error(
            error
        );


        cameraMessage.innerHTML =
            "⚠️ تعذر تشغيل الكاميرا.<br><br>يمكنك اختيار صورة من الهاتف.";

        setStatus(
            "الكاميرا غير متاحة."
        );

    }

}


/* =================================================
   تحميل محرك OCR المحلي
================================================= */

async function initOCR(){

    if(worker){

        return worker;

    }


    loading.style.display =
        "flex";


    loadingText.textContent =
        "جاري تحميل قارئ العربية...";


    setStatus(
        "جاري تجهيز محرك القراءة..."
    );


    try{

        /*
        ============================================
        مهم:

        Tesseract سيستخدم الملفات المحلية.

        langPath:
        مجلد نموذج اللغة العربية.

        workerPath:
        ملف worker المحلي.

        corePath:
        ملفات Tesseract المحلية.

        ============================================
        */

        worker =
            await Tesseract.createWorker(
                "ara",
                1,
                {

                    workerPath:
                        "./worker.min.js",

                    langPath:
                        "./tessdata",

                    corePath:
                        "./tesseract-core/",

                    logger:
                    function(info){

                        if(
                            info.status ===
                            "loading tesseract core"
                        ){

                            loadingText.textContent =
                                "جاري تشغيل محرك OCR...";

                        }

                        else if(
                            info.status ===
                            "loading language traineddata"
                        ){

                            loadingText.textContent =
                                "جاري تحميل اللغة العربية...";

                        }

                        else if(
                            info.status ===
                            "recognizing text"
                        ){

                            const percent =
                                Math.round(
                                    (info.progress || 0)
                                    * 100
                                );


                            loadingText.textContent =
                                "جاري قراءة النص "
                                +
                                percent
                                +
                                "%";

                        }

                    }

                }
            );


        /*
           إعداد المستند
        */

        await worker.setParameters({

            tessedit_pageseg_mode:
                "3",

            preserve_interword_spaces:
                "1",

            user_defined_dpi:
                "300"

        });


        setStatus(
            "قارئ العربية جاهز."
        );


        return worker;

    }

    catch(error){

        console.error(
            "OCR INIT ERROR:",
            error
        );


        worker =
            null;


        throw error;

    }

    finally{

        loading.style.display =
            "none";

    }

}


/* =================================================
   تجهيز الصورة
================================================= */

function prepareImage(source){

    return new Promise(
        function(resolve,reject){

            const img =
                new Image();


            img.onload =
                function(){

                    let width =
                        img.naturalWidth;


                    let height =
                        img.naturalHeight;


                    /*
                       لا نصغر الصورة كثيرًا.
                    */

                    const maxWidth =
                        1800;


                    if(
                        width >
                        maxWidth
                    ){

                        const ratio =
                            maxWidth /
                            width;


                        width =
                            Math.round(
                                width *
                                ratio
                            );


                        height =
                            Math.round(
                                height *
                                ratio
                            );

                    }


                    canvas.width =
                        width;


                    canvas.height =
                        height;


                    const ctx =
                        canvas.getContext(
                            "2d"
                        );


                    /*
                       تحسين بسيط
                    */

                    ctx.filter =
                        "contrast(1.08) brightness(1.05)";


                    ctx.drawImage(
                        img,
                        0,
                        0,
                        width,
                        height
                    );


                    /*
                       إلغاء الفلتر
                    */

                    ctx.filter =
                        "none";


                    resolve(
                        canvas
                    );

                };


            img.onerror =
                function(){

                    reject(
                        new Error(
                            "تعذر فتح الصورة."
                        )
                    );

                };


            img.src =
                source;

        }
    );

}


/* =================================================
   تحويل File إلى DataURL
================================================= */

function fileToDataURL(file){

    return new Promise(
        function(resolve,reject){

            const reader =
                new FileReader();


            reader.onload =
                function(){

                    resolve(
                        reader.result
                    );

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(
                file
            );

        }
    );

}


/* =================================================
   تنظيف بسيط للنص
================================================= */

function cleanText(text){

    if(!text){

        return "";

    }


    /*
       لا نغير الحروف العربية.
    */

    text =
        text.replace(
            /\r/g,
            ""
        );


    /*
       حذف الرموز التي تكون
       غالبًا ضوضاء OCR
    */

    text =
        text.replace(
            /[|{}[\]<>~`^]+/g,
            " "
        );


    /*
       توحيد المسافات
    */

    text =
        text.replace(
            /[ \t]+/g,
            " "
        );


    /*
       تنظيف السطور
    */

    text =
        text
            .split("\n")
            .map(
                line =>
                    line.trim()
            )
            .filter(
                line =>
                    line.length > 0
            )
            .join("\n");


    return text.trim();

}


/* =================================================
   قراءة الصورة
================================================= */

async function readImage(source){

    if(busy){

        return;

    }


    busy =
        true;


    captureButton.disabled =
        true;


    try{

        loading.style.display =
            "flex";


        loadingText.textContent =
            "جاري تجهيز الصورة...";


        resultText.textContent =
            "جاري قراءة الصفحة...";


        setStatus(
            "جاري تجهيز المستند..."
        );


        /*
           تجهيز الصورة
        */

        const image =
            await prepareImage(
                source
            );


        /*
           الحصول على OCR
        */

        const ocr =
            await initOCR();


        setStatus(
            "جاري قراءة النص العربي..."
        );


        /*
           قراءة واحدة فقط
        */

        const result =
            await ocr.recognize(
                image
            );


        let text =
            result.data.text || "";


        text =
            cleanText(
                text
            );


        if(!text){

            resultText.textContent =
                "لم يتم العثور على نص واضح.";


            setStatus(
                "لم يتم العثور على نص."
            );


            speak(
                "لم أتمكن من قراءة النص. حاول تصوير الصفحة بشكل أوضح."
            );


            return;

        }


        /*
           عرض النص
        */

        resultText.textContent =
            text;


        lastText =
            text;


        setStatus(
            "تمت قراءة الصفحة."
        );


        /*
           نطق النص
        */

        speak(
            text
        );

    }

    catch(error){

        console.error(
            error
        );


        resultText.textContent =
            "حدث خطأ في قارئ النص العربي.";


        setStatus(
            "تعذر تشغيل قارئ العربية."
        );


        speak(
            "تعذر تشغيل قارئ النص العربي."
        );

    }

    finally{

        busy =
            false;


        captureButton.disabled =
            false;


        loading.style.display =
            "none";

    }

}


/* =================================================
   تصوير الصفحة
================================================= */

captureButton.addEventListener(
    "click",
    async function(){

        if(
            !video.videoWidth
        ){

            speak(
                "الكاميرا غير جاهزة."
            );

            return;

        }


        canvas.width =
            video.videoWidth;


        canvas.height =
            video.videoHeight;


        const ctx =
            canvas.getContext(
                "2d"
            );


        ctx.filter =
            "none";


        ctx.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
        );


        const image =
            canvas.toDataURL(
                "image/jpeg",
                0.95
            );


        await readImage(
            image
        );

    }
);


/* =================================================
   اختيار صورة
================================================= */

fileInput.addEventListener(
    "change",
    async function(event){

        const file =
            event.target.files[0];


        if(!file){

            return;

        }


        if(
            !file.type.startsWith(
                "image/"
            )
        ){

            speak(
                "الملف المختار ليس صورة."
            );

            return;

        }


        try{

            const image =
                await fileToDataURL(
                    file
                );


            await readImage(
                image
            );

        }

        catch(error){

            console.error(
                error
            );

        }


        event.target.value =
            "";

    }
);


/* =================================================
   إعادة القراءة
================================================= */

repeatButton.addEventListener(
    "click",
    function(){

        if(!lastText){

            speak(
                "لا يوجد نص لقراءته."
            );

            return;

        }


        speak(
            lastText
        );

    }
);


/* =================================================
   إيقاف الصوت
================================================= */

stopButton.addEventListener(
    "click",
    function(){

        if(
            "speechSynthesis"
            in window
        ){

            speechSynthesis.cancel();

        }

    }
);


/* =================================================
   بدء التطبيق
================================================= */

startButton.addEventListener(
    "click",
    async function(){

        welcome.style.display =
            "none";


        /*
           تشغيل الكاميرا
        */

        await startCamera();


        /*
           لا نحمل OCR الآن.

           سيتم تحميله عند أول صورة
           حتى لا نؤخر فتح التطبيق.
        */

        setTimeout(
            function(){

                speak(
                    "التطبيق جاهز. ضع الصفحة أمام الكاميرا واضغط تصوير."
                );

            },
            500
        );

    }
);


/* =================================================
   أصوات الهاتف
================================================= */

if(
    "speechSynthesis" in window
){

    speechSynthesis.onvoiceschanged =
        function(){

            speechSynthesis.getVoices();

        };

}

</script>

</body>

</html>
