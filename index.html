<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="description"
        content="تطبيق بصير الشامل لمساعدة المكفوفين"
    >

    <title>بصير - تطبيق مساعد للمكفوفين</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family:
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #000000;
            color: #ffffff;
            padding: 15px;
            min-height: 100vh;
        }

        /* =========================
           الرأس
        ========================= */

        header {
            width: 100%;
            min-height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom: 4px solid #ffff00;

            padding: 10px 0;
            margin-bottom: 15px;
        }

        h1 {
            color: #ffff00;
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
        }

        .top-btn {
            background: #222222;
            color: #ffff00;

            border: 2px solid #ffff00;
            border-radius: 10px;

            padding: 10px 15px;

            font-size: 1rem;
            font-weight: bold;

            cursor: pointer;
        }

        .top-btn:focus,
        .top-btn:active {
            background: #ffff00;
            color: #000000;
            outline: 3px solid #ffffff;
        }

        /* =========================
           سرعة الصوت
        ========================= */

        .speed-box {
            width: 100%;

            background: #111111;

            border: 2px solid #ffffff;
            border-radius: 12px;

            padding: 12px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;

            margin-bottom: 15px;
        }

        .speed-box label {
            color: #ffff00;
            font-size: 1.15rem;
            font-weight: bold;
        }

        .speed-box input {
            width: 50%;
            min-height: 30px;
        }

        /* =========================
           الشاشات
        ========================= */

        .screen {
            display: none;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .screen h2 {
            color: #ffff00;
            font-size: 1.7rem;
            margin-bottom: 5px;
        }

        .screen p {
            line-height: 1.7;
        }

        /* =========================
           الشاشة الرئيسية
        ========================= */

        .grid-container {
            width: 100%;

            display: grid;

            grid-template-columns: 1fr;

            gap: 12px;
        }

        .btn-large {
            width: 100%;

            min-height: 80px;

            padding: 18px;

            font-size: 1.3rem;
            font-weight: bold;

            text-align: right;

            background: #111111;
            color: #ffffff;

            border: 3px solid #ffffff;
            border-radius: 15px;

            cursor: pointer;
        }

        .btn-large:hover {
            background: #222222;
        }

        .btn-large:focus,
        .btn-large:active {
            background: #ffff00;
            color: #000000;

            outline: 4px solid #ffffff;
        }

        /* =========================
           أزرار العمليات
        ========================= */

        .action-btn {
            width: 100%;

            min-height: 70px;

            padding: 18px;

            font-size: 1.35rem;
            font-weight: bold;

            border-radius: 15px;
            border: 3px solid #ffffff;

            cursor: pointer;
        }

        .action-btn:focus,
        .action-btn:active {
            outline: 4px solid #ffff00;
            transform: scale(0.99);
        }

        .btn-blue {
            background: #0055ff;
            color: #ffffff;
        }

        .btn-green {
            background: #008000;
            color: #ffffff;
        }

        .btn-yellow {
            background: #d4a000;
            color: #000000;
        }

        .btn-red {
            background: #cc0000;
            color: #ffffff;
        }

        .btn-purple {
            background: #800080;
            color: #ffffff;
        }

        /* =========================
           صندوق الحالة
        ========================= */

        #status-box {
            width: 100%;

            background: #111111;

            border: 3px solid #ffff00;
            border-radius: 12px;

            padding: 15px;

            margin-top: 20px;

            min-height: 90px;

            color: #00ff00;

            font-size: 1.25rem;

            line-height: 1.7;

            text-align: center;

            word-break: break-word;
        }

        /* =========================
           إخفاء ملفات الكاميرا
        ========================= */

        input[type="file"] {
            display: none;
        }

        /* =========================
           تحسين الهاتف
        ========================= */

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            h1 {
                font-size: 1.6rem;
            }

            .btn-large {
                min-height: 75px;
                font-size: 1.15rem;
            }

            .action-btn {
                min-height: 70px;
                font-size: 1.2rem;
            }

            .speed-box label {
                font-size: 1rem;
            }

            #status-box {
                font-size: 1.1rem;
            }
        }

    </style>
</head>

<body>

    <!-- ==========================================
         رأس التطبيق
    =========================================== -->

    <header>

        <button
            id="backBtn"
            class="top-btn"
            aria-label="رجوع للشاشة الرئيسية"
            style="visibility: hidden;"
        >
            رجوع للخلف
        </button>

        <h1>تطبيق بصير</h1>

    </header>


    <!-- ==========================================
         التحكم في سرعة الصوت
    =========================================== -->

    <div class="speed-box">

        <label for="speedRange">
            سرعة الصوت:
        </label>

        <input
            type="range"
            id="speedRange"
            min="0.5"
            max="1.5"
            step="0.1"
            value="0.9"
            aria-label="تغيير سرعة الصوت"
        >

    </div>


    <!-- ==========================================
         الشاشة الرئيسية
    =========================================== -->

    <main
        id="homeScreen"
        class="screen active"
    >

        <div class="grid-container">

            <button
                class="btn-large"
                data-screen="ocrScreen"
                aria-label="القسم الأول: قراءة النصوص والمستندات"
            >
                القسم الأول: قراءة النصوص
            </button>


            <button
                class="btn-large"
                data-screen="objectScreen"
                aria-label="القسم الثاني: التعرف على الأشياء والصور"
            >
                القسم الثاني: التعرف على الأشياء
            </button>


            <button
                class="btn-large"
                data-screen="moneyScreen"
                aria-label="القسم الثالث: التعرف على العملات النقدية"
            >
                القسم الثالث: التعرف على العملات
            </button>


            <button
                class="btn-large"
                data-screen="humanHelpScreen"
                aria-label="القسم الرابع: المساعدة البشرية والطوارئ"
            >
                القسم الرابع: مساعدة بشرية وطوارئ
            </button>


            <button
                class="btn-large"
                data-screen="navScreen"
                aria-label="القسم الخامس: الملاحة والاتجاهات"
            >
                القسم الخامس: الملاحة والاتجاهات
            </button>


            <button
                class="btn-large"
                data-screen="libraryScreen"
                aria-label="القسم السادس: المكتبة الصوتية"
            >
                القسم السادس: المكتبة الصوتية
            </button>


            <button
                class="btn-large"
                data-screen="dailyScreen"
                aria-label="القسم السابع: الخدمات اليومية والألوان"
            >
                القسم السابع: الخدمات اليومية والألوان
            </button>
