<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق قارئ المستندات للمكفوفين</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between p-4">

    <!-- شاشة البداية لتفعيل الصوت والتطبيق لمساعدة المكفوف -->
    <div id="welcomeOverlay" class="fixed inset-0 bg-slate-950/98 z-50 flex flex-col items-center justify-center p-6 text-center">
        <div class="bg-indigo-900 border-4 border-indigo-500 p-8 rounded-3xl max-w-sm shadow-2xl">
            <h2 class="text-3xl font-bold mb-4">تطبيق قارئ 👁️</h2>
            <p class="text-indigo-200 text-base mb-8">جاهز لتشغيل الكاميرا وقراءة أي مستند أو ورقة حكومية فوراً وبصوت واضح.</p>
            <button id="startAppBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold py-5 px-6 rounded-2xl shadow-lg text-xl active:scale-95 transition">
                🚀 اضغط للبدء
            </button>
        </div>
    </div>

    <!-- الهيدر -->
    <header class="bg-indigo-800 shadow-lg p-4 text-center rounded-2xl mb-4">
        <h1 class="text-2xl font-extrabold">تطبيق قارئ المستندات</h1>
        <p class="text-indigo-200 text-xs mt-1">الوضع الصوتي المباشر للمكفوفين</p>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="container mx-auto flex-1 flex flex-col items-center justify-center max-w-md w-full">
        
        <!-- نافذة الكاميرا المباشرة -->
        <div class="relative w-full aspect-[3/4] bg-slate-800 rounded-3xl overflow-hidden shadow-2xl border-4 border-indigo-500 mb-4 flex items-center justify-center">
            <video id="cameraStream" autoplay playsinline muted class="w-full h-full object-cover"></video>
            <canvas id="snapshotCanvas" class="hidden"></canvas>
            <div id="cameraPlaceholder" class="absolute text-center p-4 text-slate-300 text-lg font-semibold">
                جاري تشغيل الكاميرا...
            </div>
        </div>

        <!-- زرار التقاط وقراءة الكاميرا (الرئيسي الكبير) -->
        <div class="w-full space-y-3">
            <button id="captureBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 transition text-white text-xl font-extrabold py-4 px-6 rounded-2xl shadow-xl flex items-center justify-center gap-3">
                <span>📸 اضغط لالتقاط وقراءة المستند</span>
            </button>

            <!-- زرار لاختيار صورة من المعرض كبديل سريع -->
            <label class="w-full bg-blue-600 hover:bg-blue-500 active:scale-95 transition text-white text-md font-bold py-3 px-6 rounded-2xl shadow-lg flex items-center justify-center gap-3 cursor-pointer">
                <span>📁 اختر ورقة من المعرض</span>
                <input type="file" id="galleryInput" accept="image/*" class="hidden">
            </label>

            <!-- زرار إعادة النطق -->
            <button id="repeatBtn" class="w-full bg-amber-600 hover:bg-amber-500 active:scale-95 transition text-white text-md font-semibold py-3 px-6 rounded-2xl shadow-md flex items-center justify-center gap-2">
                <span>🔊 إعادة قراءة آخر نص</span>
            </button>
        </div>

        <!-- صندوق عرض النص المستخرج -->
        <div class="w-full mt-4 bg-slate-800 border border-slate-700 p-4 rounded-2xl shadow-inner">
            <h2 class="text-xs font-semibold text-indigo-300 mb-1">النصوص المستخرجة:</h2>
            <p id="resultText" class="text-slate-100 min-h-[50px] text-sm leading-relaxed">وجه الكاميرا نحو الورقة ثم اضغط زر التقاط...</p>
        </div>

    </main>

    <!-- سكريبت التشغيل المتكامل -->
    <script>
        const video = document.getElementById('cameraStream');
        const canvas = document.getElementById('snapshotCanvas');
        const placeholder = document.getElementById('cameraPlaceholder');
        const captureBtn = document.getElementById('captureBtn');
        const galleryInput = document.getElementById('galleryInput');
        const repeatBtn = document.getElementById('repeatBtn');
        const resultText = document.getElementById('resultText');
        const welcomeOverlay = document.getElementById('welcomeOverlay');
        const startAppBtn = document.getElementById('startAppBtn');

        let lastSpokenText = "التطبيق جاهز للاستخدام.";

        // وظيفة النطق الصوتي الفصيح والواضح
        function speakArabic(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // إيقاف أي صوت قديم لتجنب التداخل
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA';
                utterance.rate = 0.85; // سرعة هادئة ومفهومة جداً
                utterance.pitch = 1.0;

                const voices = window.speechSynthesis.getVoices();
                const arabicVoice = voices.find(v => v.lang.startsWith('ar'));
                if (arabicVoice) utterance.voice = arabicVoice;

                window.speechSynthesis.speak(utterance);
                lastSpokenText = text;
            }
        }

        // تشغيل كاميرا الهاتف الخلفية تلقائياً
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { exact: 'environment' } }, 
                    audio: false 
                });
                video.srcObject = stream;
                placeholder.style.display = 'none';
            } catch (err) {
                try {
                    // محاولة بديلة لو الكاميرا الخلفية مش متاح الوصول ليها بال exact
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = fallbackStream;
                    placeholder.style.display = 'none';
                } catch (e) {
                    placeholder.innerHTML = "⚠️ تعذر تشغيل الكاميرا، استعمل زر المعرض.";
                    speakArabic("تعذر تشغيل الكاميرا، يجدر استخدام زر المعرض.");
                }
            }
        }

        startAppBtn.addEventListener('click', () => {
            welcomeOverlay.style.display = 'none';
            initCamera();
            setTimeout(() => {
                speakArabic("أهلاً بك يا إسلام. تم تفعيل الكاميرا، وجهها نحو المستند واضغط زر التقاط.");
            }, 600);
        });

        // دالة إرسال الصورة للمحرك السحابي الفائق ودقة قراءة العربي
        async function processImage(base64Image) {
            speakArabic("جاري قراءة وتحليل المستند، يرجى الانتظار...");
            resultText.innerText = "جاري قراءة المستند...";

            try {
                const formData = new FormData();
                formData.append('base64Image', base64Image);
                formData.append('language', 'ara');
                formData.append('isOverlayRequired', 'false');
                formData.append('scale', 'true');
                formData.append('OCREngine', '2'); // المحرك الثاني الأقوى للخطوط العربية والأختام
                formData.append('apikey', 'helloworld'); 

                const response = await fetch('https://api.ocr.space/parse/image', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data && data.ParsedResults && data.ParsedResults.length > 0) {
                    let extractedText = data.ParsedResults[0].ParsedText.trim();
                    extractedText = extractedText.replace(/\r/g, '').replace(/\n+/g, ' . ');

                    if (extractedText.length > 2) {
                        resultText.innerText = extractedText;
                        speakArabic("النص الموجود هو: " + extractedText);
                    } else {
                        resultText.innerText = "لم يتم العثور على نص واضح، اقترب من الورقة وحسن الإضاءة.";
                        speakArabic("لم أتمكن من قراءة كلمات واضحة، حاول تحسين الإضاءة وتصوير الورقة بوضوح.");
                    }
                } else {
                    resultText.innerText = "فشلت عملية قراءة المستند.";
                    speakArabic("تعذر قراءة المستند، حاول مرة أخرى.");
                }
            } catch (error) {
                console.error(error);
                resultText.innerText = "خطأ في الاتصال بالإنترنت.";
                speakArabic("حدث خطأ في الاتصال بالإنترنت.");
            }
        }

        // أخذ لقطة من الكاميرا المباشرة وقراءتها
        captureBtn.addEventListener('click', () => {
            if (!video.srcObject) {
                speakArabic("الكاميرا غير مفعلة.");
                return;
            }
            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            processImage(canvas.toDataURL('image/jpeg', 0.85));
        });

        // رفع صورة من المعرض وقراءتها
        galleryInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    processImage(e.target.result);
                };
                reader.readAsDataURL(file);
            }
        });

        repeatBtn.addEventListener('click', () => {
            speakArabic(lastSpokenText);
        });
    </script>
</body>
</html>
