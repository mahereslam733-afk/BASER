<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق بصير - Baseer App</title>
    <!-- مكتبات الذكاء الاصطناعي و ML Kit والرؤية للويب -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #2563eb;
            --accent: #f59e0b;
            --danger: #dc2626;
            --text: #f8fafc;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 15px;
            direction: rtl;
        }

        header {
            text-align: center;
            padding: 10px 0;
            border-bottom: 2px solid var(--primary);
            margin-bottom: 15px;
        }

        h1 { margin: 0; color: #60a5fa; font-size: 1.8rem; }
        p.subtitle { margin: 5px 0; color: #94a3b8; font-size: 0.9rem; }

        .camera-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto 15px auto;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }

        .output-box {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            min-height: 70px;
            border-right: 5px solid var(--accent);
            font-size: 1.1rem;
            line-height: 1.5;
        }

        .grid-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            max-width: 500px;
            margin: 0 auto;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 16px 10px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            transition: background 0.2s;
        }

        button:active { transform: scale(0.98); }
        button.danger { background-color: var(--danger); grid-column: span 2; }
        button.accent { background-color: var(--accent); color: #000; }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: 10px;
            margin-top: 15px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        select {
            background: var(--bg-color);
            color: var(--text);
            border: 1px solid var(--primary);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>👁️ تطبيق بصير</h1>
        <p class="subtitle">المساعد الذكي للمكفوفين وضعاف البصر</p>
    </header>

    <!-- شاشة الكاميرا -->
    <div class="camera-container">
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <!-- صندوق المخرجات الصوتية والنصية -->
    <div class="output-box" id="output">
        مرحباً بك في تطبيق بصير. حدد إحدى الخدمات أدناه للبدء.
    </div>

    <!-- إعدادات الصوت -->
    <div class="controls">
        <label for="speed">سرعة القراءة الصوتية:</label>
        <select id="speed" onchange="updateSpeed(this.value)">
            <option value="0.8">بطيئة (0.8x)</option>
            <option value="1.0" selected>عادية (1.0x)</option>
            <option value="1.3">سريعة (1.3x)</option>
            <option value="1.6">فائقة (1.6x)</option>
        </select>
    </div>

    <br>

    <!-- أزرار الوظائف الأساسية -->
    <div class="grid-buttons">
        <button onclick="detectObjects()">🔍 وصف المشهد والأشياء</button>
        <button onclick="readTextOCR()">📄 قراءة المستندات (OCR)</button>
        <button onclick="detectCurrency()">💵 التعرف على العملات</button>
        <button onclick="getGPSLocation()">📍 الملاحة والموقع (GPS)</button>
        <button class="accent" onclick="stopSpeech()">⏹️ إيقاف الصوت</button>
        <button class="danger" onclick="callVolunteer()">📞 طلب مساعدة بشرية</button>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const output = document.getElementById('output');
        let speechRate = 1.0;
        let cocoModel = null;

        // قاموس الترجمة للعربية
        const arabicDict = {
            "person": "شخص", "cell phone": "هاتف محمول", "laptop": "حاسوب محمول",
            "chair": "كرسي", "table": "طاولة", "bottle": "زجاجة", "cup": "كوب",
            "door": "باب", "book": "كتاب", "car": "سيارة", "key": "مفتاح",
            "bag": "حقيبة", "clock": "ساعة", "tv": "تلفاز", "pen": "قلم"
        };

        // 1. تشغيل الكاميرا تلقائياً
        async function setupCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" },
                    audio: false
                });
                video.srcObject = stream;
                speak("تم تشغيل الكاميرا بنجاح.");
            } catch (err) {
                updateOutput("تعذر الوصول إلى الكاميرا. يرجى إعطاء الصلاحية.");
            }
        }

        // 2. المحرك الصوتي العربي
        function speak(text) {
            window.speechSynthesis.cancel(); // إيقاف أي صوت سابق
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA';
            utterance.rate = speechRate;
            window.speechSynthesis.speak(utterance);
            updateOutput(text);
        }

        function stopSpeech() {
            window.speechSynthesis.cancel();
            updateOutput("تم إيقاف الصوت.");
        }

        function updateSpeed(val) {
            speechRate = parseFloat(val);
            speak(`تم تغيير سرعة الصوت إلى ${val}`);
        }

        function updateOutput(text) {
            output.innerText = text;
        }

        // 3. التعرف على الأشياء ووصف المشهد (AI)
        async function detectObjects() {
            updateOutput("جاري تحليل المشهد...");
            if (!cocoModel) {
                cocoModel = await cocoSsd.load();
            }
            const predictions = await cocoModel.detect(video);
            
            if (predictions.length > 0) {
                let items = predictions.map(p => arabicDict[p.class] || p.class);
                let uniqueItems = [...new Set(items)];
                let resultText = "أمامك الآن: " + uniqueItems.join(" و ");
                speak(resultText);
            } else {
                speak("لم أتمكن من التعرف على عناصر واضحة أمامك.");
            }
        }

        // 4. قراءة النصوص والمستندات (OCR)
        async function readTextOCR() {
            speak("جاري التقاط الصورة وقراءة النص...");
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            try {
                const { data: { text } } = await Tesseract.recognize(canvas, 'ara+eng');
                if (text.trim().length > 0) {
                    speak("النصر المقروء هو: " + text);
                } else {
                    speak("لم يتم العثور على أي نص واضح.");
                }
            } catch (e) {
                speak("حدث خطأ أثناء قراءة النص.");
            }
        }

        // 5. التعرف على العملات
        async function detectCurrency() {
            speak("جاري التعرّف على الفئة النقدية...");
            // محاكاة سريعة للتعرف على العملة لنموذج الرؤية
            setTimeout(() => {
                speak("العملة التي أمامك قريبة من فئة خمسين جنيهاً.");
            }, 1500);
        }

        // 6. الملاحة والموقع (GPS)
        function getGPSLocation() {
            if ("geolocation" in navigator) {
                speak("جاري تحديد موقعك الجغرافي...");
                navigator.geolocation.getCurrentPosition((position) => {
                    const lat = position.coords.latitude.toFixed(3);
                    const lng = position.coords.longitude.toFixed(3);
                    speak(`موقعك الحالي هو خط عرض ${lat} وخط طول ${lng}`);
                }, () => {
                    speak("تعذر الحصول على الموقع. تأكد من تفعيل خدمة GPS.");
                });
            } else {
                speak("خدمة الموقع غير مدعومة في هذا الجهاز.");
            }
        }

        // 7. المساعدة البشرية المباشرة (Be My Eyes)
        function callVolunteer() {
            speak("جاري الاتصال بمركز المساعدة البشرية والمتطوعين...");
            setTimeout(() => {
                window.location.href = "tel:123456789"; // استبدله برقم خدمة متطوعي بصير
            }, 1500);
        }

        // بدء التشغيل
        window.onload = setupCamera;
    </script>
</body>
</html>
