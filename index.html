<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>قارئ عربي ذكي</title>

<!-- Tesseract OCR -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#101827;
    color:white;
    font-family:Arial,"Tahoma",sans-serif;
}

button,
label{
    font-family:inherit;
}

.container{
    width:100%;
    max-width:600px;
    margin:auto;
    padding:15px;
}

.header{
    background:#273c75;
    border-radius:20px;
    padding:18px;
    text-align:center;
    margin-bottom:15px;
}

.header h1{
    margin:0;
    font-size:25px;
}

.header p{
    margin:8px 0 0;
    font-size:14px;
    color:#dbeafe;
}


/* الكاميرا */

.camera-box{
    position:relative;
    width:100%;
    height:65vh;
    max-height:700px;
    min-height:400px;
    background:#000;
    border:4px solid #4f46e5;
    border-radius:22px;
    overflow:hidden;
    margin-bottom:15px;
}

#camera{
    width:100%;
    height:100%;
    object-fit:cover;
}

.camera-message{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:#ddd;
    font-size:18px;
    padding:20px;
}


/* زر التقاط */

.capture{
    width:100%;
    border:0;
    background:#059669;
    color:white;
    font-size:21px;
    font-weight:bold;
    padding:18px;
    border-radius:18px;
    margin-bottom:10px;
}

.capture:disabled{
    opacity:.5;
}


/* المعرض */

.gallery{
    width:100%;
    background:#2563eb;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:15px;
    border-radius:18px;
    font-size:17px;
    font-weight:bold;
    margin-bottom:10px;
    cursor:pointer;
}

.gallery input{
    display:none;
}


/* إعادة القراءة */

.repeat{
    width:100%;
    background:#d97706;
    color:white;
    border:0;
    padding:15px;
    border-radius:18px;
    font-size:17px;
    font-weight:bold;
}


/* الحالة */

.status{
    background:#172554;
    border:1px solid #3730a3;
    border-radius:15px;
    padding:12px;
    text-align:center;
    margin-top:15px;
    font-size:14px;
}


/* النص */

.result{
    background:#1e293b;
    border:1px solid #334155;
    border-radius:18px;
    padding:15px;
    margin-top:12px;
}

.result-title{
    color:#a5b4fc;
    font-weight:bold;
    margin-bottom:10px;
}

#textResult{
    white-space:pre-wrap;
    line-height:2;
    font-size:17px;
    min-height:120px;
}


/* شاشة البداية */

#welcome{
    position:fixed;
    inset:0;
    background:#020617;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.welcome-card{
    width:100%;
    max-width:420px;
    background:#312e81;
    border:3px solid #6366f1;
    border-radius:25px;
    padding:30px 20px;
    text-align:center;
}

.welcome-card h2{
    font-size:30px;
    margin-top:0;
}

.start{
    width:100%;
    border:0;
    background:#059669;
    color:white;
    padding:18px;
    border-radius:17px;
    font-size:20px;
    font-weight:bold;
}


/* تحميل */

.loading{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    z-index:5000;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
}

.loading-box{
    background:#1e293b;
    border-radius:20px;
    padding:25px;
    width:90%;
    max-width:350px;
}

.spinner{
    width:45px;
    height:45px;
    border:5px solid #475569;
    border-top-color:#22c55e;
    border-radius:50%;
    margin:0 auto 15px;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

</style>

</head>


<body>


<!-- ======================================
     شاشة البداية
====================================== -->

<div id="welcome">

    <div class="welcome-card">

        <h2>
            📖 قارئ عربي
        </h2>

        <p>
            تصوير وقراءة المستندات العربية
        </p>

        <br>

        <button
            id="startButton"
            class="start">

            🚀 ابدأ التطبيق

        </button>

    </div>

</div>


<!-- ======================================
     شاشة التحميل
====================================== -->

<div id="loading"
     class="loading">

    <div class="loading-box">

        <div class="spinner"></div>

        <div id="loadingText">
            جاري القراءة...
        </div>

    </div>

</div>


<div class="container">


<!-- ======================================
     العنوان
====================================== -->

<div class="header">

    <h1>
        قارئ المستندات العربي
    </h1>

    <p>
        قراءة النصوص العربية بالكاميرا
    </p>

</div>


<!-- ======================================
     الكاميرا
====================================== -->

<div class="camera-box">

    <video
        id="camera"
        autoplay
        playsinline
        muted>
    </video>

    <div
        id="cameraMessage"
        class="camera-message">

        جاري تشغيل الكاميرا...

    </div>

</div>


<!-- Canvas مخفي -->

<canvas
    id="canvas"
    style="display:none;">
</canvas>


<!-- ======================================
     زر التصوير
====================================== -->

<button
    id="captureButton"
    class="capture">

    📸 تصوير وقراءة الصفحة

</button>


<!-- ======================================
     المعرض
====================================== -->

<label class="gallery">

    📁 اختيار صورة من الهاتف

    <input
        id="fileInput"
        type="file"
        accept="image/*">

</label>


<!-- ======================================
     إعادة القراءة
====================================== -->

<button
    id="repeatButton"
    class="repeat">

    🔊 إعادة قراءة النص

</button>


<!-- ======================================
     الحالة
====================================== -->

<div
    id="status"
    class="status">

    التطبيق جاهز

</div>


<!-- ======================================
     النص
====================================== -->

<div class="result">

    <div class="result-title">
        النص المستخرج:
    </div>

    <div id="textResult">

        وجّه الكاميرا نحو المستند
        واضغط تصوير.

    </div>

</div>


</div>


<script>


/* ======================================
   المتغيرات
====================================== */

const video =
    document.getElementById(
        "camera"
    );

const canvas =
    document.getElementById(
        "canvas"
    );

const cameraMessage =
    document.getElementById(
        "cameraMessage"
    );

const captureButton =
    document.getElementById(
        "captureButton"
    );

const fileInput =
    document.getElementById(
        "fileInput"
    );

const repeatButton =
    document.getElementById(
        "repeatButton"
    );

const status =
    document.getElementById(
        "status"
    );

const textResult =
    document.getElementById(
        "textResult"
    );

const welcome =
    document.getElementById(
        "welcome"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const loading =
    document.getElementById(
        "loading"
    );

const loadingText =
    document.getElementById(
        "loadingText"
    );


let cameraStream = null;

let ocrWorker = null;

let lastText = "";

let reading = false;


/* ======================================
   الحالة
====================================== */

function setStatus(message){

    status.textContent =
        message;

}


/* ======================================
   النطق العربي
====================================== */

function speak(text){

    if(!text){
        return;
    }

    if(
        !("speechSynthesis" in window)
    ){
        return;
    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "ar-EG";


    utterance.rate =
        0.78;


    utterance.pitch =
        1;


    utterance.volume =
        1;


    const voices =
        speechSynthesis.getVoices();


    const arabicVoice =
        voices.find(
            v =>
            v.lang === "ar-EG"
        )
        ||
        voices.find(
            v =>
            v.lang.startsWith("ar")
        );


    if(arabicVoice){

        utterance.voice =
            arabicVoice;

    }


    speechSynthesis.speak(
        utterance
    );


    lastText =
        text;

}


/* ======================================
   تشغيل الكاميرا
====================================== */

async function startCamera(){

    try{

        cameraStream =
            await navigator.mediaDevices
                .getUserMedia({

                    video:{
                        facingMode:{
                            ideal:
                            "environment"
                        },

                        width:{
                            ideal:1920
                        },

                        height:{
                            ideal:1080
                        }
                    },

                    audio:false

                });


        video.srcObject =
            cameraStream;


        cameraMessage.style.display =
            "none";


        setStatus(
            "الكاميرا جاهزة."
        );

    }

    catch(error){

        console.error(error);


        cameraMessage.innerHTML =
            "⚠️ تعذر تشغيل الكاميرا<br><br>استخدم اختيار صورة من الهاتف.";

        setStatus(
            "الكاميرا غير متاحة."
        );

    }

}


/* ======================================
   بدء التطبيق
====================================== */

startButton.addEventListener(
    "click",
    async function(){

        welcome.style.display =
            "none";


        await startCamera();


        setTimeout(
            function(){

                speak(
                    "التطبيق جاهز. ضع الصفحة أمام الكاميرا واضغط تصوير."
                );

            },
            500
        );

    }
);


/* ======================================
   تجهيز Tesseract
====================================== */

async function createOCR(){

    if(ocrWorker){

        return ocrWorker;

    }


    loading.style.display =
        "flex";


    loadingText.textContent =
        "جاري تحميل اللغة العربية لأول مرة...";


    setStatus(
        "جاري تحميل محرك اللغة العربية..."
    );


    try{

        ocrWorker =
            await Tesseract.createWorker(
                "ara",
                1,
                {

                    logger:
                    function(info){

                        if(
                            info.status ===
                            "recognizing text"
                        ){

                            const percent =
                                Math.round(
                                    (info.progress || 0)
                                    * 100
                                );

                            loadingText.textContent =
                                "جاري قراءة النص: "
                                + percent
                                + "%";

                        }

                    }

                }
            );


        /*
           إعداد قراءة المستند
        */

        await ocrWorker.setParameters({

            tessedit_pageseg_mode:
                "6",

            preserve_interword_spaces:
                "1",

            user_defined_dpi:
                "300"

        });


        setStatus(
            "محرك العربية جاهز."
        );


        return ocrWorker;

    }

    catch(error){

        console.error(error);

        throw error;

    }

    finally{

        loading.style.display =
            "none";

    }

}


/* ======================================
   تجهيز صورة المستند
====================================== */

function prepareImage(source){

    return new Promise(
        function(resolve,reject){

            const image =
                new Image();


            image.onload =
                function(){

                    /*
                       تحديد حجم مناسب
                       حتى لا تصبح المعالجة
                       بطيئة جدًا
                    */

                    const maxWidth =
                        1800;


                    let width =
                        image.naturalWidth;


                    let height =
                        image.naturalHeight;


                    if(
                        width > maxWidth
                    ){

                        const ratio =
                            maxWidth / width;


                        width =
                            Math.round(
                                width * ratio
                            );


                        height =
                            Math.round(
                                height * ratio
                            );

                    }


                    canvas.width =
                        width;


                    canvas.height =
                        height;


                    const ctx =
                        canvas.getContext(
                            "2d"
                        );


                    /*
                       تحسين خفيف فقط
                    */

                    ctx.filter =
                        "contrast(1.08) brightness(1.05)";


                    ctx.drawImage(
                        image,
                        0,
                        0,
                        width,
                        height
                    );


                    resolve(
                        canvas
                    );

                };


            image.onerror =
                function(){

                    reject(
                        new Error(
                            "تعذر تحميل الصورة"
                        )
                    );

                };


            image.src =
                source;

        }
    );

}


/* ======================================
   قراءة الصورة
====================================== */

async function readImage(source){

    if(reading){

        return;

    }


    reading = true;


    captureButton.disabled =
        true;


    try{

        loading.style.display =
            "flex";


        loadingText.textContent =
            "جاري تجهيز الصورة...";


        resultText.textContent =
            "جاري القراءة...";


        setStatus(
            "جاري تجهيز المستند..."
        );


        /*
           تحسين الصورة مرة واحدة
        */

        const image =
            await prepareImage(
                source
            );


        setStatus(
            "جاري قراءة النص العربي..."
        );


        /*
           تحميل محرك OCR
        */

        const worker =
            await createOCR();


        /*
           قراءة واحدة فقط
        */

        const result =
            await worker.recognize(
                image
            );


        let text =
            result.data.text || "";


        /*
           تنظيف بسيط جدًا
           بدون تغيير الكلمات
        */

        text =
            cleanText(text);


        if(!text){

            resultText.textContent =
                "لم يتم العثور على نص واضح.";


            setStatus(
                "لم يتم العثور على نص."
            );


            speak(
                "لم أتمكن من قراءة النص. حاول تصوير الصفحة بوضوح أكبر."
            );


            return;

        }


        /*
           عرض النص
        */

        resultText.textContent =
            text;


        lastText =
            text;


        setStatus(
            "تمت قراءة الصفحة."
        );


        /*
           نطق النص
        */

        speak(
            text
        );

    }

    catch(error){

        console.error(
            "OCR ERROR:",
            error
        );


        resultText.textContent =
            "حدث خطأ أثناء قراءة الصفحة.";


        setStatus(
            "حدث خطأ أثناء القراءة."
        );


        speak(
            "حدث خطأ أثناء قراءة الصفحة."
        );

    }

    finally{

        reading =
            false;


        captureButton.disabled =
            false;


        loading.style.display =
            "none";

    }

}


/* ======================================
   تنظيف النص
====================================== */

function cleanText(text){

    if(!text){

        return "";

    }


    /*
       حذف بعض الرموز غير المفيدة
       مع الحفاظ على العربية
    */

    text =
        text.replace(
            /[|{}[\]<>~`^]+/g,
            " "
        );


    /*
       توحيد المسافات
    */

    text =
        text.replace(
            /[ \t]+/g,
            " "
        );


    /*
       إزالة الفراغات من بداية
       ونهاية السطور
    */

    text =
        text
            .split("\n")
            .map(
                line =>
                    line.trim()
            )
            .filter(
                line =>
                    line.length > 0
            )
            .join("\n");


    return text.trim();

}


/* ======================================
   التقاط صورة من الكاميرا
====================================== */

captureButton.addEventListener(
    "click",
    async function(){

        if(
            !video.srcObject ||
            !video.videoWidth
        ){

            speak(
                "الكاميرا غير جاهزة."
            );

            return;

        }


        canvas.width =
            video.videoWidth;


        canvas.height =
            video.videoHeight;


        const ctx =
            canvas.getContext(
                "2d"
            );


        /*
           لا نعكس الصورة
        */

        ctx.filter =
            "none";


        ctx.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
        );


        const image =
            canvas.toDataURL(
                "image/jpeg",
                0.95
            );


        await readImage(
            image
        );

    }
);


/* ======================================
   اختيار صورة من المعرض
====================================== */

fileInput.addEventListener(
    "change",
    async function(event){

        const file =
            event.target.files[0];


        if(!file){

            return;

        }


        if(
            !file.type.startsWith(
                "image/"
            )
        ){

            speak(
                "الملف المختار ليس صورة."
            );

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            async function(e){

                await readImage(
                    e.target.result
                );

            };


        reader.readAsDataURL(
            file
        );


        /*
           السماح باختيار
           نفس الصورة مرة أخرى
        */

        event.target.value =
            "";

    }
);


/* ======================================
   إعادة القراءة
====================================== */

repeatButton.addEventListener(
    "click",
    function(){

        if(!lastText){

            speak(
                "لا يوجد نص لقراءته."
            );

            return;

        }


        speak(
            lastText
        );

    }
);


/* ======================================
   تحميل أصوات الجهاز
====================================== */

if(
    "speechSynthesis" in window
){

    speechSynthesis.onvoiceschanged =
        function(){

            speechSynthesis.getVoices();

        };

}

</script>

</body>

</html>
