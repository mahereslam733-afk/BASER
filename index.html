<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>بصير الذكي - Baser AI</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:15px;
    background:#080d18;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

h1{
    font-size:24px;
    margin:8px 0;
    color:#00e5ff;
}

.subtitle{
    color:#94a3b8;
    margin-bottom:18px;
}

.mic{
    width:82px;
    height:82px;
    border-radius:50%;
    border:3px solid #00e5ff;
    background:#111827;
    color:#00e5ff;
    font-size:32px;
    margin-bottom:15px;
}

#keyBox{
    max-width:500px;
    margin:auto;
    background:#111827;
    padding:12px;
    border-radius:12px;
    margin-bottom:15px;
}

#apiKey{
    width:100%;
    padding:12px;
    background:#020617;
    border:1px solid #475569;
    border-radius:8px;
    color:white;
    direction:ltr;
    margin-bottom:8px;
}

.save{
    width:100%;
    padding:12px;
    border:0;
    border-radius:8px;
    background:#16a34a;
    color:white;
    font-weight:bold;
}

#cameraBox{
    display:none;
    position:relative;
    max-width:500px;
    margin:auto;
    border:2px solid #00e5ff;
    border-radius:12px;
    overflow:hidden;
    background:black;
}

#video{
    width:100%;
    max-height:320px;
    display:block;
    object-fit:cover;
}

.close{
    position:absolute;
    top:10px;
    left:10px;
    z-index:5;
    background:#dc2626;
    color:white;
    border:0;
    border-radius:7px;
    padding:8px 12px;
    font-weight:bold;
}

#analyze{
    display:none;
    margin:12px auto;
    padding:14px 22px;
    border:0;
    border-radius:10px;
    background:#00e5ff;
    color:#001018;
    font-size:16px;
    font-weight:bold;
}

.grid{
    max-width:500px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
}

.btn{
    min-height:88px;
    border:0;
    border-radius:12px;
    color:white;
    font-weight:bold;
    font-size:13px;
    padding:8px 4px;
}

.btn:active{
    transform:scale(.95);
}

.icon{
    display:block;
    font-size:23px;
    margin-bottom:7px;
}

.teal{background:#115e59}
.purple{background:#581c87}
.orange{background:#9a3412}
.blue{background:#1e3a8a}
.dark{background:#1e293b}
.red{background:linear-gradient(90deg,#7f1d1d,#4c1d95)}

.bottom{
    max-width:500px;
    margin:9px auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

#status{
    max-width:500px;
    margin:15px auto;
    background:#172033;
    border-right:4px solid #00e5ff;
    padding:15px;
    border-radius:9px;
    color:#38bdf8;
    text-align:right;
    line-height:1.8;
    white-space:pre-wrap;
}
</style>
</head>

<body>

<h1>بصير الذكي</h1>

<div class="subtitle">
مساعد ذكي لمساعدة المكفوفين
</div>

<button class="mic" onclick="welcome()">
🎤
</button>

<div id="keyBox">

<input
id="apiKey"
type="password"
placeholder="أدخل مفتاح Gemini API"
>

<button class="save" onclick="saveKey()">
حفظ مفتاح Gemini
</button>

</div>

<div id="cameraBox">

<button class="close" onclick="closeCamera()">
إغلاق ✕
</button>

<video
id="video"
autoplay
playsinline>
</video>

</div>

<button
id="analyze"
onclick="analyzeImage()">

🧠 تحليل الصورة

</button>

<div class="grid">

<button class="btn teal"
onclick="openCamera('اقرأ جميع النصوص الظاهرة في الصورة حرفياً باللغة العربية. إذا كان جزء من النص غير واضح فلا تخمنه.')">

<span class="icon">📄</span>
قراءة النصوص

</button>

<button class="btn purple"
onclick="openCamera('صف المشهد بالتفصيل لشخص كفيف. اذكر الأشخاص والأشياء والعوائق والاتجاهات والألوان المهمة. لا تخمن المعلومات غير الواضحة.')">

<span class="icon">📷</span>
التعرف على الأشياء

</button>

<button class="btn orange"
onclick="openCamera('اقرأ محتوى الكتاب أو المستند الظاهر في الصورة باللغة العربية بدقة.')">

<span class="icon">📖</span>
الكتب والمستندات

</button>

<button class="btn blue"
onclick="openCamera('حدد العملة الورقية الظاهرة في الصورة والدولة والفئة إن أمكن. إذا لم تكن متأكداً قل غير متأكد ولا تخمن.')">

<span class="icon">🪙</span>
التعرف على العملات

</button>

<button class="btn teal"
onclick="underDevelopment('المساعد الصوتي')">

<span class="icon">🎧</span>
المساعد الصوتي

</button>

<button class="btn blue"
onclick="getLocation()">

<span class="icon">🧭</span>
الملاحة والتنقل

</button>

<button class="btn blue"
onclick="underDevelopment('قراءة الباركود')">

<span class="icon">📊</span>
قراءة الباركود

</button>

<button class="btn orange"
onclick="underDevelopment('التعلم والتعليم')">

<span class="icon">🎓</span>
التعلم والتعليم

</button>

<button class="btn teal"
onclick="underDevelopment('البحث الصوتي')">

<span class="icon">🔍</span>
البحث الصوتي

</button>

<button class="btn teal"
onclick="underDevelopment('التعرف على الوجوه')">

<span class="icon">👤</span>
التعرف على الوجوه

</button>

<button class="btn purple"
onclick="underDevelopment('التعرف على الألوان')">

<span class="icon">🎨</span>
التعرف على الألوان

</button>

<button class="btn dark"
onclick="underDevelopment('سجل المعلومات')">

<span class="icon">🕒</span>
سجل المعلومات

</button>

</div>

<div class="bottom">

<button class="btn dark"
onclick="underDevelopment('الدعم بدون إنترنت')">

<span class="icon">⚡</span>
دعم بدون إنترنت

</button>

<button class="btn red"
onclick="emergency()">

<span class="icon">🚨</span>
طوارئ

</button>

</div>

<div id="status">
أهلاً بك في تطبيق بصير. اختر الوظيفة التي تريد استخدامها.
</div>

<canvas id="canvas" style="display:none"></canvas>

<script>

let stream=null;
let promptText="";

let GEMINI_API_KEY=
localStorage.getItem("baserGeminiKey")||"";


function status(text){

document.getElementById("status").innerText=text;

}


function speak(text){

if(!window.speechSynthesis)return;

speechSynthesis.cancel();

let u=
new SpeechSynthesisUtterance(text);

u.lang="ar-EG";
u.rate=1;

speechSynthesis.speak(u);

}


function welcome(){

speak(
"مرحباً بك في تطبيق بصير الذكي"
);

}


function saveKey(){

let key=
document.getElementById("apiKey").value.trim();

if(!key){

status("من فضلك أدخل مفتاح Gemini.");

speak(
"من فضلك أدخل مفتاح جيميني"
);

return;
}

GEMINI_API_KEY=key;

localStorage.setItem(
"baserGeminiKey",
key
);

status(
"تم حفظ مفتاح Gemini بنجاح."
);

speak(
"تم حفظ مفتاح جيميني بنجاح"
);

}


async function openCamera(prompt){

promptText=prompt;

if(!navigator.mediaDevices||
!navigator.mediaDevices.getUserMedia){

status(
"المتصفح لا يدعم تشغيل الكاميرا."
);

speak(
"المتصفح لا يدعم تشغيل الكاميرا"
);

return;
}

document.getElementById(
"cameraBox"
).style.display="block";

document.getElementById(
"analyze"
).style.display="block";

status(
"تم فتح الكاميرا. وجهها نحو الهدف واضغط تحليل الصورة."
);

speak(
"تم فتح الكاميرا. وجهها نحو الهدف واضغط تحليل الصورة"
);

try{

if(stream){

stream.getTracks().forEach(
track=>track.stop()
);

}

stream=
await navigator.mediaDevices.getUserMedia({

video:{
facingMode:"environment"
},

audio:false

});

let video=
document.getElementById("video");

video.srcObject=stream;

await video.play();

}catch(error){

console.error(error);

status(
"تعذر فتح الكاميرا. اسمح للتطبيق باستخدام الكاميرا."
);

speak(
"تعذر فتح الكاميرا"
);

}

}


function closeCamera(){

if(stream){

stream.getTracks().forEach(
track=>track.stop()
);

stream=null;

}

document.getElementById(
"video"
).srcObject=null;

document.getElementById(
"cameraBox"
).style.display="none";

document.getElementById(
"analyze"
).style.display="none";

status(
"تم إغلاق الكاميرا."
);

speak(
"تم إغلاق الكاميرا"
);

}


async function analyzeImage(){

if(!GEMINI_API_KEY){

status(
"أدخل مفتاح Gemini أولاً ثم اضغط حفظ مفتاح Gemini."
);

speak(
"أدخل مفتاح جيميني أولاً"
);

return;

}

let video=
document.getElementById("video");

if(!video.videoWidth){

status(
"انتظر حتى تظهر صورة الكاميرا."
);

return;

}

let canvas=
document.getElementById("canvas");

canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

let ctx=
canvas.getContext("2d");

ctx.drawImage(
video,
0,
0,
canvas.width,
canvas.height
);

let image=
canvas.toDataURL(
"image/jpeg",
0.85
).split(",")[1];

status(
"جاري تحليل الصورة... انتظر قليلاً."
);

speak(
"جاري تحليل الصورة"
);

try{

let response=
await fetch(

"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key="
+
encodeURIComponent(GEMINI_API_KEY),

{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

contents:[

{

parts:[

{
text:promptText
},

{

inline_data:{

mime_type:
"image/jpeg",

data:image

}

}

]

}

],

generationConfig:{

temperature:0.2,
maxOutputTokens:800

}

})

}

);

let data=
await response.json();

console.log(data);

if(!response.ok){

let message=
data?.error?.message||
"حدث خطأ غير معروف.";

status(
"خطأ Gemini:\n"+message
);

speak(
"حدث خطأ في جيميني"
);

return;

}

let result="";

if(data.candidates){

for(
let candidate of data.candidates
){

if(candidate.content?.parts){

for(
let part of candidate.content.parts
){

if(part.text){

result+=part.text;

}

}

}

}

}

result=result.trim();

if(!result){

status(
"لم يتم الحصول على نتيجة."
);

speak(
"لم يتم الحصول على نتيجة"
);

return;

}

status(
"النتيجة:\n\n"+result
);

speak(result);

}catch(error){

console.error(error);

status(
"حدث خطأ في الاتصال. تأكد من الإنترنت ومفتاح Gemini."
);

speak(
"حدث خطأ في الاتصال بالذكاء الاصطناعي"
);

}

}


function underDevelopment(name){

let message=
"خاصية "+
name+
" قيد التطوير وسيتم تفعيلها قريباً.";

status(message);

speak(message);

}


function emergency(){

status(
"جاري فتح اتصال الطوارئ..."
);

speak(
"جاري الاتصال بالطوارئ"
);

setTimeout(()=>{

window.location.href="tel:123";

},1500);

}


function getLocation(){

if(!navigator.geolocation){

status(
"تحديد الموقع غير مدعوم."
);

return;

}

status(
"جاري تحديد موقعك..."
);

speak(
"جاري تحديد موقعك"
);

navigator.geolocation.getCurrentPosition(

position=>{

let lat=
position.coords.latitude
.toFixed(5);

let lng=
position.coords.longitude
.toFixed(5);

let result=
"تم تحديد موقعك.\n"+
"خط العرض: "+
lat+
"\nخط الطول: "+
lng;

status(result);

speak(
"تم تحديد موقعك بنجاح"
);

},

error=>{

console.log(error);

status(
"تعذر تحديد موقعك. تأكد من تشغيل GPS والسماح للموقع."
);

speak(
"تعذر تحديد موقعك"
);

},

{

enableHighAccuracy:true,
timeout:15000,
maximumAge:0

}

);


}


window.addEventListener(
"load",
()=>{

if(GEMINI_API_KEY){

status(
"مفتاح Gemini محفوظ. تطبيق بصير جاهز."
);

}

}
);

</script>

</body>
</html>
