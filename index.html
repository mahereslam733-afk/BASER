<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق بصير - Baser</title>
    <!-- استدعاء مكتبة قراءة النصوص الحقيقية (Tesseract.js) -->
    <script src="https://unpkg.com/tesseract.js@v4.0.2/dist/tesseract.min.js"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        h2 {
            font-size: 18px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .mic-container {
            margin-bottom: 20px;
        }
        .mic-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #0f172a;
            border: 3px solid #00f2fe;
            color: #00f2fe;
            font-size: 32px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        #mediaContainer {
            max-width: 500px;
            margin: 0 auto 15px auto;
            display: none;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            border: 2px solid #00f2fe;
        }
        video {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            display: block;
        }
        .close-cam {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            z-index: 10;
        }
        .capture-btn {
            margin: 10px auto;
            padding: 12px 24px;
            background-color: #00f2fe;
            color: #0b0f19;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            display: none;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 500px;
            margin: 0 auto;
        }
        .feature-btn {
            padding: 12px 5px;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 85px;
            transition: 0.2s;
        }
        .feature-btn:active {
            transform: scale(0.95);
        }
        .btn-teal { background-color: #115e59; }
        .btn-purple { background-color: #581c87; }
        .btn-orange { background-color: #7c2d12; }
        .btn-blue { background-color: #1e3a8a; }
        .btn-darkblue { background-color: #1e293b; }
        .btn-darkred { background-color: #7f1d1d; background-image: linear-gradient(to right, #7f1d1d, #4c1d95); }

        .feature-btn span:first-child {
            font-size: 20px;
            margin-bottom: 5px;
        }
        .bottom-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            max-width: 500px;
            margin: 10px auto 0 auto;
        }
        #statusBox {
            margin-top: 15px;
            padding: 15px;
            background: #1e293b;
            border-radius: 8px;
            font-size: 15px;
            color: #38bdf8;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            text-align: right;
            border-right: 4px solid #00f2fe;
        }
    </style>
</head>
<body>

    <h2>كيف يمكنني مساعدتك اليوم؟</h2>

    <!-- زر الميكروفون الرئيسي -->
    <div class="mic-container">
        <button class="mic-btn" onclick="speakText('مرحباً بك في تطبيق بصير')">🎤</button>
    </div>

    <!-- نافذة عرض الكاميرا -->
    <div id="mediaContainer">
        <button class="close-cam" onclick="stopCamera()">إغلاق الكاميرا ✕</button>
        <video id="cameraStream" autoplay playsinline></video>
    </div>
    
    <button id="captureBtn" class="capture-btn" onclick="captureAndReadText()">التقاط وقراءة النص 📸</button>
    <canvas id="canvas" style="display:none;"></canvas>

    <!-- شبكة الأزرار الأصلية كاملة -->
    <div class="grid-container">
        <button class="feature-btn btn-teal" onclick="triggerAction('الاتصال بمطوع', 'tel:01000000000', 'جاري الاتصال بالمطوع')">
            <span>📞</span><span>اتصل بمطوع</span>
        </button>
        <button class="feature-btn btn-teal" onclick="startCamera()">
            <span>📄</span><span>قراءة النصوص</span>
        </button>
        <button class="feature-btn btn-purple" onclick="triggerAction('التعرف على الأشياء', null, 'جاري تفعيل التعرف على الأشياء')">
            <span>📷</span><span>التعرف على الأشياء</span>
        </button>

        <button class="feature-btn btn-purple" onclick="triggerAction('المساعد الصوتي', null, 'المساعد الصوتي جاهز')">
            <span>🎧</span><span>المساعد الصوتي</span>
        </button>
        <button class="feature-btn btn-orange" onclick="startCamera()">
            <span>📖</span><span>الكتب والمستندات</span>
        </button>
        <button class="feature-btn btn-blue" onclick="getGPSLocation()">
            <span>🧭</span><span>الملاحة والتنقل</span>
        </button>

        <button class="feature-btn btn-blue" onclick="triggerAction('قراءة الباركود', null, 'جاري تشغيل قارئ الباركود')">
            <span>📊</span><span>قراءة الباركود</span>
        </button>
        <button class="feature-btn btn-orange" onclick="triggerAction('التعلم والتعليم', null, 'قسم التعلم والتعليم')">
            <span>🎓</span><span>التعلم والتعليم</span>
        </button>
        <button class="feature-btn btn-teal" onclick="triggerAction('البحث الصوتي', null, 'جاري البحث الصوتي')">
            <span>🔍</span><span>البحث الصوتي</span>
        </button>

        <button class="feature-btn btn-teal" onclick="triggerAction('التعرف على الوجوه', null, 'جاري التعرف على الوجوه')">
            <span>👤</span><span>التعرف على الوجوه</span>
        </button>
        <button class="feature-btn btn-purple" onclick="triggerAction('التعرف على الألوان', null, 'جاري فحص الألوان')">
            <span>🎨</span><span>التعرف على الألوان</span>
        </button>
        <button class="feature-btn btn-blue" onclick="triggerAction('التعرف على العملات', null, 'جاري التعرف على العملات')">
            <span>🪙</span><span>التعرف على العملات</span>
        </button>

        <button class="feature-btn btn-darkblue" onclick="triggerAction('سجل المعلومات', null, 'فتح سجل المعلومات')">
            <span>🕒</span><span>سجل المعلومات</span>
        </button>
        <button class="feature-btn btn-blue" onclick="getGPSLocation()">
            <span>📍</span><span>مشاركة موقعي</span>
        </button>
        <button class="feature-btn btn-darkblue" onclick="getGPSLocation()">
            <span>🏢</span><span>الملاحة الداخلية</span>
        </button>
    </div>

    <!-- الصف الأخير -->
    <div class="bottom-grid">
        <button class="feature-btn btn-darkblue" onclick="triggerAction('دعم بدون إنترنت', null, 'وضع عدم الاتصال مفعل')">
            <span>⚡</span><span>دعم بدون إنترنت</span>
        </button>
        <button class="feature-btn btn-darkred" onclick="triggerAction('حالة الطوارئ', 'tel:123', 'جاري الاتصال بالطوارئ')">
            <span>🚨</span><span>طوارئ</span>
        </button>
    </div>

    <!-- صندوق عرض الحالات والنتائج -->
    <div id="statusBox">أهلاً بك في تطبيق بصير. انقر على أي زر للبدء.</div>

    <script>
        let currentStream = null;

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA';
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        async function startCamera() {
            const container = document.getElementById('mediaContainer');
            const video = document.getElementById('cameraStream');
            container.style.display = 'block';
            document.getElementById('captureBtn').style.display = 'inline-block';
            document.getElementById('statusBox').innerText = "تم فتح الكاميرا. وجهها نحو النص واضغط زر التقاط.";
            speakText("تم فتح الكاميرا، وجهها نحو النص");

            try {
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }
                currentStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { exact: "environment" } } 
                }).catch(() => {
                    return navigator.mediaDevices.getUserMedia({ video: true });
                });
                video.srcObject = currentStream;
            } catch (err) {
                document.getElementById('statusBox').innerText = "تعذر فتح الكاميرا، يرجى السماح بالصلاحيات.";
                speakText("تعذر فتح الكاميرا");
            }
        }

        function stopCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
            document.getElementById('mediaContainer').style.display = 'none';
            document.getElementById('captureBtn').style.display = 'none';
            document.getElementById('statusBox').innerText = "تم إغلاق الكاميرا.";
            speakText("تم إغلاق الكاميرا");
        }

        function captureAndReadText() {
            const video = document.getElementById('cameraStream');
            const canvas = document.getElementById('canvas');
            const statusBox = document.getElementById('statusBox');
            
            if (!video.srcObject) {
                alert("الكاميرا غير مفعلة!");
                return;
            }

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            let ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            let imageDataUrl = canvas.toDataURL('image/png');
            statusBox.innerText = "جاري قراءة وتحليل النص من الصورة... انتظر لحظات";
            speakText("جاري قراءة النص");

            Tesseract.recognize(
                imageDataUrl,
                'ara+eng',
                { logger: m => console.log(m) }
            ).then(({ data: { text } }) => {
                let cleanResult = text.trim();
                if (cleanResult.length > 0) {
                    statusBox.innerText = "النص المستخرج: " + cleanResult;
                    speakText("النص هو: " + cleanResult);
                } else {
                    statusBox.innerText = "لم يتم العثور على نص واضح، جرب مرة أخرى بوضوح.";
                    speakText("لم أتمكن من العثور على نص واضح");
                }
            }).catch(err => {
                statusBox.innerText = "حدث خطأ أثناء معالجة الصورة.";
                speakText("حدث خطأ في القراءة");
            });
        }

        function triggerAction(name, link, speechMessage) {
            document.getElementById('statusBox').innerText = "تم تفعيل: " + name;
            speakText(speechMessage);
            if (link) {
                setTimeout(() => { window.location.href = link; }, 2000);
            }
        }

        function getGPSLocation() {
            document.getElementById('statusBox').innerText = "جاري تحديد الموقع الجغرافي...";
            speakText("جاري تحديد موقعك الجغرافي للملاحة");
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    let lat = pos.coords.latitude.toFixed(4);
                    let lng = pos.coords.longitude.toFixed(4);
                    let text = `موقعك الحالي - خط العرض: ${lat}، خط الطول: ${lng}`;
                    document.getElementById('statusBox').innerText = text;
                    speakText("تم تحديد موقعك بنجاح");
                }, () => {
                    document.getElementById('statusBox').innerText = "تعذر تحديد الموقع، تأكد من تفعيل GPS.";
                    speakText("تعذر تحديد الموقع الجغرافي");
                });
            }
        }
    </script>
</body>
</html>
