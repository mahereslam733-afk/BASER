<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تطبيق بصير الذكي - Baser AI</title>

<style>
body {
    background-color: #0b0f19;
    color: #ffffff;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 15px;
    text-align: center;
}

h2 {
    font-size: 18px;
    color: #94a3b8;
    margin-bottom: 20px;
}

.mic-container {
    margin-bottom: 20px;
}

.mic-btn {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background-color: #0f172a;
    border: 3px solid #00f2fe;
    color: #00f2fe;
    font-size: 32px;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

#mediaContainer {
    max-width: 500px;
    margin: 0 auto 15px auto;
    display: none;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    border: 2px solid #00f2fe;
}

video {
    width: 100%;
    max-height: 250px;
    object-fit: cover;
    display: block;
}

.close-cam {
    position: absolute;
    top: 10px;
    left: 10px;
    background: #dc2626;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    z-index: 10;
}

.action-btn {
    margin: 5px auto;
    padding: 12px 20px;
    background-color: #00f2fe;
    color: #0b0f19;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    display: none;
}

.action-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.grid-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    max-width: 500px;
    margin: 0 auto;
}

.feature-btn {
    padding: 12px 5px;
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 85px;
    transition: 0.2s;
}

.feature-btn:active {
    transform: scale(0.95);
}

.btn-teal { background-color: #115e59; }
.btn-purple { background-color: #581c87; }
.btn-orange { background-color: #7c2d12; }
.btn-blue { background-color: #1e3a8a; }
.btn-darkblue { background-color: #1e293b; }

.btn-darkred {
    background-color: #7f1d1d;
    background-image: linear-gradient(to right, #7f1d1d, #4c1d95);
}

.feature-btn span:first-child {
    font-size: 20px;
    margin-bottom: 5px;
}

.bottom-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    max-width: 500px;
    margin: 10px auto 0 auto;
}

#statusBox {
    margin-top: 15px;
    padding: 15px;
    background: #1e293b;
    border-radius: 8px;
    font-size: 15px;
    color: #38bdf8;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
    text-align: right;
    border-right: 4px solid #00f2fe;
    line-height: 1.7;
    word-break: break-word;
}
</style>
</head>

<body>

<h2>كيف يمكنني مساعدتك اليوم؟</h2>

<div class="mic-container">
    <button class="mic-btn"
        type="button"
        onclick="speakText('مرحباً بك في تطبيق بصير الذكي')">
        🎤
    </button>
</div>

<div id="mediaContainer">
    <button class="close-cam"
        type="button"
        onclick="stopCamera()">
        إغلاق الكاميرا ✕
    </button>

    <video id="cameraStream"
        autoplay
        playsinline
        muted>
    </video>
</div>

<button id="aiAnalyzeBtn"
    class="action-btn"
    type="button"
    onclick="analyzeWithAI()">
    تحليل المشهد بالذكاء الاصطناعي 🧠
</button>

<canvas id="canvas" style="display:none;"></canvas>

<div class="grid-container">

    <button class="feature-btn btn-teal"
        onclick="triggerAction(
            'الاتصال بمطوع',
            'tel:01000000000',
            'جاري الاتصال بالمطوع'
        )">
        <span>📞</span>
        <span>اتصل بمطوع</span>
    </button>

    <button class="feature-btn btn-teal"
        onclick="startCameraForAI(
            'اقرأ جميع النصوص الموجودة في الصورة حرفياً باللغة العربية. حافظ على ترتيب الأسطر، واقرأ الأرقام والرموز. إذا كان النص غير واضح فقل إن النص غير واضح ولا تخمن.'
        )">
        <span>📄</span>
        <span>قراءة النصوص</span>
    </button>

    <button class="feature-btn btn-purple"
        onclick="startCameraForAI(
            'صف لي الأشياء الموجودة أمام الكاميرا لشخص مكفوف. اذكر أهم شيء أولاً، ومكانه التقريبي، ولونه أو شكله إن كان واضحاً. لا تذكر أي شيء غير مؤكد.'
        )">
        <span>📷</span>
        <span>التعرف على الأشياء</span>
    </button>

    <button class="feature-btn btn-purple"
        onclick="notifyUnderDevelopment('المساعد الصوتي')">
        <span>🎧</span>
        <span>المساعد الصوتي</span>
    </button>

    <button class="feature-btn btn-orange"
        onclick="startCameraForAI(
            'اقرأ محتوى الكتاب أو المستند الظاهر في الصورة بدقة. ابدأ بالعنوان إن وجد ثم اقرأ النص بالترتيب. لا تلخص ولا تضف كلمات غير ظاهرة.'
        )">
        <span>📖</span>
        <span>الكتب والمستندات</span>
    </button>

    <button class="feature-btn btn-blue"
        onclick="getGPSLocation()">
        <span>🧭</span>
        <span>الملاحة والتنقل</span>
    </button>

    <button class="feature-btn btn-blue"
        onclick="notifyUnderDevelopment('قراءة الباركود')">
        <span>📊</span>
        <span>قراءة الباركود</span>
    </button>

    <button class="feature-btn btn-orange"
        onclick="notifyUnderDevelopment('التعلم والتعليم')">
        <span>🎓</span>
        <span>التعلم والتعليم</span>
    </button>

    <button class="feature-btn btn-teal"
        onclick="notifyUnderDevelopment('البحث الصوتي')">
        <span>🔍</span>
        <span>البحث الصوتي</span>
    </button>

    <button class="feature-btn btn-teal"
        onclick="notifyUnderDevelopment('التعرف على الوجوه')">
        <span>👤</span>
        <span>التعرف على الوجوه</span>
    </button>

    <button class="feature-btn btn-purple"
        onclick="notifyUnderDevelopment('التعرف على الألوان')">
        <span>🎨</span>
        <span>التعرف على الألوان</span>
    </button>

    <button class="feature-btn btn-blue"
        onclick="startCameraForAI(
            'حلل الورقة النقدية الظاهرة في الصورة. حدد الدولة واسم العملة والقيمة إن أمكن. إذا لم تكن متأكداً فقل غير متأكد ولا تخمن. لا تعتمد على اللون فقط.'
        )">
        <span>🪙</span>
        <span>التعرف على العملات</span>
    </button>

    <button class="feature-btn btn-darkblue"
        onclick="notifyUnderDevelopment('سجل المعلومات')">
        <span>🕒</span>
        <span>سجل المعلومات</span>
    </button>

    <button class="feature-btn btn-blue"
        onclick="getGPSLocation()">
        <span>📍</span>
        <span>مشاركة موقعي</span>
    </button>

    <button class="feature-btn btn-darkblue"
        onclick="getGPSLocation()">
        <span>🏢</span>
        <span>الملاحة الداخلية</span>
    </button>
</div>

<div class="bottom-grid">
    <button class="feature-btn btn-darkblue"
        onclick="notifyUnderDevelopment('دعم بدون إنترنت')">
        <span>⚡</span>
        <span>دعم بدون إنترنت</span>
    </button>

    <button class="feature-btn btn-darkred"
        onclick="triggerAction(
            'حالة الطوارئ',
            'tel:123',
            'جاري الاتصال بالطوارئ'
        )">
        <span>🚨</span>
        <span>طوارئ</span>
    </button>
</div>

<div id="statusBox">
    أهلاً بك في تطبيق بصير. الكاميرا جاهزة للتحليل.
</div>

<script>
let currentStream = null;
let currentPrompt =
    "صف لي ما يوجد في هذا المشهد بشكل دقيق ومفيد لشخص مكفوف.";
let isAnalyzing = false;

/*
  استبدل النص بمفتاح جديد للاختبار المحلي فقط.
  لا تنشر المفتاح داخل الموقع.
*/
const GEMINI_API_KEY = "ضع_مفتاح_Gemini_الجديد_هنا";
const GEMINI_MODEL = "gemini-2.5-flash";

function speakText(text) {
    if (!("speechSynthesis" in window)) return;

    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(String(text));
    utterance.lang = "ar-SA";
    utterance.rate = 0.95;
    utterance.pitch = 1;
    utterance.volume = 1;

    window.speechSynthesis.speak(utterance);
}

function setStatus(message, speak = false) {
    document.getElementById("statusBox").innerText = message;

    if (speak) {
        speakText(message);
    }
}

function stopCurrentTracks() {
    if (!currentStream) return;

    currentStream.getTracks().forEach(track => track.stop());
    currentStream = null;
}

function waitForVideoReady(video, timeout = 10000) {
    return new Promise((resolve, reject) => {
        if (video.readyState >= 2 && video.videoWidth > 0) {
            resolve();
            return;
        }

        const startTime = Date.now();

        function checkVideo() {
            if (video.readyState >= 2 && video.videoWidth > 0) {
                resolve();
            } else if (Date.now() - startTime > timeout) {
                reject(new Error("لم تصبح الكاميرا جاهزة"));
            } else {
                requestAnimationFrame(checkVideo);
            }
        }

        checkVideo();
    });
}

async function startCameraForAI(promptText) {
    currentPrompt = promptText;

    const container = document.getElementById("mediaContainer");
    const video = document.getElementById("cameraStream");
    const analyzeButton = document.getElementById("aiAnalyzeBtn");

    container.style.display = "block";
    analyzeButton.style.display = "inline-block";
    analyzeButton.disabled = true;

    setStatus(
        "جارٍ فتح الكاميرا. وجّه الهاتف نحو الهدف...",
        true
    );

    try {
        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {
            throw new Error("المتصفح لا يدعم الكاميرا");
        }

        stopCurrentTracks();

        let stream;

        try {
            stream = await navigator.mediaDevices.getUserMedia({
                audio: false,
                video: {
                    facingMode: { ideal: "environment" },
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            });
        } catch (error) {
            stream = await navigator.mediaDevices.getUserMedia({
                audio: false,
                video: true
            });
        }

        currentStream = stream;
        video.srcObject = stream;

        await video.play();
        await waitForVideoReady(video);

        analyzeButton.disabled = false;

        setStatus(
            "الكاميرا جاهزة. اضغط تحليل المشهد.",
            true
        );

    } catch (error) {
        console.error("Camera error:", error);

        stopCurrentTracks();
        container.style.display = "none";
        analyzeButton.disabled = true;

        setStatus(
            "تعذر فتح الكاميرا. اسمح بصلاحية الكاميرا وشغّل الموقع عبر HTTPS أو localhost.",
            true
        );
    }
}

function stopCamera() {
    stopCurrentTracks();

    const video = document.getElementById("cameraStream");
    video.srcObject = null;

    document.getElementById("mediaContainer").style.display = "none";
    document.getElementById("aiAnalyzeBtn").style.display = "none";
    document.getElementById("aiAnalyzeBtn").disabled = false;

    setStatus("تم إغلاق الكاميرا.", true);
}

function captureFrame() {
    const video = document.getElementById("cameraStream");
    const canvas = document.getElementById("canvas");

    if (
        video.readyState < 2 ||
        !video.videoWidth ||
        !video.videoHeight
    ) {
        throw new Error("الكاميرا لم تصبح جاهزة بعد");
    }

    const maxWidth = 1280;
    const scale = Math.min(1, maxWidth / video.videoWidth);

    canvas.width = Math.round(video.videoWidth * scale);
    canvas.height = Math.round(video.videoHeight * scale);

    const context = canvas.getContext("2d");
    context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    return canvas
        .toDataURL("image/jpeg", 0.88)
        .split(",")[1];
}

function getGeminiText(data) {
    return data?.candidates?.[0]?.content?.parts
        ?.map(part => part.text || "")
        .join(" ")
        .trim() || "";
}

function getErrorMessage(data, status) {
    if (status === 400) {
        return "الطلب غير صحيح أو الصورة غير صالحة.";
    }

    if (status === 401 || status === 403) {
        return "مفتاح Gemini غير صالح أو غير مسموح باستخدامه.";
    }

    if (status === 429) {
        return "تم تجاوز عدد الطلبات المسموح بها. حاول بعد قليل.";
    }

    if (status >= 500) {
        return "خادم الذكاء الاصطناعي غير متاح حاليًا.";
    }

    return data?.error?.message ||
        `حدث خطأ في الخادم رقم ${status}.`;
}

async function analyzeWithAI() {
    if (isAnalyzing) return;

    const video = document.getElementById("cameraStream");
    const button = document.getElementById("aiAnalyzeBtn");

    if (!video.srcObject) {
        setStatus("الكاميرا غير مفعلة.", true);
        return;
    }

    if (
        !GEMINI_API_KEY ||
        GEMINI_API_KEY === "ضع_مفتاح_Gemini_الجديد_هنا"
    ) {
        setStatus(
            "ضع مفتاح Gemini الجديد داخل الكود للاختبار.",
            true
        );
        return;
    }

    isAnalyzing = true;
    button.disabled = true;
    button.innerText = "جاري التحليل...";

    try {
        await waitForVideoReady(video);

        const base64Image = captureFrame();

        setStatus(
            "جاري تحليل الصورة، انتظر لحظات...",
            true
        );

        const endpoint =
            "https://generativelanguage.googleapis.com/" +
            "v1beta/models/" +
            GEMINI_MODEL +
            ":generateContent";

        const response = await fetch(endpoint, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "x-goog-api-key": GEMINI_API_KEY
            },
            body: JSON.stringify({
                contents: [
                    {
                        role: "user",
                        parts: [
                            {
                                text:
                                    currentPrompt +
                                    "

أجب باللغة العربية. " +
                                    "استخدم جملاً قصيرة وواضحة. " +
                                    "لا تخمن، وإذا كانت الصورة غير واضحة فاذكر ذلك."
                            },
                            {
                                inline_data: {
                                    mime_type: "image/jpeg",
                                    data: base64Image
                                }
                            }
                        ]
                    }
                ],
                generationConfig: {
                    temperature: 0.2,
                    maxOutputTokens: 500
                }
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                getErrorMessage(data, response.status)
            );
        }

        const result = getGeminiText(data);

        if (!result) {
            throw new Error(
                "لم تصل نتيجة مفهومة من الذكاء الاصطناعي."
            );
        }

        document.getElementById("statusBox").innerText =
            "النتيجة: " + result;

        speakText(result);

    } catch (error) {
        console.error("AI error:", error);

        const message =
            error.message === "Failed to fetch"
                ? "تعذر الاتصال. تحقق من الإنترنت أو إعدادات الخادم."
                : error.message;

        setStatus(message, true);

    } finally {
        isAnalyzing = false;
        button.disabled = false;
        button.innerText =
            "تحليل المشهد بالذكاء الاصطناعي 🧠";
    }
}

function notifyUnderDevelopment(featureName) {
    const message =
        `خاصية ${featureName} قيد التطوير وسيتم تفعيلها قريبًا`;

    setStatus(message, true);
}

function triggerAction(name, link, speechMessage) {
    setStatus("تم تفعيل: " + name);
    speakText(speechMessage);

    if (link) {
        setTimeout(() => {
            window.location.href = link;
        }, 2000);
    }
}

function getGPSLocation() {
    setStatus(
        "جاري تحديد الموقع الجغرافي...",
        true
    );

    if (!navigator.geolocation) {
        setStatus(
            "المتصفح لا يدعم تحديد الموقع.",
            true
        );
        return;
    }

    navigator.geolocation.getCurrentPosition(
        position => {
            const lat =
                position.coords.latitude.toFixed(5);
            const lng =
                position.coords.longitude.toFixed(5);

            const message =
                `موقعك الحالي: خط العرض ${lat}، ` +
                `خط الطول ${lng}`;

            setStatus(message);

            speakText(
                `تم تحديد موقعك. خط العرض ${lat}. خط الطول ${lng}`
            );
        },
        error => {
            console.error("GPS error:", error);

            setStatus(
                "تعذر تحديد الموقع. فعّل GPS واسمح للموقع بالصلاحية.",
                true
            );
        },
        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }
    );
}

window.addEventListener(
    "beforeunload",
    stopCurrentTracks
);
</script>

</body>
</html>
