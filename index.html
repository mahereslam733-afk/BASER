<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,
maximum-scale=1.0,user-scalable=no">

<title>بصير - قارئ النص العربي</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
margin:0;
padding:12px;
background:#0f172a;
color:#fff;
font-family:Arial,Tahoma,sans-serif;
}

.app{
max-width:650px;
margin:auto;
}

h1{
background:#3730a3;
text-align:center;
padding:18px;
border-radius:20px;
margin:0 0 15px;
font-size:25px;
}

.camera{
position:relative;
width:100%;
height:55vh;
min-height:320px;
background:#000;
border:4px solid #6366f1;
border-radius:20px;
overflow:hidden;
}

video{
width:100%;
height:100%;
object-fit:cover;
}

.cameraMessage{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
font-size:19px;
padding:20px;
}

button,
.fileButton{
width:100%;
border:0;
border-radius:18px;
padding:18px;
margin-top:12px;
color:white;
font-size:19px;
font-weight:bold;
cursor:pointer;
}

.capture{
background:#059669;
}

.gallery{
background:#2563eb;
}

.repeat{
background:#d97706;
}

.stop{
background:#dc2626;
}

input{
display:none;
}

button:disabled{
opacity:.5;
}

.status{
margin-top:14px;
background:#172554;
padding:14px;
border-radius:15px;
text-align:center;
font-size:17px;
}

.result{
margin-top:14px;
background:#1e293b;
padding:16px;
border-radius:18px;
}

.resultTitle{
color:#a5b4fc;
font-weight:bold;
font-size:18px;
margin-bottom:10px;
}

#result{
white-space:pre-wrap;
line-height:2;
font-size:18px;
min-height:140px;
direction:rtl;
text-align:right;
}

#loading{
display:none;
position:fixed;
inset:0;
z-index:9999;
background:rgba(0,0,0,.88);
align-items:center;
justify-content:center;
}

.loadingBox{
width:90%;
max-width:370px;
background:#1e293b;
padding:30px;
border-radius:22px;
text-align:center;
}

.spinner{
width:50px;
height:50px;
border:5px solid #475569;
border-top-color:#22c55e;
border-radius:50%;
animation:spin 1s linear infinite;
margin:0 auto 18px;
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}

#loadingText{
font-size:18px;
line-height:1.8;
}

#welcome{
position:fixed;
inset:0;
z-index:10000;
background:#020617;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.welcomeBox{
width:100%;
max-width:420px;
background:#312e81;
border:3px solid #6366f1;
border-radius:25px;
padding:30px 20px;
text-align:center;
}

.start{
background:#059669;
}

.note{
font-size:14px;
color:#c7d2fe;
line-height:1.8;
}

</style>

</head>

<body>

<!-- =========================
     شاشة البداية
========================= -->

<div id="welcome">

<div class="welcomeBox">

<h2>📖 بصير</h2>

<h3>قارئ المستندات العربية</h3>

<p>
صوّر الصفحة أو اختر صورة من الهاتف
</p>

<p class="note">
يعمل بدون Gemini وبدون API Key
</p>

<button
id="start"
class="start">

🚀 ابدأ

</button>

</div>

</div>


<!-- =========================
     شاشة التحميل
========================= -->

<div id="loading">

<div class="loadingBox">

<div class="spinner"></div>

<div id="loadingText">
جاري تشغيل قارئ العربية...
</div>

</div>

</div>


<!-- =========================
     التطبيق
========================= -->

<div class="app">

<h1>
📖 قارئ المستندات
</h1>


<!-- الكاميرا -->

<div class="camera">

<video
id="video"
autoplay
playsinline
muted>
</video>

<div
id="cameraMessage"
class="cameraMessage">

اضغط ابدأ لتشغيل الكاميرا

</div>

</div>


<canvas
id="canvas"
style="display:none">
</canvas>


<!-- تصوير -->

<button
id="capture"
class="capture">

📸 تصوير وقراءة الصفحة

</button>


<!-- صورة من الهاتف -->

<label
class="fileButton gallery">

📁 اختيار صورة من الهاتف

<input
id="file"
type="file"
accept="image/*">

</label>


<!-- إعادة القراءة -->

<button
id="repeat"
class="repeat">

🔊 إعادة قراءة النص

</button>


<!-- إيقاف -->

<button
id="stop"
class="stop">

🔇 إيقاف القراءة

</button>


<!-- الحالة -->

<div
id="status"
class="status">

جاهز

</div>


<!-- النتيجة -->

<div class="result">

<div class="resultTitle">
النص المستخرج:
</div>

<div id="result">

لم يتم التقاط أي نص بعد.

</div>

</div>

</div>


<script>

/* ==================================================
   العناصر
================================================== */

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const startButton =
document.getElementById("start");

const captureButton =
document.getElementById("capture");

const fileInput =
document.getElementById("file");

const repeatButton =
document.getElementById("repeat");

const stopButton =
document.getElementById("stop");

const result =
document.getElementById("result");

const status =
document.getElementById("status");

const welcome =
document.getElementById("welcome");

const cameraMessage =
document.getElementById("cameraMessage");

const loading =
document.getElementById("loading");

const loadingText =
document.getElementById("loadingText");


let stream = null;

let worker = null;

let lastText = "";

let busy = false;


/* ==================================================
   الحالة
================================================== */

function setStatus(text){

status.textContent = text;

}


/* ==================================================
   الصوت العربي
================================================== */

function speak(text){

if(!text){
return;
}

if(!("speechSynthesis" in window)){
return;
}

speechSynthesis.cancel();

const utterance =
new SpeechSynthesisUtterance(text);

utterance.lang = "ar-EG";

utterance.rate = 0.78;

utterance.pitch = 1;

utterance.volume = 1;

const voices =
speechSynthesis.getVoices();

const arabicVoice =
voices.find(
v => v.lang.toLowerCase() === "ar-eg"
)
||
voices.find(
v => v.lang.toLowerCase().startsWith("ar")
);

if(arabicVoice){

utterance.voice =
arabicVoice;

}

speechSynthesis.speak(
utterance
);

}


/* ==================================================
   تشغيل الكاميرا
================================================== */

async function startCamera(){

try{

if(
!navigator.mediaDevices ||
!navigator.mediaDevices.getUserMedia
){

throw new Error(
"الكاميرا غير مدعومة"
);

}

stream =
await navigator.mediaDevices.getUserMedia({

video:{
facingMode:{
ideal:"environment"
},

width:{
ideal:1920
},

height:{
ideal:1080
}

},

audio:false

});

video.srcObject =
stream;

await video.play();

cameraMessage.style.display =
"none";

setStatus(
"الكاميرا جاهزة"
);

}

catch(error){

console.error(
"CAMERA ERROR:",
error
);

cameraMessage.innerHTML =
"تعذر تشغيل الكاميرا.<br><br>استخدم اختيار صورة من الهاتف.";

setStatus(
"الكاميرا غير متاحة"
);

}

}


/* ==================================================
   تشغيل Tesseract
================================================== */

async function startOCR(){

if(worker){

return worker;

}

loading.style.display =
"flex";

loadingText.textContent =
"جاري تحميل محرك قراءة العربية...";

try{

worker =
await Tesseract.createWorker(
"ara",
1,
{

workerPath:
"https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/worker.min.js",

langPath:
"https://tessdata.projectnaptha.com/4.0.0",

corePath:
"https://cdn.jsdelivr.net/npm/tesseract.js-core@5.0.0",

logger:function(info){

console.log(info);

if(
info.status ===
"loading tesseract core"
){

loadingText.textContent =
"جاري تحميل محرك OCR...";

}

else if(
info.status ===
"loading language traineddata"
){

loadingText.textContent =
"جاري تحميل اللغة العربية...";

}

else if(
info.status ===
"initializing api"
){

loadingText.textContent =
"جاري تجهيز قارئ العربية...";

}

else if(
info.status ===
"recognizing text"
){

const percent =
Math.round(
(info.progress || 0) * 100
);

loadingText.textContent =
"جاري قراءة الصفحة "
+
percent
+
"%";

}

}

}
);


await worker.setParameters({

tessedit_pageseg_mode:
"3",

preserve_interword_spaces:
"1",

user_defined_dpi:
"300",

language_model_ngram_on:
"1"

});


setStatus(
"قارئ العربية جاهز"
);

return worker;

}

catch(error){

console.error(
"TESSERACT ERROR:",
error
);

worker = null;

setStatus(
"فشل تشغيل قارئ العربية"
);

result.textContent =
"تعذر تحميل قارئ العربية. تأكد من اتصال الإنترنت ثم حاول مرة أخرى.";

throw error;

}

finally{

loading.style.display =
"none";

}

}


/* ==================================================
   تجهيز الصورة
================================================== */

function prepareImage(source){

return new Promise(
(resolve,reject)=>{

const img =
new Image();

img.onload =
function(){

let width =
img.naturalWidth;

let height =
img.naturalHeight;


/*
   نحافظ على دقة جيدة
*/

const maxWidth =
2000;

if(width > maxWidth){

const ratio =
maxWidth / width;

width =
Math.round(
width * ratio
);

height =
Math.round(
height * ratio
);

}


canvas.width =
width;

canvas.height =
height;


const ctx =
canvas.getContext(
"2d",
{
willReadFrequently:true
}
);


/*
   رسم الصورة الأصلية
*/

ctx.drawImage(
img,
0,
0,
width,
height
);


/*
   تحسين بسيط جدًا
   بدون تحويل الصورة
   إلى رمادية بالكامل
*/

const imageData =
ctx.getImageData(
0,
0,
width,
height
);

const data =
imageData.data;

for(
let i=0;
i<data.length;
i+=4
){

let r =
data[i];

let g =
data[i+1];

let b =
data[i+2];


/*
   تحسين التباين
*/

r =
(r-128)*1.18+128;

g =
(g-128)*1.18+128;

b =
(b-128)*1.18+128;


data[i] =
Math.max(
0,
Math.min(255,r)
);

data[i+1] =
Math.max(
0,
Math.min(255,g)
);

data[i+2] =
Math.max(
0,
Math.min(255,b)
);

}


ctx.putImageData(
imageData,
0,
0
);


resolve(canvas);

};


img.onerror =
function(){

reject(
new Error(
"تعذر فتح الصورة"
)
);

};


img.src =
source;

});

}


/* ==================================================
   تنظيف النص
================================================== */

function cleanText(text){

if(!text){
return "";
}


/*
   إزالة رموز OCR الواضحة
   فقط، بدون تغيير الكلمات
*/

text =
text.replace(
/\r/g,
""
);

text =
text.replace(
/[|{}<>~`^]/g,
" "
);


/*
   إزالة المسافات الزائدة
*/

text =
text.replace(
/[ \t]+/g,
" "
);


/*
   الحفاظ على الأسطر
*/

const lines =
text
.split("\n")
.map(
line =>
line.trim()
)
.filter(
line =>
line.length > 0
);


/*
   حذف السطر الذي يحتوي
   على رموز فقط
*/

const goodLines =
lines.filter(
line =>
/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FFA-Za-z0-9]/.test(line)
);


return goodLines
.join("\n")
.trim();

}


/* ==================================================
   قراءة الصورة
================================================== */

async function readImage(source){

if(busy){

return;

}

busy = true;

captureButton.disabled =
true;

loading.style.display =
"flex";

try{

result.textContent =
"جاري قراءة الصفحة...";

setStatus(
"جاري تجهيز الصورة..."
);


const image =
await prepareImage(
source
);


const ocr =
await startOCR();


setStatus(
"جاري قراءة النص العربي..."
);


loadingText.textContent =
"جاري قراءة الصفحة...";


const data =
await ocr.recognize(
image
);


let text =
data.data.text || "";


text =
cleanText(text);


if(!text){

result.textContent =
"لم يتم العثور على نص واضح.";

setStatus(
"لم يتم العثور على نص"
);

speak(
"لم أتمكن من قراءة النص. حاول تصوير الصفحة بصورة أوضح."
);

return;

}


result.textContent =
text;

lastText =
text;


setStatus(
"تمت قراءة الصفحة بنجاح"
);


/*
   قراءة النص كاملًا
*/

speak(text);

}

catch(error){

console.error(
"READ ERROR:",
error
);

result.textContent =
"حدث خطأ أثناء قراءة الصفحة. حاول مرة أخرى.";

setStatus(
"حدث خطأ أثناء القراءة"
);

speak(
"حدث خطأ أثناء قراءة الصفحة."
);

}

finally{

busy = false;

captureButton.disabled =
false;

loading.style.display =
"none";

}

}


/* ==================================================
   بدء التطبيق
================================================== */

startButton.addEventListener(
"click",
async function(){

welcome.style.display =
"none";

await startCamera();

setTimeout(
function(){

speak(
"التطبيق جاهز. ضع المستند أمام الكاميرا واضغط تصوير."
);

},
700
);

});


/* ==================================================
   التقاط صورة
================================================== */

captureButton.addEventListener(
"click",
async function(){

if(!video.videoWidth){

speak(
"الكاميرا غير جاهزة."
);

return;

}


let width =
video.videoWidth;

let height =
video.videoHeight;


/*
   لا نقلل الدقة كثيرًا
*/

const maxWidth =
2000;

if(width > maxWidth){

const ratio =
maxWidth / width;

width =
Math.round(
width * ratio
);

height =
Math.round(
height * ratio
);

}


canvas.width =
width;

canvas.height =
height;


const ctx =
canvas.getContext(
"2d"
);


/*
   الصورة الأصلية
*/

ctx.drawImage(
video,
0,
0,
width,
height
);


const image =
canvas.toDataURL(
"image/jpeg",
0.96
);


await readImage(
image
);

});


/* ==================================================
   اختيار صورة
================================================== */

fileInput.addEventListener(
"change",
async function(event){

const selectedFile =
event.target.files[0];

if(!selectedFile){

return;

}


if(
!selectedFile.type.startsWith(
"image/"
)
){

speak(
"الملف المختار ليس صورة."
);

return;

}


const reader =
new FileReader();


reader.onload =
async function(){

await readImage(
reader.result
);

};


reader.onerror =
function(){

setStatus(
"تعذر فتح الصورة"
);

};


reader.readAsDataURL(
selectedFile
);


/*
   السماح باختيار نفس الصورة مرة أخرى
*/

fileInput.value = "";

});


/* ==================================================
   إعادة القراءة
================================================== */

repeatButton.addEventListener(
"click",
function(){

if(lastText){

speak(
lastText
);

}

else{

speak(
"لا يوجد نص لقراءته."
);

}

});


/* ==================================================
   إيقاف الصوت
================================================== */

stopButton.addEventListener(
"click",
function(){

if(
"speechSynthesis"
in window
){

speechSynthesis.cancel();

}

});


/* ==================================================
   أصوات الهاتف
================================================== */

if(
"speechSynthesis"
in window
){

speechSynthesis.onvoiceschanged =
function(){

speechSynthesis.getVoices();

};

}

</script>

</body>

</html>
