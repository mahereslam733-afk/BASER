<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق إبصار الذكي - TokenRa Edition</title>
    <style>
        :root {
            --bg-color: #070913;
            --card-bg: #111827;
            --accent-cyan: #06b6d4;
            --accent-blue: #3b82f6;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 12px;
            text-align: center;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #1f2937;
        }
        h1 {
            font-size: 20px;
            margin: 0;
            color: var(--accent-cyan);
        }
        .mic-container {
            margin-bottom: 15px;
        }
        .mic-btn {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: radial-gradient(circle, #0e7490, #082f49);
            border: 3px solid var(--accent-cyan);
            color: white;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.5);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        #mediaContainer {
            max-width: 500px;
            margin: 0 auto 15px auto;
            display: none;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            border: 2px solid var(--accent-cyan);
        }
        video {
            width: 100%;
            max-height: 240px;
            object-fit: cover;
            display: block;
        }
        .close-cam {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            z-index: 10;
        }
        .action-btn {
            margin: 0 auto 15px auto;
            padding: 12px 25px;
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 500px;
            margin: 0 auto;
        }
        .feature-btn {
            padding: 10px 4px;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        .feature-btn:active {
            transform: scale(0.94);
        }
        .b-teal { background: #0f766e; }
        .b-purple { background: #6b21a8; }
        .b-blue { background: #1d4ed8; }
        .b-orange { background: #c2410c; }
        .b-dark { background: #334155; }
        .b-red { background: #991b1b; background-image: linear-gradient(to right, #991b1b, #6b21a8); }

        .feature-btn span:first-child {
            font-size: 22px;
            margin-bottom: 4px;
        }
        .bottom-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            max-width: 500px;
            margin: 10px auto 0 auto;
        }
        #statusBox {
            margin: 15px auto 0 auto;
            padding: 12px;
            background: var(--card-bg);
            border-radius: 8px;
            font-size: 14px;
            color: #38bdf8;
            max-width: 500px;
            text-align: right;
            border-right: 4px solid var(--accent-cyan);
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <header>
        <h1>تطبيق إبصار (TokenRa)</h1>
        <span style="font-size: 12px; color: #10b981;">● متصل بالمفتاح</span>
    </header>

    <div class="mic-container">
        <button class="mic-btn" onclick="speakText('مرحباً بك في تطبيق إبصار الذكي، أنا جاهز لمساعدتك')">🎤</button>
    </div>

    <div id="mediaContainer">
        <button class="close-cam" onclick="stopCamera()">إغلاق ✕</button>
        <video id="cameraStream" autoplay playsinline></video>
    </div>
    
    <button id="aiAnalyzeBtn" class="action-btn" onclick="analyzeWithTokenRa()">إرسال التحليل عبر TokenRa 🧠</button>
    <canvas id="canvas" style="display:none;"></canvas>

    <div class="grid-container">
        <button class="feature-btn b-teal" onclick="triggerAction('الاتصال بمطوع', 'tel:01000000000', 'جاري الاتصال بالمطوع لمساعدتك')">
            <span>📞</span><span>اتصل بمطوع</span>
        </button>
        <button class="feature-btn b-teal" onclick="startCameraForAI('اقرأ بدقة بالغة جميع النصوص المكتوبة باللغة العربية أو الإنجليزية الظاهرة في الصورة.')">
            <span>📄</span><span>قراءة النصوص</span>
        </button>
        <button class="feature-btn b-purple" onclick="startCameraForAI('صف لي ما يوجد في هذا المشهد بدقة مفصلة ومفيدة جداً لشخص مكفوف.')">
            <span>📷</span><span>التعرف على الأشياء</span>
        </button>

        <button class="feature-btn b-purple" onclick="notifyFeature('المساعد الصوتي')">
            <span>🎧</span><span>المساعد الصوتي</span>
        </button>
        <button class="feature-btn b-orange" onclick="startCameraForAI('اقرأ محتوى الصفحة أو الكتاب أو المستند الظاهر في الصورة بوضوح.')">
            <span>📖</span><span>الكتب والمستندات</span>
        </button>
        <button class="feature-btn b-blue" onclick="getGPSLocation()">
            <span>🧭</span><span>الملاحة والتنقل</span>
        </button>

        <button class="feature-btn b-blue" onclick="notifyFeature('قراءة الباركود')">
            <span>📊</span><span>قراءة الباركود</span>
        </button>
        <button class="feature-btn b-orange" onclick="notifyFeature('التعلم والتعليم')">
            <span>🎓</span><span>التعلم والتعليم</span>
        </button>
        <button class="feature-btn b-teal" onclick="notifyFeature('البحث الصوتي')">
            <span>🔍</span><span>البحث الصوتي</span>
        </button>

        <button class="feature-btn b-teal" onclick="notifyFeature('التعرف على الوجوه')">
            <span>👤</span><span>التعرف على الوجوه</span>
        </button>
        <button class="feature-btn b-purple" onclick="notifyFeature('التعرف على الألوان')">
            <span>🎨</span><span>التعرف على الألوان</span>
        </button>
        <button class="feature-btn b-blue" onclick="startCameraForAI('حدد بدقة فئة ونوع العملة الورقية الظاهرة في الصورة.')">
            <span>🪙</span><span>التعرف على العملات</span>
        </button>

        <button class="feature-btn b-dark" onclick="notifyFeature('سجل المعلومات')">
            <span>🕒</span><span>سجل المعلومات</span>
        </button>
        <button class="feature-btn b-blue" onclick="getGPSLocation()">
            <span>📍</span><span>مشاركة موقعي</span>
        </button>
        <button class="feature-btn b-dark" onclick="getGPSLocation()">
            <span>🏢</span><span>الملاحة الداخلية</span>
        </button>
    </div>

    <div class="bottom-grid">
        <button class="feature-btn b-dark" onclick="notifyFeature('دعم بدون إنترنت')">
            <span>⚡</span><span>دعم بدون إنترنت</span>
        </button>
        <button class="feature-btn b-red" onclick="triggerAction('حالة الطوارئ', 'tel:123', 'جاري الاتصال بخدمات الطوارئ')">
            <span>🚨</span><span>طوارئ</span>
        </button>
    </div>

    <div id="statusBox">أهلاً بك في تطبيق إبصار. التطبيق جاهز بجميع الخواص.</div>

    <script>
        let currentStream = null;
        let currentPrompt = "صف لي ما يوجد في هذا المشهد لشخص مكفوف.";

        // تم دمج مفتاح TokenRa مباشرة هنا ليعمل فوراً
        const TOKENRA_API_KEY = "sk-8Wr5YxT42vvT8IcQCkH6Q5Q6N6GoolDL5JwkK6Rvu5eRt0nV";

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA';
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        async function startCameraForAI(promptText) {
            currentPrompt = promptText;
            const container = document.getElementById('mediaContainer');
            const video = document.getElementById('cameraStream');
            container.style.display = 'block';
            document.getElementById('aiAnalyzeBtn').style.display = 'inline-block';
            
            document.getElementById('statusBox').innerText = "تم فتح الكاميرا. وجهها نحو الهدف واضغط زر التحليل.";
            speakText("تم فتح الكاميرا، اضغط زر التحليل عند الاستعداد");

            try {
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }
                currentStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { exact: "environment" } } 
                }).catch(() => {
                    return navigator.mediaDevices.getUserMedia({ video: true });
                });
                video.srcObject = currentStream;
            } catch (err) {
                document.getElementById('statusBox').innerText = "تعذر فتح الكاميرا، يرجى السماح بالصلاحيات.";
                speakText("تعذر فتح الكاميرا");
            }
        }

        function stopCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
            document.getElementById('mediaContainer').style.display = 'none';
            document.getElementById('aiAnalyzeBtn').style.display = 'none';
            document.getElementById('statusBox').innerText = "تم إغلاق الكاميرا.";
            speakText("تم إغلاق الكاميرا");
        }

        async function analyzeWithTokenRa() {
            const statusBox = document.getElementById('statusBox');
            statusBox.innerText = "جاري إرسال الطلب عبر TokenRa... انتظر لحظات";
            speakText("جاري معالجة الطلب");

            try {
                const response = await fetch("https://tokenra.io/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${TOKENRA_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "stealth/ox-alpha",
                        messages: [
                            {
                                role: "user",
                                content: currentPrompt
                            }
                        ]
                    })
                });

                const data = await response.json();
                
                if (data.choices && data.choices[0] && data.choices[0].message) {
                    let aiReply = data.choices[0].message.content.trim();
                    statusBox.innerText = "النتيجة: " + aiReply;
                    speakText(aiReply);
                } else if (data.error) {
                    statusBox.innerText = "خطأ من المنصة: " + (data.error.message || JSON.stringify(data.error));
                    speakText("عذراً، حدث خطأ من الخادم");
                } else {
                    statusBox.innerText = "استجابة غير متوقعة من الخادم.";
                    speakText("عذراً، لم أستقبل استجابة سليمة");
                }
            } catch (err) {
                document.getElementById('statusBox').innerText = "حدث خطأ في الاتصال بالشبكة.";
                speakText("حدث خطأ في الاتصال");
            }
        }

        function notifyFeature(name) {
            let msg = `خاصية ${name} قيد التطوير وسيتم تفعيلها قريباً`;
            document.getElementById('statusBox').innerText = msg;
            speakText(msg);
        }

        function triggerAction(name, link, speechMessage) {
            document.getElementById('statusBox').innerText = "تم تفعيل: " + name;
            speakText(speechMessage);
            if (link) {
                setTimeout(() => { window.location.href = link; }, 2000);
            }
        }

        function getGPSLocation() {
            document.getElementById('statusBox').innerText = "جاري تحديد الموقع الجغرافي...";
            speakText("جاري تحديد موقعك الجغرافي للملاحة");
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    let lat = pos.coords.latitude.toFixed(4);
                    let lng = pos.coords.longitude.toFixed(4);
                    let text = `موقعك الحالي - خط العرض: ${lat}، خط الطول: ${lng}`;
                    document.getElementById('statusBox').innerText = text;
                    speakText("تم تحديد موقعك بنجاح");
                }, () => {
                    document.getElementById('statusBox').innerText = "تعذر تحديد الموقع، تأكد من تفعيل GPS.";
                    speakText("تعذر تحديد الموقع");
                });
            }
        }
    </script>
</body>
</html>
