<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>تطبيق بصير الذكي</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:'Cairo',sans-serif;
-webkit-tap-highlight-color:transparent;
}

body{
background:#030712;
color:#fff;
padding:10px;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.phone-container{
width:100%;
max-width:420px;
background:#030712;
border-radius:35px;
padding:15px 12px;
border:1px solid #1e293b;
box-shadow:0 0 40px rgba(0,0,0,.9);
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:5px 5px 10px;
}

.header-icon-btn{
width:42px;
height:42px;
border-radius:50%;
background:#0b1120;
color:#94a3b8;
border:1px solid #1e293b;
font-size:18px;
}

.welcome-title{
text-align:center;
}

.welcome-title h1{
font-size:1.35rem;
font-weight:700;
}

.welcome-title p{
font-size:.8rem;
color:#94a3b8;
}

.mic-section{
display:flex;
justify-content:center;
margin:8px 0 15px;
}

.mic-glow-btn{
width:82px;
height:82px;
border-radius:50%;
background:#0a1128;
border:3px solid #38bdf8;
color:#38bdf8;
font-size:28px;
box-shadow:0 0 20px rgba(56,189,248,.25);
}

.screen{
display:none;
}

.screen.active{
display:flex;
flex-direction:column;
gap:10px;
}

.grid-container{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

.btn-card{
padding:10px 4px;
border-radius:16px;
border:1px solid rgba(255,255,255,.06);
cursor:pointer;
text-align:center;
color:#fff;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:6px;
min-height:90px;
}

.btn-card i{
font-size:20px;
}

.btn-card span{
font-size:.74rem;
font-weight:600;
line-height:1.2;
}

.c-purple-1{background:linear-gradient(145deg,#2e1065,#3b0764)}
.c-teal-1{background:linear-gradient(145deg,#042f2e,#115e59)}
.c-green-1{background:linear-gradient(145deg,#022c22,#065f46)}
.c-blue-1{background:linear-gradient(145deg,#1e3a8a,#1e40af)}
.c-orange-1{background:linear-gradient(145deg,#431407,#9a3412)}
.c-purple-2{background:linear-gradient(145deg,#31104a,#4c1d95)}
.c-teal-2{background:linear-gradient(145deg,#042f2e,#0f766e)}
.c-yellow-1{background:linear-gradient(145deg,#451a03,#854d0e)}
.c-blue-2{background:linear-gradient(145deg,#0c4a6e,#0369a1)}
.c-blue-3{background:linear-gradient(145deg,#172554,#1d4ed8)}
.c-purple-3{background:linear-gradient(145deg,#4a044e,#701a75)}
.c-teal-3{background:linear-gradient(145deg,#042f2e,#134e4a)}
.c-brown-1{background:linear-gradient(145deg,#2c1611,#451a03)}
.c-blue-4{background:linear-gradient(145deg,#0f172a,#1e3a8a)}
.c-dark-1{background:linear-gradient(145deg,#0b132b,#1e293b)}

.bottom-actions{
display:grid;
grid-template-columns:1.1fr 1.2fr;
gap:8px;
margin-top:8px;
}

.action-special-btn{
padding:12px 8px;
border-radius:16px;
font-size:.82rem;
font-weight:bold;
cursor:pointer;
color:#fff;
}

.btn-emergency{
background:linear-gradient(145deg,#581c87,#7f1d1d);
border:1px solid #ef4444;
}

.btn-offline{
background:linear-gradient(145deg,#090d16,#0f172a);
border:1px solid #1e3a8a;
}

.sub-screen-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
border-bottom:1px solid #1e293b;
padding-bottom:8px;
}

.sub-screen-header h2{
font-size:1.1rem;
color:#38bdf8;
}

.back-btn{
background:#111827;
color:#94a3b8;
border:1px solid #334155;
padding:6px 12px;
border-radius:10px;
cursor:pointer;
}

.function-text{
font-size:.85rem;
color:#94a3b8;
line-height:1.7;
}

.camera-label-btn{
display:block;
width:100%;
padding:16px;
border-radius:14px;
border:none;
font-size:1rem;
font-weight:bold;
color:#fff;
text-align:center;
cursor:pointer;
margin-top:10px;
background:linear-gradient(135deg,#2563eb,#1d4ed8);
}

.camera-label-btn.green{
background:linear-gradient(135deg,#059669,#047857);
}

.camera-label-btn.purple{
background:linear-gradient(135deg,#7c3aed,#6d28d9);
}

.hidden-input{
display:none;
}

.status-box{
background:#0b1120;
border:1px solid #38bdf8;
border-radius:14px;
padding:10px;
font-size:.9rem;
color:#38bdf8;
margin-top:10px;
text-align:center;
min-height:48px;
line-height:1.5;
}

.result-box{
background:#0b1120;
border:1px solid #334155;
border-radius:14px;
padding:12px;
font-size:.85rem;
line-height:1.7;
color:#fff;
white-space:pre-wrap;
display:none;
}

.small-btn{
width:100%;
padding:12px;
border:1px solid #334155;
border-radius:12px;
background:#111827;
color:#fff;
font-weight:bold;
margin-top:5px;
}

</style>
</head>

<body>

<div class="phone-container">

<header>

<button class="header-icon-btn" id="menuBtn">
<i class="fa-solid fa-bars"></i>
</button>

<div class="welcome-title">
<h1>مرحبًا بك</h1>
<p>كيف يمكنني مساعدتك اليوم؟</p>
</div>

<button class="header-icon-btn" id="notifBtn">
<i class="fa-solid fa-bell"></i>
</button>

</header>

<div class="mic-section">

<button class="mic-glow-btn" id="micBtn">
<i class="fa-solid fa-microphone"></i>
</button>

</div>


<!-- ================= الرئيسية ================= -->

<main id="homeScreen" class="screen active">

<div class="grid-container">

<button class="btn-card c-purple-1" data-target="objectScreen">
<i class="fa-solid fa-camera" style="color:#c084fc"></i>
<span>التعرف على الأشياء</span>
</button>

<button class="btn-card c-teal-1" data-target="ocrScreen">
<i class="fa-solid fa-file-lines" style="color:#2dd4bf"></i>
<span>قراءة النصوص</span>
</button>

<button class="btn-card c-green-1" data-target="helpScreen">
<i class="fa-solid fa-headset" style="color:#34d399"></i>
<span>اتصل بمطوع</span>
</button>

<button class="btn-card c-blue-1" data-target="navScreen">
<i class="fa-solid fa-location-arrow" style="color:#60a5fa"></i>
<span>الملاحة والتنقل</span>
</button>

<button class="btn-card c-orange-1" data-target="libScreen">
<i class="fa-solid fa-book-open" style="color:#fb923c"></i>
<span>الكتب والمستندات</span>
</button>

<button class="btn-card c-purple-2" data-target="voiceScreen">
<i class="fa-solid fa-waveform" style="color:#c084fc"></i>
<span>المساعد الصوتي</span>
</button>

<button class="btn-card c-teal-2" data-target="searchScreen">
<i class="fa-solid fa-magnifying-glass" style="color:#2dd4bf"></i>
<span>البحث الصوتي في المكتبات</span>
</button>

<button class="btn-card c-yellow-1" data-target="eduScreen">
<i class="fa-solid fa-graduation-cap" style="color:#fbbf24"></i>
<span>التعلم والتعليم</span>
</button>

<button class="btn-card c-blue-2" data-target="barcodeScreen">
<i class="fa-solid fa-barcode" style="color:#38bdf8"></i>
<span>قراءة الباركود والمنتجات</span>
</button>

<button class="btn-card c-blue-3" data-target="moneyScreen">
<i class="fa-solid fa-coins" style="color:#60a5fa"></i>
<span>التعرف على العملات</span>
</button>

<button class="btn-card c-purple-3" data-target="colorScreen">
<i class="fa-solid fa-palette" style="color:#e879f9"></i>
<span>التعرف على الألوان</span>
</button>

<button class="btn-card c-teal-3" data-target="faceScreen">
<i class="fa-solid fa-user" style="color:#2dd4bf"></i>
<span>التعرف على الوجوه</span>
</button>

<button class="btn-card c-brown-1" data-target="indoorScreen">
<i class="fa-solid fa-building" style="color:#fb923c"></i>
<span>الملاحة الداخلية</span>
</button>

<button class="btn-card c-blue-4" data-target="locationScreen">
<i class="fa-solid fa-location-dot" style="color:#38bdf8"></i>
<span>مشاركة موقعي</span>
</button>

<button class="btn-card c-dark-1" data-target="historyScreen">
<i class="fa-solid fa-clock-rotate-left" style="color:#94a3b8"></i>
<span>سجل المعلومات</span>
</button>

</div>

<div class="bottom-actions">

<button class="action-special-btn btn-emergency" id="emergencyBtn">
<i class="fa-solid fa-triangle-exclamation"></i>
طوارئ
</button>

<button class="action-special-btn btn-offline" id="offlineBtn">
<i class="fa-solid fa-cloud-slash"></i>
دعم بدون إنترنت
</button>

</div>

</main>


<!-- ================= الأشياء ================= -->

<section id="objectScreen" class="screen
