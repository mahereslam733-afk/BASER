<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق بصير للمكفوفين</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #000000;
            color: #FFFFFF;
            padding: 15px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            text-align: center;
            padding: 10px 0;
            border-bottom: 4px solid #FFFF00;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            color: #FFFF00;
            font-size: 2.2rem;
        }
        .top-btn {
            background: #333333;
            color: #FFFF00;
            border: 2px solid #FFFF00;
            padding: 8px 15px;
            font-size: 1.2rem;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .screen { display: none; }
        .screen.active { display: flex; flex-direction: column; gap: 15px; flex-grow: 1; }

        .speed-box {
            background: #111;
            padding: 10px;
            border: 2px solid #FFF;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .speed-box label { font-size: 1.3rem; color: #FFFF00; }
        .speed-box input { width: 50%; height: 25px; }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            flex-grow: 1;
        }
        .btn-large {
            width: 100%;
            padding: 20px;
            font-size: 1.6rem;
            font-weight: bold;
            border: 3px solid #FFFFFF;
            border-radius: 15px;
            cursor: pointer;
            text-align: right;
            background-color: #111111;
            color: #FFFFFF;
        }
        .btn-large:focus, .btn-large:active {
            background-color: #FFFF00;
            color: #000000;
            outline: none;
        }

        .action-btn {
            background-color: #0055FF;
            color: #FFFFFF;
            padding: 20px;
            font-size: 1.8rem;
            border-radius: 15px;
            border: 3px solid #FFFFFF;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }

        #status-box {
            background-color: #111111;
            border: 3px solid #FFFF00;
            border-radius: 10px;
            padding: 12px;
            font-size: 1.4rem;
            color: #00FF00;
            margin-top: 15px;
            text-align: center;
            min-height: 80px;
            line-height: 1.4;
        }
        
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <header>
        <button id="backBtn" class="top-btn" aria-label="رجوع للشاشة الرئيسية" style="visibility: hidden;">⬅️ رجوع</button>
        <h1>تطبيق بصير</h1>
        <button id="helpBtn" class="top-btn" aria-label="مساعدة واستعراض">❓ تعليمات</button>
    </header>

    <div class="speed-box">
        <label for="speedRange">سرعة القراءة الصوتية:</label>
        <input type="range" id="speedRange" min="0.5" max="1.5" step="0.1" value="0.9" aria-label="تغيير سرعة الصوت">
    </div>

    <!-- الشاشة الرئيسية -->
    <main id="homeScreen" class="screen active">
        <div class="grid-container" role="region" aria-label="القائمة الرئيسية">
            <button class="btn-large" data-screen="ocrScreen" aria-label="1. قراءة النصوص والمستندات">📖 1. قراءة النصوص</button>
            <button class="btn-large" data-screen="objectScreen" aria-label="2. التعرف على الأشياء والصور">👁️ 2. التعرف على الأشياء</button>
            <button class="btn-large" data-screen="moneyScreen" aria-label="3. التعرف على العملات">💰 3. التعرف على العملات</button>
            <button class="btn-large" data-screen="humanHelpScreen" aria-label="4. مساعدة بشرية ومتطوع">👨‍🦯 4. مساعدة بشرية</button>
            <button class="btn-large" data-screen="navScreen" aria-label="5. الملاحة والتوجيه">🧭 5. الملاحة والاتجاهات</button>
            <button class="btn-large" data-screen="libraryScreen" aria-label="6. المكتبة والمحتوى الصوتي">📚 6. المكتبة الصوتية</button>
            <button class="btn-large" data-screen="dailyScreen" aria-label="7. الخدمات اليومية والألوان">🏠 7. الخدمات اليومية</button>
            <button class="btn-large" data-screen="settingsScreen" aria-label="8. الإعدادات والتحكم">⚙️ 8. الإعدادات</button>
        </div>
    </main>

    <!-- شاشة قراءة النصوص OCR (المرحلة الثانية) -->
    <section id="ocrScreen" class="screen">
        <h2>قسم قراءة النصوص</h2>
        <p style="font-size: 1.3rem;">وجه كاميرا الموبايل نحو الورقة أو الكتاب، ثم اضغط على زر التقاط واقرأ النص بالأسفل.</p>
        <button id="captureOcrBtn" class="action-btn" aria-label="التقاط صورة للورقة وقراءة النص">📸 التقاط وقراءة النص</button>
    </section>

    <!-- باقي الشاشات للمراحل القادمة -->
    <section id="objectScreen" class="screen"><h2>قسم التعرف على الأشياء</h2></section>
    <section id="moneyScreen" class="screen"><h2>قسم العملات</h2></section>
    <section id="humanHelpScreen" class="screen"><h2>قسم المساعدة البشرية</h2></section>
    <section id="navScreen" class="screen"><h2>قسم الملاحة</h2></section>
    <section id="libraryScreen" class="screen"><h2>المكتبة الصوتية</h2></section>
    <section id="dailyScreen" class="screen"><h2>الخدمات اليومية</h2></section>
    <section id="settingsScreen" class="screen"><h2>الإعدادات</h2></section>

    <!-- مدخل الكاميرا الخفي -->
    <input type="file" id="ocrCameraInput" accept="image/*" capture="environment">

    <!-- صندوق الإشعارات والقراءة -->
    <div id="status-box" aria-live="assertive" role="status">
        مرحباً بك في تطبيق بصير. الشاشة الرئيسية معروضة الآن.
    </div>

    <script src="app.js"></script>
</body>
</html>
