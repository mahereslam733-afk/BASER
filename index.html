<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق بصير - BASER</title>
    <!-- استدعاء خط كايرو -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- استدعاء الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #050b14;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .phone-container {
            width: 100%;
            max-width: 420px;
            background: #050b14;
            border-radius: 35px;
            padding: 15px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            overflow-y: auto;
            max-height: 95vh;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 5px;
        }

        .app-header i {
            font-size: 22px;
            color: #fff;
            cursor: pointer;
        }

        .header-title {
            text-align: center;
        }

        .header-title h1 {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }

        .header-title p {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 2px;
        }

        .mic-section {
            display: flex;
            justify-content: center;
            margin: 15px 0 20px 0;
        }

        .mic-glow-ring {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #9333ea, #06b6d4);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.5);
            cursor: pointer;
        }

        .mic-inner {
            width: 87px;
            height: 87px;
            border-radius: 50%;
            background-color: #0b132b;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mic-inner i {
            font-size: 38px;
            color: #fff;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .service-card {
            border-radius: 16px;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s ease;
            min-height: 95px;
            border: none;
        }

        .service-card:active {
            transform: scale(0.95);
        }

        .service-card i {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .service-card span {
            font-size: 11px;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.2;
        }

        .c-purple-dark { background-color: #2e1a47; }
        .c-teal-dark  { background-color: #0f3e3d; }
        .c-green-dark { background-color: #0d3823; }
        .c-blue-dark  { background-color: #0c2b4e; }
        .c-orange-dark{ background-color: #532e0d; }
        .c-indigo-dark{ background-color: #2a1b4e; }
        .c-teal-med   { background-color: #0e3830; }
        .c-yellow-dark{ background-color: #523d0d; }
        .c-cyan-dark  { background-color: #13364e; }
        .c-blue-med   { background-color: #0f2c4e; }
        .c-magenta    { background-color: #47133c; }
        .c-cyan-deep  { background-color: #0d3942; }
        .c-brown      { background-color: #38231c; }
        .c-blue-bright{ background-color: #0f325e; }
        .c-slate      { background-color: #112640; }

        .bottom-actions {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .action-btn {
            flex: 1;
            border-radius: 16px;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            border: none;
        }

        .btn-emergency {
            background-color: #7f1d1d;
        }

        .btn-offline {
            background-color: #0f1c30;
            border: 1.5px solid #1e3a8a;
            color: #93c5fd;
        }

        .action-btn i {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <!-- الهيدر العلوي -->
        <div class="app-header">
            <i class="fa-solid fa-bars" onclick="alert('فتح القائمة الجانبية')"></i>
            <div class="header-title">
                <h1>مرحبًا بك</h1>
                <p>كيف يمكنني مساعدتك اليوم؟</p>
            </div>
            <i class="fa-regular fa-bell" onclick="alert('فتح لوحة الإشعارات')"></i>
        </div>

        <!-- زر المساعد الصوتي المركزي -->
        <div class="mic-section">
            <div class="mic-glow-ring" onclick="alert('مرحباً، تم تفعيل المساعد الصوتي المركزي')">
                <div class="mic-inner">
                    <i class="fa-solid fa-microphone"></i>
                </div>
            </div>
        </div>

        <!-- شبكة الأزرار -->
        <div class="grid-container">
            <div class="service-card c-purple-dark" onclick="alert('جاري فتح ميزة التعرف على الأشياء...')">
                <i class="fa-solid fa-camera"></i>
                <span>التعرف على الأشياء</span>
            </div>
            <div class="service-card c-teal-dark" onclick="alert('جاري تشغيل قارئ النصوص (OCR)...')">
                <i class="fa-solid fa-file-lines"></i>
                <span>قراءة النصوص</span>
            </div>
            <div class="service-card c-green-dark" onclick="alert('جاري الاتصال بالمتطوع المتاح...')">
                <i class="fa-solid fa-headset"></i>
                <span>اتصل بمتطوع</span>
            </div>
            <div class="service-card c-blue-dark" onclick="alert('جاري فتح خريطة الملاحة والتنقل...')">
                <i class="fa-solid fa-location-dot"></i>
                <span>الملاحة والتنقل</span>
            </div>
            <div class="service-card c-orange-dark" onclick="alert('جاري فتح قسم الكتب والمستندات...')">
                <i class="fa-solid fa-book-open"></i>
                <span>الكتب والمستندات</span>
            </div>
            <div class="service-card c-indigo-dark" onclick="alert('تشغيل إعدادات المساعد الصوتي...')">
                <i class="fa-solid fa-waveform"></i>
                <span>المساعد الصوتي</span>
            </div>
            <div class="service-card c-teal-med" onclick="alert('جاري البحث الصوتي في المكتبات...')">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>البحث الصوتي في المكتبات</span>
            </div>
            <div class="service-card c-yellow-dark" onclick="alert('جاري فتح قسم التعلم والتعليم...')">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>التعلم والتعليم</span>
            </div>
            <div class="service-card c-cyan-dark" onclick="alert('جاري فتح قارئ الباركود والمنتجات...')">
                <i class="fa-solid fa-barcode"></i>
                <span>قراءة الباركود والمنتجات</span>
            </div>
            <div class="service-card c-blue-med" onclick="alert('جاري تشغيل التعرف على العملات...')">
                <i class="fa-solid fa-coins"></i>
                <span>التعرف على العملات</span>
            </div>
            <div class="service-card c-magenta" onclick="alert('جاري تفعيل التعرف على الألوان...')">
                <i class="fa-solid fa-palette"></i>
                <span>التعرف على الألوان</span>
            </div>
            <div class="service-card c-cyan-deep" onclick="alert('جاري تشغيل التعرف على الوجوه...')">
                <i class="fa-solid fa-user-check"></i>
                <span>التعرف على الوجوه</span>
            </div>
            <div class="service-card c-brown" onclick="alert('جاري تفعيل الملاحة الداخلية...')">
                <i class="fa-solid fa-building"></i>
                <span>الملاحة الداخلية</span>
            </div>
            <div class="service-card c-blue-bright" onclick="alert('جاري مشاركة موقعك الحالي...')">
                <i class="fa-solid fa-map-pin"></i>
                <span>مشاركة موقعي</span>
            </div>
            <div class="service-card c-slate" onclick="alert('جاري فتح سجل المعلومات...')">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span>سجل المعلومات</span>
            </div>
        </div>

        <!-- الأزرار السفلية -->
        <div class="bottom-actions">
            <button class="action-btn btn-emergency" onclick="alert('⚠️ تنبيه: تم تفعيل وضع الطوارئ بنجاح!')">
                <i class="fa-solid fa-triangle-exclamation"></i>
                طوارئ
            </button>
            <button class="action-btn btn-offline" onclick="alert('تم تفعيل وضع العمل بدون إنترنت.')">
                <i class="fa-solid fa-cloud-slash"></i>
                دعم بدون إنترنت
            </button>
        </div>
    </div>

</body>
</html>
