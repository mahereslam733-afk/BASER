<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,
maximum-scale=1.0,user-scalable=no">

<title>قارئ عربي ذكي</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
margin:0;
padding:15px;
background:#0f172a;
color:white;
font-family:Arial,Tahoma,sans-serif;
}

.app{
max-width:650px;
margin:auto;
}

h1{
background:#3730a3;
padding:18px;
border-radius:20px;
text-align:center;
margin:0 0 15px;
font-size:25px;
}

.camera{
position:relative;
height:55vh;
min-height:330px;
background:#000;
border:4px solid #6366f1;
border-radius:22px;
overflow:hidden;
}

video{
width:100%;
height:100%;
object-fit:cover;
}

.cameraMessage{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
font-size:18px;
padding:20px;
}

button,
.fileButton{
width:100%;
border:0;
border-radius:18px;
padding:17px;
margin-top:12px;
color:white;
font-size:18px;
font-weight:bold;
text-align:center;
cursor:pointer;
}

button:disabled{
opacity:.5;
}

.capture{
background:#059669;
}

.gallery{
background:#2563eb;
}

.repeat{
background:#d97706;
}

.stop{
background:#dc2626;
}

input{
display:none;
}

.status{
margin-top:15px;
padding:14px;
border-radius:15px;
background:#172554;
text-align:center;
}

.result{
margin-top:15px;
padding:16px;
border-radius:18px;
background:#1e293b;
}

.resultTitle{
color:#a5b4fc;
font-weight:bold;
margin-bottom:10px;
}

#result{
white-space:pre-wrap;
line-height:2;
font-size:18px;
min-height:150px;
}

#loading{
display:none;
position:fixed;
inset:0;
z-index:9999;
background:rgba(0,0,0,.88);
align-items:center;
justify-content:center;
padding:20px;
}

.loadingBox{
width:90%;
max-width:380px;
background:#1e293b;
border-radius:20px;
padding:30px;
text-align:center;
}

.spinner{
width:48px;
height:48px;
border:5px solid #475569;
border-top-color:#22c55e;
border-radius:50%;
animation:spin 1s linear infinite;
margin:0 auto 18px;
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}

.progress{
height:8px;
background:#334155;
border-radius:10px;
overflow:hidden;
margin-top:15px;
}

.progressBar{
height:100%;
width:0%;
background:#22c55e;
transition:width .2s;
}

#welcome{
position:fixed;
inset:0;
z-index:10000;
background:#020617;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.welcomeBox{
width:100%;
max-width:400px;
background:#312e81;
border:3px solid #6366f1;
border-radius:25px;
padding:30px 20px;
text-align:center;
}

.start{
background:#059669;
}

.small{
font-size:13px;
color:#cbd5e1;
margin-top:10px;
}

</style>
</head>


<body>


<!-- =========================
     البداية
========================= -->

<div id="welcome">

<div class="welcomeBox">

<h2>
📖 قارئ المستندات العربي
</h2>

<p>
قارئ ذكي للصفحات والرسائل الجامعية
</p>

<p style="color:#c7d2fe">
بدون Gemini وبدون API Key
</p>

<button
id="start"
class="start">

🚀 ابدأ التطبيق

</button>

</div>

</div>


<!-- =========================
     التحميل
========================= -->

<div id="loading">

<div class="loadingBox">

<div class="spinner"></div>

<div id="loadingText">
جاري تجهيز قارئ العربية...
</div>

<div class="progress">

<div
id="progressBar"
class="progressBar">
</div>

</div>

<div
id="loadingPercent"
class="small">

0%

</div>

</div>

</div>


<div class="app">


<h1>
📖 قارئ المستندات العربي
</h1>


<!-- =========================
     الكاميرا
========================= -->

<div class="camera">

<video
id="video"
autoplay
playsinline
muted>
</video>

<div
id="cameraMessage"
class="cameraMessage">

الكاميرا غير مفعلة

</div>

</div>


<canvas
id="canvas"
style="display:none">
</canvas>


<!-- =========================
     تصوير
========================= -->

<button
id="capture"
class="capture">

📸 تصوير وقراءة الصفحة

</button>


<!-- =========================
     المعرض
========================= -->

<label
class="fileButton gallery">

📁 اختيار صورة من الهاتف

<input
id="file"
type="file"
accept="image/*">

</label>


<!-- =========================
     إعادة القراءة
========================= -->

<button
id="repeat"
class="repeat">

🔊 إعادة قراءة النص

</button>


<!-- =========================
     إيقاف
========================= -->

<button
id="stop"
class="stop">

🔇 إيقاف القراءة

</button>


<!-- =========================
     الحالة
========================= -->

<div
id="status"
class="status">

جاهز

</div>


<!-- =========================
     النتيجة
========================= -->

<div class="result">

<div class="resultTitle">
النص المستخرج:
</div>

<div id="result">

وجّه الصفحة أمام الكاميرا واضغط تصوير.

</div>

</div>

</div>


<script>

/* =====================================================
   العناصر
===================================================== */

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const start =
document.getElementById("start");

const capture =
document.getElementById("capture");

const file =
document.getElementById("file");

const repeat =
document.getElementById("repeat");

const stop =
document.getElementById("stop");

const result =
document.getElementById("result");

const status =
document.getElementById("status");

const welcome =
document.getElementById("welcome");

const cameraMessage =
document.getElementById("cameraMessage");

const loading =
document.getElementById("loading");

const loadingText =
document.getElementById("loadingText");

const progressBar =
document.getElementById("progressBar");

const loadingPercent =
document.getElementById("loadingPercent");


/* =====================================================
   المتغيرات
===================================================== */

let stream = null;

let worker = null;

let lastText = "";

let busy = false;


/* =====================================================
   الحالة
===================================================== */

function setStatus(text){

status.textContent =
text;

}


/* =====================================================
   التحميل
===================================================== */

function showLoading(text){

loading.style.display =
"flex";

loadingText.textContent =
text;

}

function hideLoading(){

loading.style.display =
"none";

progressBar.style.width =
"0%";

loadingPercent.textContent =
"0%";

}


/* =====================================================
   الصوت
===================================================== */

function speak(text){

if(!text){
return;
}

if(!("speechSynthesis" in window)){
return;
}

speechSynthesis.cancel();

const u =
new SpeechSynthesisUtterance(text);

u.lang =
"ar-EG";

u.rate =
0.78;

u.pitch =
1;

u.volume =
1;

const voices =
speechSynthesis.getVoices();

const voice =
voices.find(
v =>
v.lang === "ar-EG"
)
||
voices.find(
v =>
v.lang &&
v.lang.toLowerCase().startsWith("ar")
);

if(voice){
u.voice =
voice;
}

speechSynthesis.speak(u);

}


/* =====================================================
   الكاميرا
===================================================== */

async function startCamera(){

try{

if(
!navigator.mediaDevices ||
!navigator.mediaDevices.getUserMedia
){

throw new Error(
"Camera unavailable"
);

}

stream =
await navigator.mediaDevices.getUserMedia({

video:{
facingMode:{
ideal:"environment"
},

width:{
ideal:1920
},

height:{
ideal:1080
}

},

audio:false

});


video.srcObject =
stream;

cameraMessage.style.display =
"none";

setStatus(
"الكاميرا جاهزة"
);

}

catch(error){

console.error(
error
);

cameraMessage.innerHTML =
"⚠️ تعذر تشغيل الكاميرا<br><br>استخدم صورة من الهاتف.";

setStatus(
"الكاميرا غير متاحة"
);

}

}


/* =====================================================
   Tesseract
===================================================== */

async function startOCR(){

if(worker){
return worker;
}

showLoading(
"جاري تحميل قارئ العربية..."
);

try{

worker =
await Tesseract.createWorker(
"ara",
1,
{

logger:function(info){

console.log(
info
);

if(info.status){

loadingText.textContent =
info.status;

}

if(
info.status ===
"loading language traineddata"
){

loadingText.textContent =
"جاري تحميل اللغة العربية...";

}

if(
info.status ===
"loading tesseract core"
){

loadingText.textContent =
"جاري تحميل محرك OCR...";

}

if(
info.status ===
"recognizing text"
){

const p =
Math.round(
(info.progress || 0) * 100
);

progressBar.style.width =
p + "%";

loadingPercent.textContent =
p + "%";

loadingText.textContent =
"جاري قراءة الصفحة...";

}

}

}
);


await worker.setParameters({

preserve_interword_spaces:"1",

user_defined_dpi:"300",

tessedit_char_whitelist:
"ابتثجحخدذرزسشصضطظعغفقكلمنهويءآأؤإئىةى٠١٢٣٤٥٦٧٨٩0123456789،؛؟.-()/:"

});


setStatus(
"قارئ العربية جاهز"
);

return worker;

}

catch(error){

console.error(
"OCR ERROR:",
error
);

worker =
null;

result.textContent =
"تعذر تشغيل قارئ العربية. تأكد من اتصال الإنترنت.";

setStatus(
"خطأ في محرك القراءة"
);

throw error;

}

finally{

hideLoading();

}

}


/* =====================================================
   تحميل الصورة
===================================================== */

function loadImage(source){

return new Promise(
(resolve,reject)=>{

const img =
new Image();

img.onload =
function(){

resolve(img);

};

img.onerror =
function(){

reject(
new Error(
"تعذر فتح الصورة"
)
);

};

img.src =
source;

});

}


/* =====================================================
   معالجة الصورة
===================================================== */

async function processImage(source){

const img =
await loadImage(
source
);


let width =
img.naturalWidth;

let height =
img.naturalHeight;


/*
   حجم مناسب
*/

const maxWidth =
2200;

if(
width > maxWidth
){

const ratio =
maxWidth / width;

width =
Math.round(
width * ratio
);

height =
Math.round(
height * ratio
);

}


/*
   ترك هامش صغير
*/

const margin =
Math.round(
Math.min(width,height) * 0.025
);

const newWidth =
width -
margin * 2;

const newHeight =
height -
margin * 2;


canvas.width =
newWidth;

canvas.height =
newHeight;


const ctx =
canvas.getContext(
"2d",
{
willReadFrequently:true
}
);


/*
   خلفية بيضاء
*/

ctx.fillStyle =
"#ffffff";

ctx.fillRect(
0,
0,
newWidth,
newHeight
);


/*
   رسم الصفحة بدون الحواف
*/

ctx.drawImage(
img,

margin,
margin,
newWidth,
newHeight,

0,
0,
newWidth,
newHeight
);


/*
   معالجة قوية للصفحة
*/

const imageData =
ctx.getImageData(
0,
0,
newWidth,
newHeight
);

const data =
imageData.data;


for(
let i = 0;
i < data.length;
i += 4
){

const r =
data[i];

const g =
data[i+1];

const b =
data[i+2];


/*
   رمادي
*/

let gray =
0.299 * r +
0.587 * g +
0.114 * b;


/*
   تحسين التباين
*/

gray =
(gray - 128) *
1.55 +
128;


/*
   جعل الخلفية البيضاء أكثر بياضًا
*/

if(
gray > 210
){

gray = 255;

}


/*
   إبقاء الحروف الداكنة واضحة
*/

if(
gray < 75
){

gray = 0;

}


gray =
Math.max(
0,
Math.min(
255,
gray
)
);


data[i] =
gray;

data[i+1] =
gray;

data[i+2] =
gray;

}


ctx.putImageData(
imageData,
0,
0
);


return canvas;

}


/* =====================================================
   تنظيف النص
===================================================== */

function cleanText(text){

if(!text){
return "";
}


let lines =
text
.replace(/\r/g,"")
.split("\n");


const output =
[];


for(
let line of lines
){

line =
line.trim();


/*
   إزالة الرموز التي لا تفيد
*/

line =
line.replace(
/[|{}[\]<>~`^]+/g,
" "
);


/*
   توحيد المسافات
*/

line =
line.replace(
/[ \t]+/g,
" "
);


/*
   إزالة الفراغ قبل علامات الترقيم
*/

line =
line.replace(
/\s+([،؛؟:.])/g,
"$1"
);


line =
line.trim();


if(
line.length > 0
){

output.push(
line
);

}

}


return output.join(
"\n"
);

}


/* =====================================================
   تقييم النص
===================================================== */

function scoreText(text){

if(!text){
return 0;
}


const arabic =
(
text.match(
/[\u0600-\u06FF]/g
)
||
[]
).length;


const digits =
(
text.match(
/[0-9٠-٩]/g
)
||
[]
).length;


const words =
text
.split(/\s+/)
.filter(Boolean)
.length;


const strange =
(
text.match(
/[^\u0600-\u06FF0-9٠-٩\s،؛؟:.\-()\/]/g
)
||
[]
).length;


let score = 0;

score +=
arabic * 4;

score +=
words * 2;

score +=
digits;

score -=
strange * 3;


return score;

}


/* =====================================================
   OCR
===================================================== */

async function recognizeWithMode(
ocr,
image,
mode
){

await ocr.setParameters({

tessedit_pageseg_mode:
String(mode),

preserve_interword_spaces:
"1",

user_defined_dpi:
"300"

});


const data =
await ocr.recognize(
image
);


return cleanText(
data.data.text || ""
);

}


/* =====================================================
   قراءة الصفحة
===================================================== */

async function readImage(source){

if(busy){
return;
}

busy = true;

capture.disabled =
true;


try{

result.textContent =
"جاري قراءة الصفحة...";


setStatus(
"جاري تحسين الصورة..."
);


const image =
await processImage(
source
);


const ocr =
await startOCR();


/*
   تجربة الوضع الأول
*/

setStatus(
"جاري قراءة الصفحة 1..."
);


const text1 =
await recognizeWithMode(
ocr,
image,
6
);


/*
   تجربة الوضع الثاني
*/

setStatus(
"تحسين دقة القراءة..."
);


const text2 =
await recognizeWithMode(
ocr,
image,
3
);


/*
   تجربة الوضع الثالث
*/

setStatus(
"اختيار أفضل نتيجة..."
);


const text3 =
await recognizeWithMode(
ocr,
image,
4
);


/*
   اختيار أفضل نتيجة
*/

let best =
text1;

if(
scoreText(text2) >
scoreText(best)
){

best =
text2;

}

if(
scoreText(text3) >
scoreText(best)
){

best =
text3;

}


/*
   النتيجة
*/

if(!best){

result.textContent =
"لم يتم العثور على نص واضح.";

setStatus(
"لم يتم العثور على نص"
);

speak(
"لم أتمكن من قراءة النص. حاول تصوير الصفحة بإضاءة جيدة."
);

return;

}


result.textContent =
best;

lastText =
best;

setStatus(
"تمت قراءة الصفحة بنجاح"
);


/*
   قراءة النص
*/

speak(
best
);

}

catch(error){

console.error(
"READ ERROR:",
error
);

result.textContent =
"حدث خطأ أثناء قراءة الصفحة.";

setStatus(
"حدث خطأ أثناء القراءة"
);

speak(
"حدث خطأ أثناء قراءة الصفحة."
);

}

finally{

busy =
false;

capture.disabled =
false;

hideLoading();

}

}


/* =====================================================
   البداية
===================================================== */

start.addEventListener(
"click",
async function(){

welcome.style.display =
"none";

await startCamera();


setTimeout(
function(){

speak(
"التطبيق جاهز. ضع الصفحة أمام الكاميرا واضغط تصوير."
);

},
600
);

});


/* =====================================================
   التصوير
===================================================== */

capture.addEventListener(
"click",
async function(){

if(
!video.videoWidth
){

speak(
"الكاميرا غير جاهزة."
);

return;

}


let width =
video.videoWidth;

let height =
video.videoHeight;


const maxWidth =
2200;


if(
width > maxWidth
){

const ratio =
maxWidth / width;

width =
Math.round(
width * ratio
);

height =
Math.round(
height * ratio
);

}


canvas.width =
width;

canvas.height =
height;


const ctx =
canvas.getContext(
"2d"
);


ctx.drawImage(
video,
0,
0,
width,
height
);


const image =
canvas.toDataURL(
"image/jpeg",
0.96
);


await readImage(
image
);

});


/* =====================================================
   المعرض
===================================================== */

file.addEventListener(
"change",
function(event){

const selectedFile =
event.target.files[0];


if(!selectedFile){
return;
}


if(
!selectedFile.type.startsWith(
"image/"
)
){

speak(
"الملف المختار ليس صورة."
);

return;

}


const reader =
new FileReader();


reader.onload =
async function(){

await readImage(
reader.result
);

};


reader.onerror =
function(){

speak(
"تعذر فتح الصورة."
);

};


reader.readAsDataURL(
selectedFile
);


file.value =
"";

});


/* =====================================================
   إعادة القراءة
===================================================== */

repeat.addEventListener(
"click",
function(){

if(lastText){

speak(
lastText
);

}

else{

speak(
"لا يوجد نص لقراءته."
);

}

});


/* =====================================================
   إيقاف الصوت
===================================================== */

stop.addEventListener(
"click",
function(){

if(
"speechSynthesis"
in window
){

speechSynthesis.cancel();

}

});


/* =====================================================
   الأصوات
===================================================== */

if(
"speechSynthesis"
in window
){

speechSynthesis.onvoiceschanged =
function(){

speechSynthesis.getVoices();

};

}

</script>

</body>

</html>
