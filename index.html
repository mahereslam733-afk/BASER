<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق بصير - النسخة الشاملة</title>
    <!-- مكتبة القراءة الضوئية -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #000; color: #fff; padding: 15px; display: flex; flex-direction: column; min-height: 100vh; }
        header { text-align: center; padding: 10px 0; border-bottom: 4px solid #FFFF00; margin-bottom: 15px; }
        h1 { color: #FFFF00; font-size: 1.8rem; }
        .screen { display: none; }
        .screen.active { display: flex; flex-direction: column; gap: 10px; flex-grow: 1; }
        .btn-large { width: 100%; padding: 20px; font-size: 1.2rem; border: 2px solid #fff; border-radius: 10px; background: #111; color: #fff; text-align: right; margin-bottom: 10px; }
        .action-btn { padding: 20px; font-size: 1.4rem; border-radius: 10px; border: none; cursor: pointer; margin-top: 10px; }
        #status-box { background: #111; border: 2px solid #FFFF00; padding: 15px; font-size: 1.2rem; color: #00FF00; margin-top: 15px; text-align: center; min-height: 60px; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <header><h1>تطبيق بصير</h1></header>

    <main id="homeScreen" class="screen active">
        <button class="btn-large" onclick="openScreen('ocrScreen')">1. قراءة النصوص</button>
        <button class="btn-large" onclick="openScreen('objectScreen')">2. التعرف على الأشياء</button>
        <button class="btn-large" onclick="openScreen('moneyScreen')">3. التعرف على العملات</button>
        <button class="btn-large" onclick="openScreen('humanHelpScreen')">4. الطوارئ والمساعدة</button>
        <button class="btn-large" onclick="openScreen('navScreen')">5. الملاحة والاتجاهات</button>
        <button class="btn-large" onclick="openScreen('libraryScreen')">6. المكتبة الصوتية</button>
        <button class="btn-large" onclick="openScreen('dailyScreen')">7. الخدمات اليومية</button>
        <button class="btn-large" onclick="openScreen('settingsScreen')">8. الإعدادات</button>
    </main>

    <!-- شاشات العمليات -->
    <section id="ocrScreen" class="screen">
        <button class="action-btn" style="background:#0055FF" onclick="document.getElementById('ocrInput').click()">تصوير وقراءة نص</button>
        <input type="file" id="ocrInput" accept="image/*" capture="environment">
    </section>
    <section id="objectScreen" class="screen">
        <button class="action-btn" style="background:#008000" onclick="document.getElementById('objInput').click()">فحص الشيء أمامك</button>
        <input type="file" id="objInput" accept="image/*" capture="environment">
    </section>
    <section id="moneyScreen" class="screen">
        <button class="action-btn" style="background:#D4A000" onclick="document.getElementById('moneyInput').click()">فحص العملة</button>
        <input type="file" id="moneyInput" accept="image/*" capture="environment">
    </section>
    <section id="humanHelpScreen" class="screen">
        <button class="action-btn" style="background:#CC0000" onclick="location.href='tel:122'">اتصال بالطوارئ</button>
    </section>
    <section id="navScreen" class="screen">
        <button class="action-btn" style="background:#800080" onclick="getDirection()">تحديد الاتجاه</button>
    </section>
    <section id="libraryScreen" class="screen">
        <button class="action-btn" style="background:#008000" onclick="speak('هذا هو الدليل الصوتي، التطبيق يساعدك في كل شيء.')">تشغيل الدليل</button>
    </section>
    <section id="dailyScreen" class="screen">
        <button class="action-btn" style="background:#D4A000" onclick="document.getElementById('colorInput').click()">معرفة اللون</button>
        <input type="file" id="colorInput" accept="image/*" capture="environment">
    </section>
    <section id="settingsScreen" class="screen">
        <button class="action-btn" style="background:#0055FF" onclick="location.reload()">إعادة تحميل التطبيق</button>
    </section>

    <div id="status-box">مرحباً بك في تطبيق بصير</div>
    <canvas id="canvas" style="display:none;"></canvas>
    <script src="app.js"></script>
</body>
</html>
