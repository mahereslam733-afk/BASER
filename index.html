<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>تطبيق بصير الذكي</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Cairo',sans-serif;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:#030712;
    color:#fff;
    padding:10px;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.phone-container{
    width:100%;
    max-width:420px;
    background:#030712;
    border-radius:35px;
    padding:15px 12px;
    border:1px solid #1e293b;
    box-shadow:0 0 40px rgba(0,0,0,.9);
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:5px 5px 10px;
}

.header-icon-btn{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#0b1120;
    color:#94a3b8;
    border:1px solid #1e293b;
    font-size:18px;
}

.welcome-title{
    text-align:center;
}

.welcome-title h1{
    font-size:1.35rem;
    font-weight:700;
}

.welcome-title p{
    font-size:.8rem;
    color:#94a3b8;
}

.mic-section{
    display:flex;
    justify-content:center;
    margin:8px 0 15px;
}

.mic-glow-btn{
    width:82px;
    height:82px;
    border-radius:50%;
    background:#0a1128;
    border:3px solid #38bdf8;
    color:#38bdf8;
    font-size:28px;
    box-shadow:0 0 25px rgba(56,189,248,.3);
}

.screen{
    display:none;
}

.screen.active{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.grid-container{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.btn-card{
    min-height:90px;
    padding:10px 4px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,.06);
    cursor:pointer;
    color:#fff;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:6px;
}

.btn-card i{
    font-size:20px;
}

.btn-card span{
    font-size:.74rem;
    font-weight:600;
    text-align:center;
    line-height:1.2;
}

.c-teal-1{background:linear-gradient(145deg,#042f2e,#115e59)}
