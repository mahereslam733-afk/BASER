<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحول الصوتي الذكي للنصوص</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 border-2 border-indigo-500 rounded-3xl p-6 shadow-2xl">
        <h1 class="text-2xl font-bold text-center mb-2 text-indigo-300">متحول النصوص إلى كلام 🎙️</h1>
        <p class="text-slate-400 text-center text-sm mb-6">اكتب أي جملة أو نص عربي وسيقوم الهاتف بنطقه بوضوح.</p>

        <!-- صندوق كتابة النص -->
        <div class="mb-4">
            <label class="block text-sm font-semibold text-indigo-200 mb-2">اكتب النص هنا:</label>
            <textarea id="textInput" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded-2xl p-4 text-white focus:outline-none focus:border-indigo-500 text-lg" placeholder="مثال: أهلاً بك يا إسلام، التطبيق يعمل بكفاءة عالية..."></textarea>
        </div>

        <!-- أزرار التحكم -->
        <div class="space-y-3">
            <button id="speakBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 transition text-white font-bold py-4 px-6 rounded-2xl shadow-lg text-lg flex items-center justify-center gap-2">
                <span>🔊 انطق النص الآن</span>
            </button>
            <button id="stopBtn" class="w-full bg-rose-600 hover:bg-rose-500 active:scale-95 transition text-white font-semibold py-3 px-6 rounded-2xl shadow-md text-md flex items-center justify-center gap-2">
                <span>⏹️ إيقاف النطق</span>
            </button>
        </div>
    </div>

    <footer class="mt-6 text-slate-500 text-xs">
        نظام تحويل النصوص العربي الصافي - يعمل مباشرة وبدون إترنت
    </footer>

    <!-- سكريبت التشغيل الصوتي المباشر -->
    <script>
        const textInput = document.getElementById('textInput');
        const speakBtn = document.getElementById('speakBtn');
        const stopBtn = document.getElementById('stopBtn');

        function speakText() {
            const text = textInput.value.trim();
            if (!text) {
                alert("الرجاء كتابة نص أولاً لينطقه الهاتف.");
                return;
            }

            if ('speechSynthesis' in window) {
                // إلغاء أي نطق سابق لتجنب التداخل
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA'; // ضبط اللغة العربية
                utterance.rate = 0.85;     // سرعة هادئة وواضحة ومفهومة
                utterance.pitch = 1.0;    // طبقة صوت طبيعية

                // البحث عن أفضل صوت عربي متاح في جهازك
                const voices = window.speechSynthesis.getVoices();
                const arabicVoice = voices.find(v => v.lang.startsWith('ar') || v.name.includes('Arabic'));
                if (arabicVoice) {
                    utterance.voice = arabicVoice;
                }

                window.speechSynthesis.speak(utterance);
            } else {
                alert("متصفحك للأسف لا يدعم ميزة النطق الصوتي.");
            }
        }

        speakBtn.addEventListener('click', speakText);
        
        stopBtn.addEventListener('click', () => {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        });

        // تحديث الأصوات عند تحميل الصفحة
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }
    </script>
</body>
</html>
