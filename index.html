<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق بصير الذكي - النسخة الاحترافية</title>
    <style>
        :root {
            --bg-color: #020617;
            --surface-color: rgba(15, 23, 42, 0.9);
            --accent-cyan: #06b6d4;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, rgba(6, 182, 212, 0.15) 0%, transparent 60%);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .view-section {
            display: none;
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }

        .view-section.active-view {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* كارد الواجهة الحديثة */
        .glass-card {
            background: var(--surface-color);
            border: 1px solid rgba(6, 182, 212, 0.3);
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
        }

        .icon-badge {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px auto;
            background: rgba(6, 182, 212, 0.1);
            border: 2px solid var(--accent-cyan);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            margin: 0 0 10px 0;
            color: #fff;
        }

        p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .pro-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #020617;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(6, 182, 212, 0.3);
        }

        .pro-btn.alt {
            background: rgba(30, 41, 59, 0.8);
            color: var(--accent-cyan);
            border: 1px solid rgba(6, 182, 212, 0.3);
            box-shadow: none;
        }

        /* شريط التنقل العلوي مع سهم الرجوع الواضح */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: var(--surface-color);
            padding: 10px 15px;
            border-radius: 14px;
            border: 1px solid rgba(6, 182, 212, 0.3);
        }

        .back-arrow-btn {
            background: rgba(6, 182, 212, 0.15);
            color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan);
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .mic-box {
            text-align: center;
            margin-bottom: 15px;
        }

        .mic-main-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: #0f172a;
            border: 3px solid var(--accent-cyan);
            color: var(--accent-cyan);
            font-size: 26px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
        }

        #cameraBox {
            width: 100%;
            margin-bottom: 15px;
            display: none;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            border: 2px solid var(--accent-cyan);
        }

        video {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            display: block;
        }

        .close-cam-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #ef4444;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .analyze-action-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #020617;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            margin-bottom: 15px;
            display: none;
            cursor: pointer;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .feat-card {
            background: #0f172a;
            border: 1px solid rgba(255,255,255,0.05);
            padding: 10px 5px;
            border-radius: 12px;
            color: white;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 75px;
        }

        .feat-card span { font-size: 20px; margin-bottom: 4px; }

        .status-pane {
            margin-top: 15px;
            padding: 12px;
            background: var(--surface-color);
            border-radius: 12px;
            font-size: 13.5px;
            color: #38bdf8;
            text-align: right;
            border-right: 4px solid var(--accent-cyan);
            border: 1px solid rgba(6, 182, 212, 0.3);
        }

        .settings-group {
            text-align: right;
            margin-bottom: 15px;
        }

        .settings-group label {
            display: block;
            color: var(--accent-cyan);
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .settings-group select {
            width: 100%;
            padding: 12px;
            background: #020617;
            color: white;
            border: 1px solid rgba(6, 182, 212, 0.4);
            border-radius: 10px;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- الواجهة الرئيسية -->
    <div id="viewHome" class="view-section active-view">
        <div class="glass-card">
            <div class="icon-badge">👁️</div>
            <h1>تطبيق بصير الذكي</h1>
            <p>رفيقك الرقمي المتقدم لمساعدة المكفوفين وضعاف البصر بكل ثقة واستقلالية تامة عبر الذكاء الاصطناعي.</p>
            
            <button type="button" class="pro-btn" onclick="goToView('viewApp')">
                <span>🚀</span> ابدأ استخدام التطبيق والخدمات
            </button>
            <button type="button" class="pro-btn alt" onclick="goToView('viewSettings')">
                <span>⚙️</span> إعدادات التطبيق
            </button>
        </div>
    </div>

    <!-- صفحة الإعدادات مع سهم رجوع واضح -->
    <div id="viewSettings" class="view-section">
        <div class="glass-card">
            <div class="top-bar" style="margin-bottom: 20px;">
                <button type="button" class="back-arrow-btn" onclick="goToView('viewHome')">⬅ الرئيسية</button>
                <h2 style="margin:0; font-size:16px; color:var(--accent-cyan);">الإعدادات</h2>
                <div></div>
            </div>

            <div class="settings-group">
                <label>سرعة الناطق الصوتي:</label>
                <select id="speechRate" onchange="updateRate()">
                    <option value="0.8">بطيئة</option>
                    <option value="1.0" selected>عادية</option>
                    <option value="1.25">سريعة</option>
                </select>
            </div>

            <button type="button" class="pro-btn" onclick="goToView('viewHome')" style="margin-top: 20px;">حفظ والعودة</button>
        </div>
    </div>

    <!-- شاشة الخدمات مع أسهم الرجوع -->
    <div id="viewApp" class="view-section">
        <div style="width:100%; max-width:450px;">
            <div class="top-bar">
                <button type="button" class="back-arrow-btn" onclick="goToView('viewHome')">⬅ الرئيسية</button>
                <span style="font-weight:bold; color:var(--accent-cyan); font-size:14px;">خدمات بصير</span>
                <button type="button" class="back-arrow-btn" onclick="goToView('viewSettings')">⚙️</button>
            </div>

            <div class="mic-box">
                <button type="button" class="mic-main-btn" onclick="speak('مرحباً بك في خدمات بصير الذكية')">🎤</button>
            </div>

            <div id="cameraBox">
                <button type="button" class="close-cam-btn" onclick="stopCam()">إغلاق ✕</button>
                <video id="vidStream" autoplay playsinline></video>
            </div>

            <button type="button" id="analyzeBtn" class="analyze-action-btn" onclick="runAiAnalysis()">تحليل المشهد بالذكاء الاصطناعي 🧠</button>
            <canvas id="cvs" style="display:none;"></canvas>

            <div class="features-grid">
                <div class="feat-card" onclick="runCam('اقرأ النصوص الموجودة في الصورة بوضوح ودقة تامة باللغة العربية.')"><span>📄</span>قراءة النصوص</div>
                <div class="feat-card" onclick="runCam('صف لي ما يوجد في هذا المشهد بشكل مفيد للمكفوفين.')"><span>📷</span>صف المشهد</div>
                <div class="feat-card" onclick="runCam('حدد نوع وفئة العملة الورقية الظاهرة في الصورة.')"><span>🪙</span>العملات</div>
                <div class="feat-card" onclick="runCam('اقرأ لي محتوى الكتاب أو المستند الظاهر في الصورة.')"><span>📖</span>الكتب</div>
                <div class="feat-card" onclick="locateMe()"><span>🧭</span>الملاحة</div>
                <div class="feat-card" onclick="alertMsg('خاصية قيد التطوير')"><span>📊</span>الباركود</div>
            </div>

            <div id="statusBox" class="status-pane">التطبيق جاهز للاستخدام. اختر خدمة أو اضغط الكاميرا.</div>
        </div>
    </div>

    <script>
        let videoStream = null;
        let promptText = "صف المشهد";
        let speechSpeed = 1.0;
        const apiKey = "AQ.Ab8RN6JnrvtQcVzi6PPHobCFv56kqvE_8LXVtmARZZcRABPk6w";

        function goToView(viewId) {
            stopCam();
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active-view'));
            document.getElementById(viewId).classList.add('active-view');
            window.scrollTo(0,0);
        }

        function speak(txt) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            let utter = new SpeechSynthesisUtterance(txt);
            utter.lang = 'ar-SA';
            utter.rate = speechSpeed;
            window.speechSynthesis.speak(utter);
        }

        function updateRate() {
            speechSpeed = parseFloat(document.getElementById('speechRate').value);
            speak("تم تحديث السرعة");
        }

        async function runCam(p) {
            promptText = p;
            document.getElementById('cameraBox').style.display = 'block';
            document.getElementById('analyzeBtn').style.display = 'block';
            document.getElementById('statusBox').innerText = "تم فتح الكاميرا، وجهها للهدف واضغط تحليل.";
            speak("تم فتح الكاميرا");

            try {
                if (videoStream) videoStream.getTracks().forEach(t => t.stop());
                videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                    .catch(() => navigator.mediaDevices.getUserMedia({ video: true }));
                document.getElementById('vidStream').srcObject = videoStream;
            } catch (e) {
                document.getElementById('statusBox').innerText = "تعذر تشغيل الكاميرا.";
                speak("تعذر تشغيل الكاميرا");
            }
        }

        function stopCam() {
            if (videoStream) {
                videoStream.getTracks().forEach(t => t.stop());
                videoStream = null;
            }
            document.getElementById('cameraBox').style.display = 'none';
            document.getElementById('analyzeBtn').style.display = 'none';
        }

        async function runAiAnalysis() {
            let v = document.getElementById('vidStream');
            let c = document.getElementById('cvs');
            if (!v.srcObject) return;

            c.width = v.videoWidth || 640;
            c.height = v.videoHeight || 480;
            c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
            let b64 = c.toDataURL('image/jpeg', 0.8).split(',')[1];

            document.getElementById('statusBox').innerText = "جاري التحليل بالذكاء الاصطناعي...";
            speak("جاري التحليل");

            try {
                let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: promptText }, { inline_data: { mime_type: "image/jpeg", data: b64 } }] }] })
                });
                let data = await res.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    let ans = data.candidates[0].content.parts[0].text.trim();
                    document.getElementById('statusBox').innerText = ans;
                    speak(ans);
                } else {
                    document.getElementById('statusBox').innerText = "فشل التحليل.";
                    speak("عذراً، فشل التحليل");
                }
            } catch (err) {
                document.getElementById('statusBox').innerText = "خطأ في الاتصال.";
                speak("خطأ في الاتصال");
            }
        }

        function alertMsg(m) {
            document.getElementById('statusBox').innerText = m;
            speak(m);
        }

        function locateMe() {
            document.getElementById('statusBox').innerText = "جاري تحديد الموقع...";
            speak("جاري تحديد موقعك الجغرافي");
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(p => {
                    let txt = `موقعك: خط العرض ${p.coords.latitude.toFixed(3)}، خط الطول ${p.coords.longitude.toFixed(3)}`;
                    document.getElementById('statusBox').innerText = txt;
                    speak("تم تحديد موقعك بنجاح");
                }, () => {
                    document.getElementById('statusBox').innerText = "تعذر تحديد الموقع.";
                    speak("تعذر تحديد الموقع");
                });
            }
        }
    </script>
</body>
</html>
