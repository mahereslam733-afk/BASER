<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>قارئ المستندات العربي</title>

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap');

body{
    font-family:'Cairo',sans-serif;
}

button,label{
    -webkit-tap-highlight-color:transparent;
}

</style>

</head>


<body class="bg-slate-900 text-white min-h-screen p-4">


<!-- شاشة البداية -->

<div id="welcomeOverlay"
class="fixed inset-0 bg-slate-950/98 z-50
flex items-center justify-center p-6 text-center">

<div class="bg-indigo-900 border-4 border-indigo-500
p-8 rounded-3xl max-w-sm shadow-2xl">

<h2 class="text-3xl font-bold mb-4">
قارئ المستندات 👁️
</h2>

<p class="text-indigo-200 mb-8">
قراءة النصوص العربية بالكاميرا
</p>

<button id="startAppBtn"
class="w-full bg-emerald-600
hover:bg-emerald-500
font-extrabold py-5 px-6
rounded-2xl text-xl">

🚀 اضغط للبدء

</button>

</div>
</div>


<!-- العنوان -->

<header class="bg-indigo-800 p-4
text-center rounded-2xl mb-4">

<h1 class="text-2xl font-extrabold">
قارئ المستندات
</h1>

<p class="text-indigo-200 text-xs mt-1">
قراءة النص العربي بسرعة
</p>

</header>


<main class="max-w-md mx-auto w-full">


<!-- الكاميرا -->

<div class="relative w-full aspect-[3/4]
bg-black rounded-3xl overflow-hidden
border-4 border-indigo-500 mb-4">

<video id="cameraStream"
autoplay
playsinline
muted
class="w-full h-full object-cover">
</video>

<canvas id="snapshotCanvas"
class="hidden">
</canvas>

<div id="cameraPlaceholder"
class="absolute inset-0
flex items-center justify-center
text-slate-300 text-lg">

جاري تشغيل الكاميرا...

</div>

</div>


<!-- زر الالتقاط -->

<button id="captureBtn"
class="w-full bg-emerald-600
hover:bg-emerald-500
font-extrabold text-xl
py-4 rounded-2xl mb-3">

📸 التقاط وقراءة الصفحة

</button>


<!-- المعرض -->

<label
class="w-full bg-blue-600
hover:bg-blue-500
font-bold py-3 rounded-2xl
flex items-center justify-center
cursor-pointer mb-3">

📁 اختيار صورة من المعرض

<input id="galleryInput"
type="file"
accept="image/*"
class="hidden">

</label>


<!-- إعادة القراءة -->

<button id="repeatBtn"
class="w-full bg-amber-600
hover:bg-amber-500
font-bold py-3 rounded-2xl">

🔊 إعادة قراءة النص

</button>


<!-- الحالة -->

<div id="statusBox"
class="mt-4 bg-indigo-950
border border-indigo-800
rounded-2xl p-3 text-center text-sm">

جاهز لقراءة الصفحة

</div>


<!-- النص -->

<div class="mt-3 bg-slate-800
border border-slate-700
p-4 rounded-2xl">

<h2 class="text-indigo-300 text-sm mb-2">
النص المستخرج:
</h2>

<div id="resultText"
class="text-white text-sm
leading-8 min-h-[100px]">

وجه الكاميرا نحو الصفحة
ثم اضغط التقاط.

</div>

</div>

</main>


<script>


/* =====================================================
   العناصر
===================================================== */

const video =
document.getElementById("cameraStream");

const canvas =
document.getElementById("snapshotCanvas");

const placeholder =
document.getElementById("cameraPlaceholder");

const captureBtn =
document.getElementById("captureBtn");

const galleryInput =
document.getElementById("galleryInput");

const repeatBtn =
document.getElementById("repeatBtn");

const resultText =
document.getElementById("resultText");

const statusBox =
document.getElementById("statusBox");

const welcomeOverlay =
document.getElementById("welcomeOverlay");

const startAppBtn =
document.getElementById("startAppBtn");


let lastSpokenText = "";

let worker = null;


/* =====================================================
   الحالة
===================================================== */

function setStatus(text){

    statusBox.innerText = text;

}


/* =====================================================
   النطق العربي
===================================================== */

function speakArabic(text){

    if(!text) return;

    if(!("speechSynthesis" in window)) return;

    speechSynthesis.cancel();

    const speech =
    new SpeechSynthesisUtterance(text);

    speech.lang = "ar-EG";

    speech.rate = 0.8;

    speech.pitch = 1;

    speech.volume = 1;


    const voices =
    speechSynthesis.getVoices();


    const arabicVoice =
    voices.find(v =>
        v.lang === "ar-EG"
    ) ||

    voices.find(v =>
        v.lang.startsWith("ar")
    );


    if(arabicVoice){

        speech.voice =
        arabicVoice;

    }


    speechSynthesis.speak(
        speech
    );

    lastSpokenText =
    text;

}


/* =====================================================
   تشغيل الكاميرا
===================================================== */

async function startCamera(){

    try{

        const stream =
        await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:{
                    ideal:"environment"
                },

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }
            },

            audio:false

        });


        video.srcObject =
        stream;


        placeholder.style.display =
        "none";


        setStatus(
            "الكاميرا جاهزة للقراءة."
        );

    }

    catch(error){

        console.log(
            "Camera error:",
            error
        );


        try{

            const stream =
            await navigator.mediaDevices.getUserMedia({

                video:true,
                audio:false

            });


            video.srcObject =
            stream;


            placeholder.style.display =
            "none";

        }

        catch(e){

            placeholder.innerText =
            "تعذر تشغيل الكاميرا. استخدم المعرض.";

            setStatus(
                "الكاميرا غير متاحة."
            );

        }

    }

}


/* =====================================================
   بدء التطبيق
===================================================== */

startAppBtn.addEventListener(
"click",
async function(){

    welcomeOverlay.style.display =
    "none";

    await startCamera();


    setTimeout(
        function(){

            speakArabic(
                "التطبيق جاهز. ضع الصفحة أمام الكاميرا واضغط التقاط."
            );

        },
        500
    );

});


/* =====================================================
   تحميل الصورة
===================================================== */

function loadImage(src){

    return new Promise(
        function(resolve,reject){

            const img =
            new Image();


            img.onload =
            function(){

                resolve(img);

            };


            img.onerror =
            reject;


            img.src =
            src;

        }
    );

}


/* =====================================================
   تحسين الصورة - نسخة واحدة سريعة
===================================================== */

async function improveImage(source){

    const img =
    await loadImage(source);


    /*
       التكبير 1.8 فقط
       حتى تكون المعالجة أسرع
    */

    const scale = 1.8;


    const width =
    Math.floor(
        img.width * scale
    );


    const height =
    Math.floor(
        img.height * scale
    );


    const c =
    document.createElement(
        "canvas"
    );


    c.width =
    width;

    c.height =
    height;


    const ctx =
    c.getContext(
        "2d",
        {
            willReadFrequently:true
        }
    );


    ctx.drawImage(
        img,
        0,
        0,
        width,
        height
    );


    const imageData =
    ctx.getImageData(
        0,
        0,
        width,
        height
    );


    const pixels =
    imageData.data;


    /*
       تحويل إلى رمادي
       + تحسين التباين
    */

    for(
        let i=0;
        i<pixels.length;
        i+=4
    ){

        const r =
        pixels[i];

        const g =
        pixels[i+1];

        const b =
        pixels[i+2];


        let gray =
        0.299*r +
        0.587*g +
        0.114*b;


        /*
           تحسين التباين
        */

        gray =
        (gray - 128)
        * 1.35
        + 128;


        /*
           منع القيم الخارجة
        */

        if(gray < 0)
            gray = 0;

        if(gray > 255)
            gray = 255;


        pixels[i] =
        gray;

        pixels[i+1] =
        gray;

        pixels[i+2] =
        gray;

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    return c;

}


/* =====================================================
   إنشاء محرك OCR مرة واحدة
===================================================== */

async function getOCRWorker(){

    if(worker){

        return worker;

    }


    setStatus(
        "جاري تجهيز قارئ اللغة العربية..."
    );


    worker =
    await Tesseract.createWorker(
        "ara"
    );


    await worker.setParameters({

        tessedit_pageseg_mode:
        "6",

        user_defined_dpi:
        "300",

        preserve_interword_spaces:
        "1"

    });


    return worker;

}


/* =====================================================
   تنظيف النص
===================================================== */

function cleanArabicText(text){

    if(!text){

        return "";

    }


    /*
       إزالة الرموز الغريبة
    */

    text =
    text.replace(
        /[|_~`{}[\]\\^<>]/g,
        " "
    );


    /*
       إزالة الرموز المتكررة
    */

    text =
    text.replace(
        /[•·]{2,}/g,
        " "
    );


    /*
       إزالة المسافات الزائدة
    */

    text =
    text.replace(
        /[ \t]+/g,
        " "
    );


    /*
       تنظيف الأسطر
    */

    text =
    text
    .split("\n")
    .map(
        line =>
        line.trim()
    )
    .filter(
        line =>
        line.length > 0
    )
    .join("\n");


    return text.trim();

}


/* =====================================================
   قراءة الصورة
===================================================== */

async function readImage(source){

    try{

        captureBtn.disabled =
        true;


        captureBtn.style.opacity =
        "0.5";


        resultText.innerText =
        "جاري تجهيز الصورة...";


        setStatus(
            "جاري تحسين الصورة..."
        );


        /*
           معالجة واحدة فقط
        */

        const improved =
        await improveImage(
            source
        );


        setStatus(
            "جاري قراءة النص العربي..."
        );


        /*
           الحصول على OCR
        */

        const ocr =
        await getOCRWorker();


        /*
           قراءة واحدة فقط
        */

        const result =
        await ocr.recognize(
            improved
        );


        /*
           تنظيف النتيجة
        */

        const text =
        cleanArabicText(
            result.data.text
        );


        /*
           لا يوجد نص
        */

        if(!text){

            resultText.innerText =
            "لم يتم العثور على نص واضح.";


            setStatus(
                "لم أتمكن من قراءة النص."
            );


            speakArabic(
                "لم أتمكن من قراءة النص. حاول تقريب الكاميرا من الصفحة."
            );


            return;

        }


        /*
           عرض النص
        */

        resultText.innerText =
        text;


        setStatus(
            "تمت قراءة الصفحة."
        );


        /*
           نطق النص
        */

        speakArabic(
            text
        );

    }

    catch(error){

        console.log(
            "OCR ERROR:",
            error
        );


        resultText.innerText =
        "حدث خطأ أثناء القراءة.";


        setStatus(
            "حدث خطأ أثناء قراءة الصفحة."
        );


        speakArabic(
            "حدث خطأ أثناء قراءة الصفحة. حاول مرة أخرى."
        );

    }

    finally{

        captureBtn.disabled =
        false;


        captureBtn.style.opacity =
        "1";

    }

}


/* =====================================================
   التقاط صورة
===================================================== */

captureBtn.addEventListener(
"click",
async function(){

    if(!video.srcObject){

        speakArabic(
            "الكاميرا غير مفعلة."
        );

        return;

    }


    if(
        !video.videoWidth ||
        !video.videoHeight
    ){

        speakArabic(
            "الكاميرا لم تصبح جاهزة."
        );

        return;

    }


    canvas.width =
    video.videoWidth;


    canvas.height =
    video.videoHeight;


    const ctx =
    canvas.getContext(
        "2d"
    );


    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    const image =
    canvas.toDataURL(
        "image/jpeg",
        0.92
    );


    await readImage(
        image
    );

});


/* =====================================================
   المعرض
===================================================== */

galleryInput.addEventListener(
"change",
function(event){

    const file =
    event.target.files[0];


    if(!file){

        return;

    }


    const reader =
    new FileReader();


    reader.onload =
    async function(e){

        await readImage(
            e.target.result
        );

    };


    reader.readAsDataURL(
        file
    );


    event.target.value =
    "";

});


/* =====================================================
   إعادة القراءة
===================================================== */

repeatBtn.addEventListener(
"click",
function(){

    if(!lastSpokenText){

        speakArabic(
            "لا يوجد نص لقراءته."
        );

        return;

    }


    speakArabic(
        lastSpokenText
    );

});


/* =====================================================
   تجهيز أصوات الهاتف
===================================================== */

if(
    "speechSynthesis" in window
){

    speechSynthesis.onvoiceschanged =
    function(){

        speechSynthesis.getVoices();

    };

}

</script>

</body>
</html>
