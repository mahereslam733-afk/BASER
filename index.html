<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>قارئ المستندات العربي</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
margin:0;
padding:15px;
background:#0f172a;
color:#fff;
font-family:Arial,Tahoma,sans-serif
}

.app{
max-width:600px;
margin:auto
}

h1{
text-align:center;
background:#3730a3;
padding:18px;
border-radius:20px;
margin-top:0
}

.camera{
position:relative;
height:55vh;
min-height:330px;
background:#000;
border:4px solid #6366f1;
border-radius:22px;
overflow:hidden
}

video{
width:100%;
height:100%;
object-fit:cover
}

.cameraMessage{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
font-size:18px;
padding:20px
}

button,label{
width:100%;
border:0;
border-radius:18px;
padding:17px;
margin-top:12px;
color:white;
font-size:18px;
font-weight:bold;
text-align:center;
cursor:pointer
}

.capture{background:#059669}
.gallery{background:#2563eb}
.repeat{background:#d97706}
.stop{background:#dc2626}

input{display:none}

.status{
margin-top:15px;
padding:13px;
border-radius:15px;
background:#172554;
text-align:center
}

.result{
margin-top:15px;
padding:15px;
border-radius:18px;
background:#1e293b
}

.resultTitle{
color:#a5b4fc;
font-weight:bold;
margin-bottom:10px
}

#result{
white-space:pre-wrap;
line-height:2;
font-size:18px;
min-height:120px
}

#loading{
display:none;
position:fixed;
inset:0;
z-index:9999;
background:rgba(0,0,0,.85);
align-items:center;
justify-content:center
}

.loadingBox{
width:90%;
max-width:350px;
background:#1e293b;
border-radius:20px;
padding:30px;
text-align:center
}

.spinner{
width:45px;
height:45px;
border:5px solid #475569;
border-top-color:#22c55e;
border-radius:50%;
animation:spin 1s linear infinite;
margin:0 auto 15px
}

@keyframes spin{
to{transform:rotate(360deg)}
}

#welcome{
position:fixed;
inset:0;
z-index:10000;
background:#020617;
display:flex;
align-items:center;
justify-content:center;
padding:20px
}

.welcomeBox{
width:100%;
max-width:400px;
background:#312e81;
border:3px solid #6366f1;
border-radius:25px;
padding:30px 20px;
text-align:center
}

.start{
background:#059669
}
</style>
</head>

<body>

<div id="welcome">
<div class="welcomeBox">

<h2>📖 قارئ المستندات العربي</h2>

<p>اقرأ النصوص العربية بالكاميرا</p>

<p style="color:#c7d2fe">
يعمل بدون Gemini وبدون API
</p>

<button id="start" class="start">
🚀 ابدأ التطبيق
</button>

</div>
</div>

<div id="loading">

<div class="loadingBox">

<div class="spinner"></div>

<div id="loadingText">
جاري تشغيل قارئ العربية...
</div>

</div>

</div>

<div class="app">

<h1>📖 قارئ المستندات</h1>

<div class="camera">

<video id="video" autoplay playsinline muted></video>

<div id="cameraMessage" class="cameraMessage">
اضغط ابدأ لتشغيل الكاميرا
</div>

</div>

<canvas id="canvas" style="display:none"></canvas>

<button id="capture" class="capture">
📸 تصوير وقراءة الصفحة
</button>

<label class="gallery">
📁 اختيار صورة من الهاتف
<input id="file" type="file" accept="image/*">
</label>

<button id="repeat" class="repeat">
🔊 إعادة قراءة النص
</button>

<button id="stop" class="stop">
🔇 إيقاف القراءة
</button>

<div id="status" class="status">
جاهز
</div>

<div class="result">

<div class="resultTitle">
النص المستخرج:
</div>

<div id="result">
وجّه الكاميرا نحو المستند واضغط تصوير.
</div>

</div>

</div>

<script>

/* =========================
   العناصر
========================= */

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");

const start=document.getElementById("start");
const capture=document.getElementById("capture");
const file=document.getElementById("file");

const repeat=document.getElementById("repeat");
const stop=document.getElementById("stop");

const result=document.getElementById("result");
const status=document.getElementById("status");

const welcome=document.getElementById("welcome");
const cameraMessage=document.getElementById("cameraMessage");

const loading=document.getElementById("loading");
const loadingText=document.getElementById("loadingText");


let stream=null;
let worker=null;
let lastText="";
let busy=false;


/* =========================
   الحالة
========================= */

function setStatus(text){
status.textContent=text;
}


/* =========================
   النطق العربي
========================= */

function speak(text){

if(!text)return;

if(!("speechSynthesis" in window))return;

speechSynthesis.cancel();

const u=new SpeechSynthesisUtterance(text);

u.lang="ar-EG";
u.rate=0.78;
u.pitch=1;
u.volume=1;

const voices=speechSynthesis.getVoices();

const arabicVoice=
voices.find(v=>v.lang==="ar-EG")
||
voices.find(v=>v.lang.startsWith("ar"));

if(arabicVoice){
u.voice=arabicVoice;
}

speechSynthesis.speak(u);

}


/* =========================
   الكاميرا
========================= */

async function startCamera(){

try{

stream=await navigator.mediaDevices.getUserMedia({

video:{
facingMode:{ideal:"environment"},
width:{ideal:1920},
height:{ideal:1080}
},

audio:false

});

video.srcObject=stream;

cameraMessage.style.display="none";

setStatus("الكاميرا جاهزة");

}

catch(error){

console.error(error);

cameraMessage.innerHTML=
"تعذر تشغيل الكاميرا.<br><br>استخدم اختيار صورة من الهاتف.";

setStatus("الكاميرا غير متاحة");

}

}


/* =========================
   تشغيل Tesseract
========================= */

async function startOCR(){

if(worker)return worker;

loading.style.display="flex";

loadingText.textContent=
"جاري تحميل قارئ العربية...";

try{

worker=await Tesseract.createWorker(
"ara",
1,
{

logger:function(info){

console.log(info);

if(info.status==="loading tesseract core"){

loadingText.textContent=
"جاري تحميل محرك القراءة...";

}

else if(info.status==="loading language traineddata"){

loadingText.textContent=
"جاري تحميل اللغة العربية...";

}

else if(info.status==="recognizing text"){

const percent=
Math.round((info.progress||0)*100);

loadingText.textContent=
"جاري قراءة الصفحة "+percent+"%";

}

}

}
);

await worker.setParameters({

tessedit_pageseg_mode:"6",

preserve_interword_spaces:"1",

user_defined_dpi:"300"

});

setStatus("قارئ العربية جاهز");

return worker;

}

catch(error){

console.error("OCR ERROR:",error);

worker=null;

throw error;

}

finally{

loading.style.display="none";

}

}


/* =========================
   تحسين الصورة
========================= */

function prepareImage(source){

return new Promise((resolve,reject)=>{

const img=new Image();

img.onload=function(){

let width=img.naturalWidth;
let height=img.naturalHeight;


/*
   لا نكبر الصورة جدًا
*/

const maxWidth=1800;

if(width>maxWidth){

const ratio=maxWidth/width;

width=Math.round(width*ratio);
height=Math.round(height*ratio);

}


canvas.width=width;
canvas.height=height;

const ctx=canvas.getContext("2d");

ctx.drawImage(
img,
0,
0,
width,
height
);


/*
   تحسين التباين والإضاءة
*/

const imageData=
ctx.getImageData(
0,
0,
width,
height
);

const data=imageData.data;

for(let i=0;i<data.length;i+=4){

let gray=
0.299*data[i]+
0.587*data[i+1]+
0.114*data[i+2];


/*
   زيادة التباين
*/

gray=
(gray-128)*1.25+128;

gray=
Math.max(0,Math.min(255,gray));

data[i]=gray;
data[i+1]=gray;
data[i+2]=gray;

}

ctx.putImageData(
imageData,
0,
0
);

resolve(canvas);

};

img.onerror=function(){

reject(
new Error("تعذر فتح الصورة")
);

};

img.src=source;

});

}


/* =========================
   تنظيف OCR
========================= */

function cleanText(text){

return text

.replace(/\r/g,"")

.replace(/[|{}[\]<>~`^]/g," ")

.replace(/[ \t]+/g," ")

.split("\n")

.map(line=>line.trim())

.filter(line=>line.length>0)

.join("\n")

.trim();

}


/* =========================
   قراءة الصورة
========================= */

async function readImage(source){

if(busy)return;

busy=true;

capture.disabled=true;

loading.style.display="flex";

try{

result.textContent=
"جاري قراءة الصفحة...";

setStatus(
"جاري تجهيز الصورة..."
);


const image=
await prepareImage(source);


const ocr=
await startOCR();


setStatus(
"جاري التعرف على النص العربي..."
);


const data=
await ocr.recognize(image);


let text=
data.data.text||"";


text=cleanText(text);


if(!text){

result.textContent=
"لم يتم العثور على نص واضح.";

setStatus(
"لم يتم العثور على نص"
);

speak(
"لم أتمكن من قراءة النص. حاول تصوير الصفحة بشكل أوضح."
);

return;

}


result.textContent=text;

lastText=text;

setStatus(
"تمت قراءة الصفحة بنجاح"
);

speak(text);

}

catch(error){

console.error(error);

result.textContent=
"حدث خطأ أثناء قراءة الصفحة.";

setStatus(
"تعذر تشغيل قارئ العربية"
);

speak(
"حدث خطأ أثناء قراءة الصفحة."
);

}

finally{

busy=false;

capture.disabled=false;

loading.style.display="none";

}

}


/* =========================
   بدء التطبيق
========================= */

start.addEventListener(
"click",
async function(){

welcome.style.display="none";

await startCamera();

setTimeout(function(){

speak(
"التطبيق جاهز. ضع الصفحة أمام الكاميرا واضغط تصوير."
);

},500);

});


/* =========================
   التصوير
========================= */

capture.addEventListener(
"click",
async function(){

if(!video.videoWidth){

speak(
"الكاميرا غير جاهزة."
);

return;

}


let width=video.videoWidth;
let height=video.videoHeight;

const maxWidth=1800;

if(width>maxWidth){

const ratio=maxWidth/width;

width=Math.round(width*ratio);
height=Math.round(height*ratio);

}

canvas.width=width;
canvas.height=height;

const ctx=canvas.getContext("2d");

ctx.drawImage(
video,
0,
0,
width,
height
);

const image=
canvas.toDataURL(
"image/jpeg",
0.92
);

await readImage(image);

});


/* =========================
   المعرض
========================= */

file.addEventListener(
"change",
function(event){

const selectedFile=
event.target.files[0];

if(!selectedFile)return;

if(
!selectedFile.type.startsWith("image/")
){

speak(
"الملف المختار ليس صورة."
);

return;

}

const reader=
new FileReader();

reader.onload=
async function(){

await readImage(
reader.result
);

};

reader.readAsDataURL(
selectedFile
);

file.value="";

});


/* =========================
   إعادة القراءة
========================= */

repeat.addEventListener(
"click",
function(){

if(lastText){

speak(lastText);

}
else{

speak(
"لا يوجد نص لقراءته."
);

}

});


/* =========================
   إيقاف الصوت
========================= */

stop.addEventListener(
"click",
function(){

if("speechSynthesis" in window){

speechSynthesis.cancel();

}

});


/* =========================
   تحميل الأصوات
========================= */

if("speechSynthesis" in window){

speechSynthesis.onvoiceschanged=
function(){

speechSynthesis.getVoices();

};

}

</script>

</body>
</html>
