<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,
maximum-scale=1.0,user-scalable=no">

<title>قارئ عربي Offline</title>

<script src="./tesseract.min.js"></script>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
margin:0;
background:#0f172a;
color:white;
font-family:Arial,Tahoma,sans-serif;
padding:15px;
}

.app{
max-width:600px;
margin:auto;
}

h1{
text-align:center;
background:#3730a3;
padding:18px;
border-radius:20px;
font-size:25px;
}

.camera{
position:relative;
height:60vh;
min-height:350px;
background:#000;
border:4px solid #6366f1;
border-radius:22px;
overflow:hidden;
}

video{
width:100%;
height:100%;
object-fit:cover;
}

.message{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
font-size:18px;
}

button,
label{
display:block;
width:100%;
border:0;
border-radius:18px;
padding:17px;
margin-top:12px;
font-size:18px;
font-weight:bold;
text-align:center;
cursor:pointer;
color:white;
}

.capture{
background:#059669;
}

.gallery{
background:#2563eb;
}

.repeat{
background:#d97706;
}

.stop{
background:#dc2626;
}

input{
display:none;
}

.status{
margin-top:15px;
background:#172554;
padding:13px;
border-radius:15px;
text-align:center;
}

.result{
margin-top:15px;
background:#1e293b;
padding:15px;
border-radius:18px;
}

.result-title{
color:#a5b4fc;
font-weight:bold;
margin-bottom:10px;
}

#result{
white-space:pre-wrap;
line-height:2;
font-size:18px;
min-height:120px;
}

#loading{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
z-index:9999;
align-items:center;
justify-content:center;
text-align:center;
}

.loading-box{
background:#1e293b;
padding:30px;
border-radius:20px;
width:90%;
max-width:350px;
}

.spinner{
width:45px;
height:45px;
border:5px solid #475569;
border-top-color:#22c55e;
border-radius:50%;
animation:spin 1s linear infinite;
margin:auto auto 15px;
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}

#welcome{
position:fixed;
inset:0;
background:#020617;
z-index:10000;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.welcome-box{
background:#312e81;
padding:30px 20px;
border-radius:25px;
width:100%;
max-width:400px;
text-align:center;
border:3px solid #6366f1;
}

.start{
background:#059669;
}

</style>
</head>


<body>


<!-- شاشة البداية -->

<div id="welcome">

<div class="welcome-box">

<h2>
📖 قارئ المستندات العربي
</h2>

<p>
قارئ عربي يعمل محليًا
</p>

<p style="color:#c7d2fe;font-size:14px">

بدون Gemini وبدون API

</p>

<button
id="start"
class="start">

🚀 ابدأ التطبيق

</button>

</div>

</div>


<!-- شاشة التحميل -->

<div id="loading">

<div class="loading-box">

<div class="spinner"></div>

<div id="loadingText">
جاري تشغيل قارئ العربية...
</div>

</div>

</div>


<div class="app">


<h1>
📖 قارئ المستندات
</h1>


<!-- الكاميرا -->

<div class="camera">

<video
id="video"
autoplay
playsinline
muted>
</video>

<div
id="cameraMessage"
class="message">

اضغط ابدأ لتشغيل الكاميرا

</div>

</div>


<canvas
id="canvas"
style="display:none">
</canvas>


<!-- التصوير -->

<button
id="capture"
class="capture">

📸 تصوير وقراءة الصفحة

</button>


<!-- المعرض -->

<label class="gallery">

📁 اختيار صورة من الهاتف

<input
id="file"
type="file"
accept="image/*">

</label>


<!-- إعادة القراءة -->

<button
id="repeat"
class="repeat">

🔊 إعادة قراءة النص

</button>


<!-- إيقاف -->

<button
id="stop"
class="stop">

🔇 إيقاف الصوت

</button>


<!-- الحالة -->

<div
id="status"
class="status">

جاهز

</div>


<!-- النص -->

<div class="result">

<div class="result-title">
النص المستخرج:
</div>

<div id="result">

لم يتم التقاط أي نص بعد.

</div>

</div>

</div>


<script>

/* ==================================================
   العناصر
================================================== */

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const startButton =
document.getElementById("start");

const captureButton =
document.getElementById("capture");

const fileInput =
document.getElementById("file");

const repeatButton =
document.getElementById("repeat");

const stopButton =
document.getElementById("stop");

const result =
document.getElementById("result");

const status =
document.getElementById("status");

const welcome =
document.getElementById("welcome");

const cameraMessage =
document.getElementById("cameraMessage");

const loading =
document.getElementById("loading");

const loadingText =
document.getElementById("loadingText");


let stream = null;

let worker = null;

let lastText = "";

let busy = false;


/* ==================================================
   الحالة
================================================== */

function setStatus(text){

status.textContent = text;

}


/* ==================================================
   الصوت
================================================== */

function speak(text){

if(!text){

return;

}

if(!("speechSynthesis" in window)){

return;

}

speechSynthesis.cancel();


const u =
new SpeechSynthesisUtterance(text);


u.lang = "ar-EG";

u.rate = 0.78;

u.pitch = 1;

u.volume = 1;


const voices =
speechSynthesis.getVoices();


const voice =
voices.find(
v => v.lang === "ar-EG"
)
||
voices.find(
v => v.lang.startsWith("ar")
);


if(voice){

u.voice = voice;

}


speechSynthesis.speak(u);

lastText = text;

}


/* ==================================================
   تشغيل الكاميرا
================================================== */

async function startCamera(){

try{

stream =
await navigator.mediaDevices.getUserMedia({

video:{
facingMode:{
ideal:"environment"
},
width:{
ideal:1920
},
height:{
ideal:1080
}
},

audio:false

});


video.srcObject = stream;

cameraMessage.style.display = "none";

setStatus(
"الكاميرا جاهزة"
);

}

catch(error){

console.error(error);

cameraMessage.innerHTML =
"⚠️ تعذر تشغيل الكاميرا<br><br>استخدم صورة من المعرض.";

setStatus(
"الكاميرا غير متاحة"
);

}

}


/* ==================================================
   إنشاء Tesseract Worker محلي
================================================== */

async function loadOCR(){

if(worker){

return worker;

}


loading.style.display = "flex";

loadingText.textContent =
"جاري تشغيل قارئ العربية...";


try{

worker =
await Tesseract.createWorker(
"ara",
1,
{

workerPath:
"./worker.min.js",

langPath:
"./tessdata/",

corePath:
"./",

logger:
function(info){

if(
info.status ===
"loading tesseract core"
){

loadingText.textContent =
"جاري تشغيل محرك OCR...";

}

if(
info.status ===
"loading language traineddata"
){

loadingText.textContent =
"جاري تحميل اللغة العربية...";

}

if(
info.status ===
"recognizing text"
){

const p =
Math.round(
(info.progress || 0) * 100
);

loadingText.textContent =
"جاري قراءة الصفحة "
+ p +
"%";

}

}

}
);


await worker.setParameters({

tessedit_pageseg_mode:"6",

preserve_interword_spaces:"1",

user_defined_dpi:"300"

});


setStatus(
"قارئ العربية جاهز"
);


return worker;

}

catch(error){

console.error(
"TESSERACT ERROR:",
error
);

worker = null;

setStatus(
"خطأ في ملفات قارئ العربية"
);

result.textContent =
"تعذر تشغيل قارئ النص العربي. تأكد من وجود ملفات Tesseract المحلية.";

throw error;

}

finally{

loading.style.display = "none";

}

}


/* ==================================================
   تجهيز الصورة
================================================== */

function prepareImage(source){

return new Promise(
(resolve,reject)=>{

const img = new Image();


img.onload = ()=>{

let width =
img.naturalWidth;

let height =
img.naturalHeight;


/*
   لا نسمح بصورة ضخمة جدًا
   حتى لا يصبح الهاتف بطيئًا
*/

const maxWidth = 1800;


if(width > maxWidth){

const ratio =
maxWidth / width;

width =
Math.round(
width * ratio
);

height =
Math.round(
height * ratio
);

}


canvas.width = width;

canvas.height = height;


const ctx =
canvas.getContext("2d");


/*
   تحسين خفيف للمستند
*/

ctx.filter =
"contrast(1.15) brightness(1.05)";


ctx.drawImage(
img,
0,
0,
width,
height
);


ctx.filter = "none";


resolve(canvas);

};


img.onerror =
()=>{

reject(
new Error(
"تعذر فتح الصورة"
)
);

};


img.src = source;

});

}


/* ==================================================
   قراءة الصورة
================================================== */

async function readImage(source){

if(busy){

return;

}

busy = true;

captureButton.disabled = true;


try{

result.textContent =
"جاري قراءة الصفحة...";


setStatus(
"جاري تجهيز الصورة..."
);


const image =
await prepareImage(source);


const ocr =
await loadOCR();


setStatus(
"جاري التعرف على النص العربي..."
);


const data =
await ocr.recognize(image);


let text =
data.data.text || "";


/*
   تنظيف الضوضاء فقط
*/

text =
text
.replace(/\r/g,"")
.replace(/[|{}[\]<>~`^]+/g," ")
.replace(/[ \t]+/g," ")
.split("\n")
.map(
line => line.trim()
)
.filter(
line => line.length > 0
)
.join("\n")
.trim();


if(!text){

result.textContent =
"لم يتم العثور على نص واضح.";

setStatus(
"لم يتم العثور على نص"
);

speak(
"لم أتمكن من قراءة النص. حاول تصوير الصفحة بشكل أوضح."
);

return;

}


result.textContent =
text;

lastText =
text;


setStatus(
"تمت قراءة الصفحة بنجاح"
);


speak(text);

}

catch(error){

console.error(error);

result.textContent =
"حدث خطأ أثناء قراءة الصفحة.";

setStatus(
"حدث خطأ في قارئ العربية"
);

speak(
"حدث خطأ أثناء قراءة الصفحة."
);

}

finally{

busy = false;

captureButton.disabled = false;

loading.style.display = "none";

}

}


/* ==================================================
   زر البداية
================================================== */

startButton.addEventListener(
"click",
async ()=>{

welcome.style.display = "none";

await startCamera();

setTimeout(
()=>{

speak(
"التطبيق جاهز. ضع الصفحة أمام الكاميرا واضغط تصوير."
);

},
500
);

});


/* ==================================================
   التقاط الصورة
================================================== */

captureButton.addEventListener(
"click",
async ()=>{

if(!video.videoWidth){

speak(
"الكاميرا غير جاهزة."
);

return;

}


canvas.width =
video.videoWidth;

canvas.height =
video.videoHeight;


const ctx =
canvas.getContext("2d");


ctx.drawImage(
video,
0,
0,
canvas.width,
canvas.height
);


const image =
canvas.toDataURL(
"image/jpeg",
0.95
);


await readImage(image);

});


/* ==================================================
   اختيار صورة من المعرض
================================================== */

fileInput.addEventListener(
"change",
async event=>{

const file =
event.target.files[0];


if(!file){

return;

}


if(
!file.type.startsWith("image/")
){

speak(
"الملف ليس صورة."
);

return;

}


const reader =
new FileReader();


reader.onload =
async ()=>{

await readImage(
reader.result
);

};


reader.readAsDataURL(file);


event.target.value = "";

});


/* ==================================================
   إعادة القراءة
================================================== */

repeatButton.addEventListener(
"click",
()=>{

if(lastText){

speak(lastText);

}
else{

speak(
"لا يوجد نص لقراءته."
);

}

});


/* ==================================================
   إيقاف الصوت
================================================== */

stopButton.addEventListener(
"click",
()=>{

speechSynthesis.cancel();

});


/* ==================================================
   تحميل الأصوات
================================================== */

if(
"speechSynthesis" in window
){

speechSynthesis.onvoiceschanged =
()=>{

speechSynthesis.getVoices();

};

}

</script>

</body>

</html>
