<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق أبصار - الذكاء الاصطناعي للمكفوفين</title>
  
  <!-- استدعاء مكاتب TensorFlow.js ونموذج COCO-SSD -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      color: #00e676;
      margin-bottom: 10px;
    }
    .camera-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      background: #000;
    }
    video, canvas {
      width: 100%;
      height: auto;
      display: block;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }
    .controls {
      width: 100%;
      max-width: 480px;
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background-color: #00e676;
      color: #000;
      cursor: pointer;
      transition: 0.2s;
    }
    button:disabled {
      background-color: #444;
      color: #888;
    }
    .status-box {
      margin-top: 15px;
      padding: 12px;
      background: #1e1e1e;
      border-radius: 8px;
      width: 100%;
      max-width: 480px;
      text-align: center;
      font-size: 16px;
      color: #ffd54f;
    }
  </style>
</head>
<body>

  <h1>تطبيق أبصار 👁️</h1>

  <div class="camera-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="outputCanvas"></canvas>
  </div>

  <div class="status-box" id="statusBox">جاري تحميل نموذج التعرف على الأشياء...</div>

  <div class="controls">
    <button id="startBtn" disabled>تشغيل الكاميرا والتعرف اللحظي</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
