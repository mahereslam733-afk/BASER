<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق أبصار الذكي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #000000;
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
            padding: 15px;
            text-align: center;
        }
        header {
            padding: 10px 0;
            border-bottom: 3px solid #FFFF00;
        }
        h1 {
            color: #FFFF00;
            font-size: 2.2rem;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #00FF00;
            font-size: 1.2rem;
            font-weight: bold;
        }
        main {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 20px 0;
        }
        .btn-large {
            width: 100%;
            padding: 25px 15px;
            font-size: 1.8rem;
            font-weight: bold;
            border: 4px solid #FFFFFF;
            border-radius: 20px;
            cursor: pointer;
            outline: none;
            transition: transform 0.1s ease;
        }
        .btn-large:active {
            transform: scale(0.98);
        }
        .btn-cam {
            background-color: #008000;
            color: #FFFFFF;
        }
        .btn-speak {
            background-color: #0055FF;
            color: #FFFFFF;
        }
        #status-box {
            background-color: #111111;
            border: 3px solid #FFFF00;
            border-radius: 15px;
            padding: 20px;
            font-size: 1.6rem;
            color: #00FF00;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.5;
            word-break: break-word;
        }
        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>تطبيق أبصار</h1>
        <p class="subtitle">المساعد الذكي البصري</p>
    </header>

    <main>
        <!-- زر فتح الكاميرا -->
        <button class="btn-large btn-cam" id="captureBtn" aria-label="اضغط للتعرف على الأشياء بالطلب">
            📷 التقط صورة للتعرف
        </button>

        <input type="file" id="fileInput" accept="image/*" capture="environment">

        <!-- زر إعادة النطق -->
        <button class="btn-large btn-speak" id="repeatBtn" aria-label="إعادة نطق الوصف السابق">
            🔊 إعادة نطق الوصف
        </button>

        <!-- مربع النتيجة النصية للمكفوفين -->
        <div id="status-box" aria-live="polite">
            مرحباً بك في أبصار. اضغط على الزر الأخضر لالتقاط صورة.
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
