<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>قارئ عربي ذكي</title>

<!-- Tesseract.js يعمل من الإنترنت -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    padding:15px;
    background:#0f172a;
    color:#fff;
    font-family:Arial,Tahoma,sans-serif;
}

.app{
    width:100%;
    max-width:600px;
    margin:auto;
}

h1{
    text-align:center;
    background:#3730a3;
    padding:18px;
    border-radius:20px;
    margin:0 0 15px;
    font-size:25px;
}

.camera{
    position:relative;
    width:100%;
    height:58vh;
    min-height:360px;
    background:#000;
    border:4px solid #6366f1;
    border-radius:22px;
    overflow:hidden;
}

video{
    width:100%;
    height:100%;
    object-fit:cover;
}

.camera-message{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    font-size:19px;
}

.scan-frame{
    position:absolute;
    top:10%;
    left:8%;
    right:8%;
    bottom:10%;
    border:2px solid rgba(255,255,255,.8);
    border-radius:10px;
    pointer-events:none;
}

button,
.file-button{
    width:100%;
    border:0;
    border-radius:18px;
    padding:17px;
    margin-top:12px;
    color:white;
    font-size:18px;
    font-weight:bold;
    text-align:center;
    cursor:pointer;
}

button:disabled{
    opacity:.5;
}

.capture{
    background:#059669;
}

.gallery{
    background:#2563eb;
}

.repeat{
    background:#d97706;
}

.stop{
    background:#dc2626;
}

input{
    display:none;
}

.status{
    margin-top:15px;
    padding:13px;
    border-radius:15px;
    background:#172554;
    text-align:center;
    font-weight:bold;
}

.result{
    margin-top:15px;
    padding:15px;
    border-radius:18px;
    background:#1e293b;
}

.result-title{
    color:#a5b4fc;
    font-weight:bold;
    margin-bottom:10px;
}

#result{
    white-space:pre-wrap;
    line-height:2;
    font-size:18px;
    min-height:120px;
}

#loading{
    display:none;
    position:fixed;
    inset:0;
    z-index:9999;
    background:rgba(0,0,0,.88);
    align-items:center;
    justify-content:center;
}

.loading-box{
    width:90%;
    max-width:350px;
    background:#1e293b;
    border-radius:22px;
    padding:30px;
    text-align:center;
}

.spinner{
    width:48px;
    height:48px;
    border:5px solid #475569;
    border-top-color:#22c55e;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:0 auto 18px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

#welcome{
    position:fixed;
    inset:0;
    z-index:10000;
    background:#020617;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.welcome-box{
    width:100%;
    max-width:400px;
    background:#312e81;
    border:3px solid #6366f1;
    border-radius:25px;
    padding:30px 20px;
    text-align:center;
}

.start{
    background:#059669;
}

.small-note{
    color:#cbd5e1;
    font-size:13px;
    line-height:1.8;
    margin-top:12px;
}

</style>

</head>

<body>


<!-- ================================
     شاشة البداية
================================ -->

<div id="welcome">

    <div class="welcome-box">

        <h2>
            📖 قارئ المستندات العربي
        </h2>

        <p>
            قراءة النصوص العربية بالكاميرا
        </p>

        <p style="color:#c7d2fe">
            بدون Gemini وبدون API
        </p>

        <button
            id="start"
            class="start">

            🚀 ابدأ التطبيق

        </button>

        <div class="small-note">
            يحتاج الإنترنت لتحميل محرك القراءة واللغة العربية.
        </div>

    </div>

</div>


<!-- ================================
     شاشة التحميل
================================ -->

<div id="loading">

    <div class="loading-box">

        <div class="spinner"></div>

        <div id="loadingText">
            جاري تشغيل قارئ العربية...
        </div>

    </div>

</div>


<div class="app">


<h1>
    📖 قارئ المستندات
</h1>


<!-- ================================
     الكاميرا
================================ -->

<div class="camera">

    <video
        id="video"
        autoplay
        playsinline
        muted>
    </video>

    <div
        id="cameraMessage"
        class="camera-message">

        اضغط ابدأ لتشغيل الكاميرا

    </div>

    <div class="scan-frame"></div>

</div>


<canvas
    id="canvas"
    style="display:none">
</canvas>


<!-- ================================
     تصوير
================================ -->

<button
    id="capture"
    class="capture">

    📸 تصوير وقراءة الصفحة

</button>


<!-- ================================
     المعرض
================================ -->

<label
    class="file-button gallery">

    📁 اختيار صورة من الهاتف

    <input
        id="file"
        type="file"
        accept="image/*">

</label>


<!-- ================================
     إعادة القراءة
================================ -->

<button
    id="repeat"
    class="repeat">

    🔊 إعادة قراءة النص

</button>


<!-- ================================
     إيقاف
================================ -->

<button
    id="stop"
    class="stop">

    🔇 إيقاف القراءة

</button>


<!-- ================================
     الحالة
================================ -->

<div
    id="status"
    class="status">

    جاهز

</div>


<!-- ================================
     النتيجة
================================ -->

<div class="result">

    <div class="result-title">
        النص المستخرج:
    </div>

    <div id="result">

        وجّه الصفحة داخل الإطار
        ثم اضغط تصوير.

    </div>

</div>


</div>


<script>

/* ==========================================
   عناصر التطبيق
========================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const startButton =
    document.getElementById("start");

const captureButton =
    document.getElementById("capture");

const fileInput =
    document.getElementById("file");

const repeatButton =
    document.getElementById("repeat");

const stopButton =
    document.getElementById("stop");

const result =
    document.getElementById("result");

const status =
    document.getElementById("status");

const welcome =
    document.getElementById("welcome");

const cameraMessage =
    document.getElementById("cameraMessage");

const loading =
    document.getElementById("loading");

const loadingText =
    document.getElementById("loadingText");


let stream = null;

let worker = null;

let lastText = "";

let busy = false;


/* ==========================================
   الحالة
========================================== */

function setStatus(text){

    status.textContent = text;

}


/* ==========================================
   الصوت العربي
========================================== */

function speak(text){

    if(!text){
        return;
    }

    if(!("speechSynthesis" in window)){
        return;
    }

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang =
        "ar-EG";

    utterance.rate =
        0.78;

    utterance.pitch =
        1;

    utterance.volume =
        1;


    const voices =
        speechSynthesis.getVoices();


    const arabicVoice =
        voices.find(
            v => v.lang === "ar-EG"
        )
        ||
        voices.find(
            v => v.lang.startsWith("ar")
        );


    if(arabicVoice){
        utterance.voice =
            arabicVoice;
    }


    speechSynthesis.speak(
        utterance
    );

}


/* ==========================================
   تشغيل الكاميرا
========================================== */

async function startCamera(){

    try{

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            throw new Error(
                "الكاميرا غير مدعومة"
            );

        }


        stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:{
                        ideal:"environment"
                    },

                    width:{
                        ideal:1920
                    },

                    height:{
                        ideal:1080
                    }
                },

                audio:false

            });


        video.srcObject =
            stream;


        cameraMessage.style.display =
            "none";


        setStatus(
            "الكاميرا جاهزة"
        );

    }

    catch(error){

        console.error(
            error
        );


        cameraMessage.innerHTML =
            "⚠️ تعذر تشغيل الكاميرا<br><br>استخدم اختيار صورة من الهاتف.";


        setStatus(
            "الكاميرا غير متاحة"
        );

    }

}


/* ==========================================
   تشغيل Tesseract
========================================== */

async function startOCR(){

    if(worker){
        return worker;
    }


    loading.style.display =
        "flex";


    loadingText.textContent =
        "جاري تحميل قارئ العربية لأول مرة...";


    try{

        /*
         * v5:
         * اللغة و OEM يحددان عند createWorker.
         * لا نستخدم loadLanguage أو initialize.
         */

        worker =
            await Tesseract.createWorker(
                "ara",
                1,
                {

                    logger:function(info){

                        console.log(
                            info
                        );


                        if(
                            info.status ===
                            "loading tesseract core"
                        ){

                            loadingText.textContent =
                                "جاري تحميل محرك القراءة...";

                        }


                        else if(
                            info.status ===
                            "loading language traineddata"
                        ){

                            loadingText.textContent =
                                "جاري تحميل اللغة العربية...";

                        }


                        else if(
                            info.status ===
                            "recognizing text"
                        ){

                            const percent =
                                Math.round(
                                    (info.progress || 0) *
                                    100
                                );


                            loadingText.textContent =
                                "جاري قراءة الصفحة "
                                +
                                percent
                                +
                                "%";

                        }

                    }

                }
            );


        /*
         * إعداد الصفحة كمستند/كتلة نص.
         */

        await worker.setParameters({

            tessedit_pageseg_mode:
                "6",

            preserve_interword_spaces:
                "1",

            user_defined_dpi:
                "300"

        });


        setStatus(
            "قارئ العربية جاهز"
        );


        return worker;

    }

    catch(error){

        console.error(
            "TESSERACT ERROR:",
            error
        );


        worker =
            null;


        throw error;

    }

    finally{

        loading.style.display =
            "none";

    }

}


/* ==========================================
   إنشاء صورة مناسبة للـOCR
========================================== */

function makeOCRImage(source){

    return new Promise(
        (resolve,reject)=>{

            const img =
                new Image();


            img.onload =
            function(){

                let width =
                    img.naturalWidth;

                let height =
                    img.naturalHeight;


                /*
                 * نحافظ على جودة الصورة.
                 * لا نحولها إلى أبيض وأسود.
                 */

                const maxWidth =
                    2200;


                if(
                    width > maxWidth
                ){

                    const ratio =
                        maxWidth /
                        width;


                    width =
                        Math.round(
                            width * ratio
                        );


                    height =
                        Math.round(
                            height * ratio
                        );

                }


                canvas.width =
                    width;

                canvas.height =
                    height;


                const ctx =
                    canvas.getContext(
                        "2d",
                        {
                            willReadFrequently:true
                        }
                    );


                /*
                 * الصورة الأصلية
                 */

                ctx.filter =
                    "contrast(1.08) brightness(1.02)";


                ctx.drawImage(
                    img,
                    0,
                    0,
                    width,
                    height
                );


                ctx.filter =
                    "none";


                resolve(
                    canvas
                );

            };


            img.onerror =
            function(){

                reject(
                    new Error(
                        "تعذر فتح الصورة"
                    )
                );

            };


            img.src =
                source;

        }
    );

}


/* ==========================================
   تنظيف النص
========================================== */

function cleanText(text){

    if(!text){
        return "";
    }


    let lines =
        text
        .replace(/\r/g,"")
        .split("\n");


    const cleaned = [];


    for(
        let i = 0;
        i < lines.length;
        i++
    ){

        let line =
            lines[i]
            .replace(
                /[|{}[\]<>~`^]+/g,
                " "
            )
            .replace(
                /[ \t]+/g,
                " "
            )
            .trim();


        /*
         * تجاهل الأسطر التي تحتوي
         * على رموز قليلة جدًا.
         */

        const arabicCount =
            (
                line.match(
                    /[\u0600-\u06FF]/g
                )
                ||
                []
            ).length;


        const numberCount =
            (
                line.match(
                    /[0-9٠-٩]/g
                )
                ||
                []
            ).length;


        if(
            line.length < 2 &&
            arabicCount === 0 &&
            numberCount === 0
        ){

            continue;

        }


        cleaned.push(
            line
        );

    }


    return cleaned
        .join("\n")
        .trim();

}


/* ==========================================
   التقاط صورة الكاميرا
========================================== */

function captureCameraImage(){

    if(
        !video.videoWidth ||
        !video.videoHeight
    ){

        throw new Error(
            "الكاميرا غير جاهزة"
        );

    }


    let width =
        video.videoWidth;

    let height =
        video.videoHeight;


    const maxWidth =
        2200;


    if(
        width > maxWidth
    ){

        const ratio =
            maxWidth /
            width;


        width =
            Math.round(
                width * ratio
            );


        height =
            Math.round(
                height * ratio
            );

    }


    canvas.width =
        width;

    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d"
        );


    /*
     * لا نستخدم filter قوي هنا.
     */

    ctx.drawImage(
        video,
        0,
        0,
        width,
        height
    );


    return canvas.toDataURL(
        "image/jpeg",
        0.96
    );

}


/* ==========================================
   قراءة الصورة
========================================== */

async function readImage(source){

    if(busy){
        return;
    }


    busy =
        true;


    captureButton.disabled =
        true;


    loading.style.display =
        "flex";


    try{

        result.textContent =
            "جاري قراءة الصفحة...";


        setStatus(
            "جاري تجهيز الصورة..."
        );


        /*
         * تجهيز الصورة بدون
         * تحويلها لأبيض وأسود.
         */

        const image =
            await makeOCRImage(
                source
            );


        /*
         * تشغيل OCR.
         */

        const ocr =
            await startOCR();


        setStatus(
            "جاري التعرف على النص العربي..."
        );


        /*
         * rotateAuto مهم لو الصورة
         * مائلة أو اتجاهها مختلف.
         */

        const data =
            await ocr.recognize(
                image,
                {
                    rotateAuto:true
                }
            );


        let text =
            data &&
            data.data &&
            data.data.text
            ?
            data.data.text
            :
            "";


        text =
            cleanText(
                text
            );


        if(!text){

            result.textContent =
                "لم يتم العثور على نص واضح.";


            setStatus(
                "لم يتم العثور على نص"
            );


            speak(
                "لم أتمكن من قراءة النص. اجعل الصفحة واضحة ومضيئة ثم حاول مرة أخرى."
            );


            return;

        }


        result.textContent =
            text;


        lastText =
            text;


        setStatus(
            "تمت قراءة الصفحة بنجاح"
        );


        speak(
            text
        );

    }

    catch(error){

        console.error(
            "READ ERROR:",
            error
        );


        result.textContent =
            "حدث خطأ أثناء قراءة الصفحة.";


        setStatus(
            "حدث خطأ في قارئ العربية"
        );


        speak(
            "حدث خطأ أثناء قراءة الصفحة."
        );

    }

    finally{

        busy =
            false;


        captureButton.disabled =
            false;


        loading.style.display =
            "none";

    }

}


/* ==========================================
   بدء التطبيق
========================================== */

startButton.addEventListener(
    "click",
    async function(){

        welcome.style.display =
            "none";


        await startCamera();


        setTimeout(
            function(){

                speak(
                    "التطبيق جاهز. ضع الصفحة داخل الإطار واضغط تصوير."
                );

            },
            600
        );

    }
);


/* ==========================================
   تصوير الصفحة
========================================== */

captureButton.addEventListener(
    "click",
    async function(){

        try{

            const image =
                captureCameraImage();


            await readImage(
                image
            );

        }

        catch(error){

            console.error(
                error
            );


            setStatus(
                "الكاميرا غير جاهزة"
            );


            speak(
                "الكاميرا غير جاهزة."
            );

        }

    }
);


/* ==========================================
   اختيار صورة من الهاتف
========================================== */

fileInput.addEventListener(
    "change",
    function(event){

        const selectedFile =
            event.target.files[0];


        if(!selectedFile){
            return;
        }


        if(
            !selectedFile.type.startsWith(
                "image/"
            )
        ){

            speak(
                "الملف المختار ليس صورة."
            );


            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            async function(){

                await readImage(
                    reader.result
                );

            };


        reader.readAsDataURL(
            selectedFile
        );


        fileInput.value =
            "";

    }
);


/* ==========================================
   إعادة القراءة
========================================== */

repeatButton.addEventListener(
    "click",
    function(){

        if(lastText){

            speak(
                lastText
            );

        }

        else{

            speak(
                "لا يوجد نص لقراءته."
            );

        }

    }
);


/* ==========================================
   إيقاف الصوت
========================================== */

stopButton.addEventListener(
    "click",
    function(){

        if(
            "speechSynthesis"
            in window
        ){

            speechSynthesis.cancel();

        }

    }
);


/* ==========================================
   تحميل أصوات الهاتف
========================================== */

if(
    "speechSynthesis"
    in window
){

    speechSynthesis.onvoiceschanged =
        function(){

            speechSynthesis.getVoices();

        };

}

</script>

</body>

   </html>
