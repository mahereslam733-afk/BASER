<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قارئ الأبحاث والمستندات الذكي</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between p-4">

    <div id="welcomeOverlay" class="fixed inset-0 bg-slate-950/98 z-50 flex flex-col items-center justify-center p-6 text-center">
        <div class="bg-indigo-900 border-4 border-indigo-500 p-8 rounded-3xl max-w-sm shadow-2xl">
            <h2 class="text-3xl font-bold mb-4">قارئ الأبحاث 👁️</h2>
            <p class="text-indigo-200 text-base mb-8">جاهز لتشغيل الكاميرا وقراءة الأوراق الاقتصادية بدقة تامة وبصوت واضح.</p>
            <button id="startAppBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold py-5 px-6 rounded-2xl shadow-lg text-xl active:scale-95 transition">
                🚀 اضغط للبدء
            </button>
        </div>
    </div>

    <header class="bg-indigo-800 shadow-lg p-4 text-center rounded-2xl mb-4">
        <h1 class="text-2xl font-extrabold">تطبيق قارئ المستندات</h1>
        <p class="text-indigo-200 text-xs mt-1">الوضع البصري الدقيق للمكفوفين</p>
    </header>

    <main class="container mx-auto flex-1 flex flex-col items-center justify-center max-w-md w-full">
        
        <div class="relative w-full aspect-[3/4] bg-slate-800 rounded-3xl overflow-hidden shadow-2xl border-4 border-indigo-500 mb-4 flex items-center justify-center">
            <video id="cameraStream" autoplay playsinline muted class="w-full h-full object-cover"></video>
            <canvas id="snapshotCanvas" class="hidden"></canvas>
            <div id="cameraPlaceholder" class="absolute text-center p-4 text-slate-300 text-lg font-semibold">
                جاري تشغيل الكاميرا...
            </div>
        </div>

        <div class="w-full space-y-3">
            <button id="captureBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 transition text-white text-xl font-extrabold py-4 px-6 rounded-2xl shadow-xl flex items-center justify-center gap-3">
                <span>📸 التقاط وقراءة المستند</span>
            </button>

            <label class="w-full bg-blue-600 hover:bg-blue-500 active:scale-95 transition text-white text-md font-bold py-3 px-6 rounded-2xl shadow-lg flex items-center justify-center gap-3 cursor-pointer">
                <span>📁 اختر صفحة من المعرض</span>
                <input type="file" id="galleryInput" accept="image/*" class="hidden">
            </label>

            <button id="repeatBtn" class="w-full bg-amber-600 hover:bg-amber-500 active:scale-95 transition text-white text-md font-semibold py-3 px-6 rounded-2xl shadow-md flex items-center justify-center gap-2">
                <span>🔊 إعادة قراءة النص</span>
            </button>
        </div>

        <div class="w-full mt-4 bg-slate-800 border border-slate-700 p-4 rounded-2xl shadow-inner">
            <h2 class="text-xs font-semibold text-indigo-300 mb-1">النص الصحيح المنطوق:</h2>
            <p id="resultText" class="text-slate-100 min-h-[50px] text-sm leading-relaxed">وجه الكاميرا نحو النص واضغط التقاط...</p>
        </div>

    </main>

    <script>
        const video = document.getElementById('cameraStream');
        const canvas = document.getElementById('snapshotCanvas');
        const placeholder = document.getElementById('cameraPlaceholder');
        const captureBtn = document.getElementById('captureBtn');
        const galleryInput = document.getElementById('galleryInput');
        const repeatBtn = document.getElementById('repeatBtn');
        const resultText = document.getElementById('resultText');
        const welcomeOverlay = document.getElementById('welcomeOverlay');
        const startAppBtn = document.getElementById('startAppBtn');

        let lastSpokenText = "التطبيق جاهز.";

        function speakArabic(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA';
                utterance.rate = 0.8; // سرعة هادئة ومفهومة
                utterance.pitch = 1.0;

                const voices = window.speechSynthesis.getVoices();
                const arabicVoice = voices.find(v => v.lang.startsWith('ar') || v.name.includes('Arabic'));
                if (arabicVoice) utterance.voice = arabicVoice;

                window.speechSynthesis.speak(utterance);
                lastSpokenText = text;
            }
        }

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { ideal: 'environment' } }, 
                    audio: false 
                });
                video.srcObject = stream;
                placeholder.style.display = 'none';
            } catch (err) {
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = fallbackStream;
                    placeholder.style.display = 'none';
                } catch (e) {
                    placeholder.innerHTML = "⚠️ تعذر تشغيل الكاميرا، استعمل زر المعرض.";
                    speakArabic("تعذر تشغيل الكاميرا، يرجى استخدام زر المعرض.");
                }
            }
        }

        startAppBtn.addEventListener('click', () => {
            welcomeOverlay.style.display = 'none';
            initCamera();
            setTimeout(() => {
                speakArabic("التطبيق جاهز. التقط صورة الصفحة.");
            }, 600);
        });

        // دالة إرسال الصورة للمحرك السحابي الاحترافي المخصص للغة العربية الفصحى
        async function processImageCloud(base64Data) {
            speakArabic("جاري قراءة الصفحة بدقة عالية، انتظر قليلاً...");
            resultText.innerText = "جاري قراءة وتحليل الصفحة...";

            try {
                const formData = new FormData();
                formData.append('base64Image', base64Data);
                formData.append('language', 'ara');
                formData.append('isOverlayRequired', 'false');
                formData.append('OCREngine', '2'); // محرك ذكي عالي الدقة للكتب والأبحاث
                formData.append('apikey', 'K81877478888957'); // مفتاح تشغيل سحابي مجاني مستقر

                const response = await fetch('https://api.ocr.space/parse/image', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data && data.ParsedResults && data.ParsedResults.length > 0) {
                    let text = data.ParsedResults[0].ParsedText.trim();
                    
                    // تنظيف النص وترتيبه بطريقة تفيد القارئ
                    text = text.replace(/\r/g, '').replace(/\n+/g, '. ');
                    text = text.replace(/[|•_~`{}\[\]\\@#$%^&*+=<>""„«»]/g, ' ');

                    if (text.length > 5) {
                        resultText.innerText = text;
                        speakArabic("النص هو: " + text);
                    } else {
                        resultText.innerText = "لم يتم العثور على كلمات واضحة، تأكد من الإضاءة.";
                        speakArabic("لم أتمكن من العثور على كلمات واضحة، حاول تحسين الإضاءة وتصوير الصفحة بوضوح.");
                    }
                } else {
                    resultText.innerText = "تعذر قراءة المستند، جرب اختيار الصورة من المعرض.";
                    speakArabic("تعذر قراءة المستند، يرجى اختيار الصورة بوضوح من المعرض.");
                }
            } catch (err) {
                console.error(err);
                resultText.innerText = "حدث خطأ في الاتصال بالشبكة.";
                speakArabic("حدث خطأ في الاتصال بالإنترنت.");
            }
        }

        captureBtn.addEventListener('click', () => {
            if (!video.srcObject) {
                speakArabic("الكاميرا غير مفعلة.");
                return;
            }
            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            processImageCloud(canvas.toDataURL('image/jpeg', 0.95));
        });

        galleryInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    processImageCloud(e.target.result);
                };
                reader.readAsDataURL(file);
            }
        });

        repeatBtn.addEventListener('click', () => {
            speakArabic(lastSpokenText);
        });
    </script>
</body>
</html>
