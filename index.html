<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق قارئ المستندات الذكي</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between">

    <!-- شاشة الترحيب -->
    <div id="welcomeOverlay" class="fixed inset-0 bg-slate-950/95 z-50 flex flex-col items-center justify-center p-6 text-center">
        <div class="bg-indigo-900 border-2 border-indigo-500 p-6 rounded-3xl max-w-sm shadow-2xl">
            <h2 class="text-2xl font-bold mb-3">تطبيق قارئ المستندات 👁️</h2>
            <p class="text-indigo-200 text-sm mb-6">جاهز لقراءة أي ورقة أو مستند عربي بدقة فائقة.</p>
            <button id="startAppBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 px-6 rounded-2xl shadow-lg text-lg">
                🚀 ابدأ التطبيق الآن
            </button>
        </div>
    </div>

    <!-- الهيدر -->
    <header class="bg-indigo-800 shadow-lg p-4 text-center">
        <h1 class="text-3xl font-extrabold tracking-wide">قارئ المستندات الذكي 👁️</h1>
        <p class="text-indigo-200 text-sm mt-1">الوضع السحابي الفائق النقاء للغة العربية</p>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="container mx-auto p-4 flex-1 flex flex-col items-center justify-center max-w-md">
        
        <!-- معاينة الصورة أو الكاميرا -->
        <div class="relative w-full aspect-[3/4] bg-slate-800 rounded-3xl overflow-hidden shadow-2xl border-4 border-indigo-500 mb-4 flex items-center justify-center">
            <video id="cameraStream" autoplay playsinline muted class="w-full h-full object-cover"></video>
            <canvas id="snapshotCanvas" class="hidden"></canvas>
            
            <div id="cameraPlaceholder" class="absolute text-center p-4 text-slate-400">
                <span>جاري تفعيل الكاميرا...</span>
            </div>
        </div>

        <!-- أزرار التحكم -->
        <div class="w-full space-y-3">
            <button id="captureBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 transition text-white text-lg font-bold py-3 px-6 rounded-2xl shadow-lg flex items-center justify-center gap-3">
                <span>📸 التقاط وقراءة المستند</span>
            </button>

            <!-- زر المعرض (الأدق دائماً) -->
            <label class="w-full bg-blue-600 hover:bg-blue-500 active:scale-95 transition text-white text-lg font-bold py-3 px-6 rounded-2xl shadow-lg flex items-center justify-center gap-3 cursor-pointer">
                <span>📁 اختر صورة الورقة من المعرض</span>
                <input type="file" id="galleryInput" accept="image/*" class="hidden">
            </label>

            <button id="repeatBtn" class="w-full bg-amber-600 hover:bg-amber-500 active:scale-95 transition text-white text-md font-semibold py-3 px-6 rounded-2xl shadow-md flex items-center justify-center gap-2">
                <span>🔊 إعادة قراءة النتيجة</span>
            </button>
        </div>

        <!-- صندوق النتيجة -->
        <div class="w-full mt-4 bg-slate-800 border border-slate-700 p-4 rounded-2xl shadow-inner">
            <h2 class="text-sm font-semibold text-indigo-300 mb-1">البيانات المستخرجة بوضوح:</h2>
            <p id="resultText" class="text-slate-100 min-h-[60px] text-base leading-relaxed">صور الورقة أو اخترها من المعرض وسترى النتيجة هنا...</p>
        </div>

    </main>

    <!-- الفوتر -->
    <footer class="bg-slate-950 text-center py-3 text-slate-500 text-xs">
        قارئ المستندات الذكي - مدعوم بمحرك سحابي عربي عالي الدقة
    </footer>

    <!-- سكريبت الربط السحابي -->
    <script>
        const video = document.getElementById('cameraStream');
        const canvas = document.getElementById('snapshotCanvas');
        const placeholder = document.getElementById('cameraPlaceholder');
        const captureBtn = document.getElementById('captureBtn');
        const galleryInput = document.getElementById('galleryInput');
        const repeatBtn = document.getElementById('repeatBtn');
        const resultText = document.getElementById('resultText');
        const welcomeOverlay = document.getElementById('welcomeOverlay');
        const startAppBtn = document.getElementById('startAppBtn');

        let lastSpokenText = "التطبيق جاهز للاستخدام.";

        function speakArabic(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA';
                utterance.rate = 0.85;
                utterance.pitch = 1.0;

                const voices = window.speechSynthesis.getVoices();
                const arabicVoice = voices.find(v => v.lang.startsWith('ar') || v.includes && v.includes('ar'));
                if (arabicVoice) utterance.voice = arabicVoice;

                window.speechSynthesis.speak(utterance);
                lastSpokenText = text;
            }
        }

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { ideal: 'environment' } }, 
                    audio: false 
                });
                video.srcObject = stream;
                placeholder.style.display = 'none';
            } catch (err) {
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = fallbackStream;
                    placeholder.style.display = 'none';
                } catch (e) {
                    placeholder.innerHTML = "⚠️ تعذر تشغيل الكاميرا، استعمل زر المعرض.";
                }
            }
        }

        startAppBtn.addEventListener('click', () => {
            welcomeOverlay.style.display = 'none';
            initCamera();
            setTimeout(() => {
                speakArabic("أهلاً بك. التطبيق جاهز لقراءة أي مستند.");
            }, 500);
        });

        async function processImageCloud(base64Image) {
            speakArabic("جاري إرسال المستند وقراءته بدقة، يرجى الانتظار...");
            resultText.innerText = "جاري قراءة وتحليل المستند سحابياً...";

            try {
                const formData = new FormData();
                formData.append('base64Image', base64Image);
                formData.append('language', 'ara');
                formData.append('isOverlayRequired', 'false');
                // مفتاح عام مجاني مخصص لتطبيقات الاختبار والخدمات العامة
                formData.append('apikey', 'K81877478888957'); 

                const response = await fetch('https://api.ocr.space/parse/image', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data && data.ParsedResults && data.ParsedResults.length > 0) {
                    let extractedText = data.ParsedResults[0].ParsedText.trim();
                    
                    // تنظيف النص من أي فوارغ أو أسطر زائدة
                    extractedText = extractedText.replace(/\r/g, '').replace(/\n+/g, ' . ');

                    if (extractedText.length > 3) {
                        resultText.innerText = extractedText;
                        speakArabic("البيانات المستخرجة هي: " + extractedText);
                    } else {
                        resultText.innerText = "لم يتم العثور على نص واضح في الصورة.";
                        speakArabic("لم أتمكن من قراءة كلمات واضحة من هذه الصورة.");
                    }
                } else {
                    resultText.innerText = "حدث خطأ أثناء قراءة المستند.";
                    speakArabic("فشلت عملية قراءة المستند.");
                }
            } catch (error) {
                console.error(error);
                resultText.innerText = "خطأ في الاتصال بالشبكة أو الخادم.";
                speakArabic("حدث خطأ في الاتصال بالإنترنت.");
            }
        }

        // التقاط مباشر بالكاميرا
        captureBtn.addEventListener('click', () => {
            if (!video.srcObject) {
                speakArabic("الكاميرا غير مفعلة.");
                return;
            }
            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            processImageCloud(canvas.toDataURL('image/jpeg', 0.9));
        });

        // اختيار صورة من المعرض
        galleryInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    processImageCloud(e.target.result);
                };
                reader.readAsDataURL(file);
            }
        });

        repeatBtn.addEventListener('click', () => speakArabic(lastSpokenText));
    </script>
</body>
</html>
