<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق بصير الذكي - Baser AI</title>

    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            text-align: center;
        }

        h2 {
            font-size: 18px;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .mic-container {
            margin-bottom: 20px;
        }

        .mic-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #0f172a;
            border: 3px solid #00f2fe;
            color: #00f2fe;
            font-size: 32px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        #mediaContainer {
            max-width: 500px;
            margin: 0 auto 15px auto;
            display: none;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            border: 2px solid #00f2fe;
        }

        video {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            display: block;
        }

        .close-cam {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            z-index: 10;
        }

        .action-btn {
            margin: 5px auto;
            padding: 12px 20px;
            background-color: #00f2fe;
            color: #0b0f19;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            display: none;
        }

        .action-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 500px;
            margin: 0 auto;
        }

        .feature-btn {
            padding: 12px 5px;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 85px;
            transition: 0.2s;
        }

        .feature-btn:active {
            transform: scale(0.95);
        }

        .btn-teal { background-color: #115e59; }
        .btn-purple { background-color: #581c87; }
        .btn-orange { background-color: #7c2d12; }
        .btn-blue { background-color: #1e3a8a; }
        .btn-darkblue { background-color: #1e293b; }

        .btn-darkred {
            background-color: #7f1d1d;
            background-image: linear-gradient(to right, #7f1d1d, #4c1d95);
        }

        .feature-btn span:first-child {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .bottom-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            max-width: 500px;
            margin: 10px auto 0 auto;
        }

        #statusBox {
            margin-top: 15px;
            padding: 15px;
            background: #1e293b;
            border-radius: 8px;
            font-size: 15px;
            color: #38bdf8;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            text-align: right;
            border-right: 4px solid #00f2fe;
            line-height: 1.7;
            word-break: break-word;
        }
    </style>
</head>

<body>

    <h2>كيف يمكنني مساعدتك اليوم؟</h2>

    <div class="mic-container">
        <button
            class="mic-btn"
            type="button"
            aria-label="تشغيل الترحيب الصوتي"
            onclick="speakText('مرحباً بك في تطبيق بصير الذكي')">
            🎤
        </button>
    </div>

    <div id="mediaContainer">
        <button
            class="close-cam"
            type="button"
            onclick="stopCamera()">
            إغلاق الكاميرا ✕
        </button>

        <video id="cameraStream" autoplay playsinline muted></video>
    </div>

    <button
        id="aiAnalyzeBtn"
        class="action-btn"
        type="button"
        onclick="analyzeWithAI()">
        تحليل المشهد بالذكاء الاصطناعي 🧠
    </button>

    <canvas id="canvas" style="display:none;"></canvas>

    <div class="grid-container">

        <button
            class="feature-btn btn-teal"
            type="button"
            onclick="triggerAction('الاتصال بمطوع', 'tel:01000000000', 'جاري الاتصال بالمطوع')">
            <span>📞</span>
            <span>اتصل بمطوع</span>
        </button>

        <button
            class="feature-btn btn-teal"
            type="button"
            onclick="startCameraForAI(
                'استخرج كل النصوص الظاهرة في الصورة. حافظ على ترتيب الأسطر واقرأ الأرقام والرموز كما تظهر. إذا كان النص غير واضح فاذكر ذلك صراحة. لا تلخص النص.'
            )">
            <span>📄</span>
            <span>قراءة النصوص</span>
        </button>

        <button
            class="feature-btn btn-purple"
            type="button"
            onclick="startCameraForAI(
                'صف لي الأشياء الموجودة أمام الكاميرا لشخص مكفوف. اذكر الشيء الأهم أولاً، ومكانه التقريبي، ولونه أو شكله إن كان واضحاً. لا تذكر أي شيء غير مؤكد.'
            )">
            <span>📷</span>
            <span>التعرف على الأشياء</span>
        </button>

        <button
            class="feature-btn btn-purple"
            type="button"
            onclick="notifyUnderDevelopment('المساعد الصوتي')">
            <span>🎧</span>
            <span>المساعد الصوتي</span>
        </button>

        <button
            class="feature-btn btn-orange"
            type="button"
            onclick="startCameraForAI(
                'اقرأ محتوى الكتاب أو المستند الظاهر في الصورة. ابدأ بعنوان المستند إن وجد، ثم اقرأ النص بترتيب واضح. لا تخترع كلمات غير ظاهرة.'
            )">
            <span>📖</span>
            <span>الكتب والمستندات</span>
        </button>

        <button
            class="feature-btn btn-blue"
            type="button"
            onclick="getGPSLocation()">
            <span>🧭</span>
            <span>الملاحة والتنقل</span>
        </button>

        <button
            class="feature-btn btn-blue"
            type="button"
            onclick="notifyUnderDevelopment('قراءة الباركود')">
            <span>📊</span>
            <span>قراءة الباركود</span>
        </button>

        <button
            class="feature-btn btn-orange"
            type="button"
            onclick="notifyUnderDevelopment('التعلم والتعليم')">
            <span>🎓</span>
            <span>التعلم والتعليم</span>
        </button>

        <button
            class="feature-btn btn-teal"
            type="button"
            onclick="notifyUnderDevelopment('البحث الصوتي')">
            <span>🔍</span>
            <span>البحث الصوتي</span>
        </button>

        <button
            class="feature-btn btn-teal"
            type="button"
            onclick="notifyUnderDevelopment('التعرف على الوجوه')">
            <span>👤</span>
            <span>التعرف على الوجوه</span>
        </button>

        <button
            class="feature-btn btn-purple"
            type="button"
            onclick="notifyUnderDevelopment('التعرف على الألوان')">
            <span>🎨</span>
            <span>التعرف على الألوان</span>
        </button>

        <button
            class="feature-btn btn-blue"
            type="button"
            onclick="startCameraForAI(
                'حلل الورقة النقدية الظاهرة فقط. حدد الدولة، اسم العملة، والقيمة إن أمكن. إذا لم تكن متأكداً فقل غير متأكد ولا تخمن. اذكر أن التعرف البصري قد يخطئ.'
            )">
            <span>🪙</span>
            <span>التعرف على العملات</span>
        </button>

        <button
            class="feature-btn btn-darkblue"
            type="button"
            onclick="notifyUnderDevelopment('سجل المعلومات')">
            <span>🕒</span>
            <span>سجل المعلومات</span>
        </button>

        <button
            class="feature-btn btn-blue"
            type="button"
            onclick="getGPSLocation()">
            <span>📍</span>
            <span>مشاركة موقعي</span>
        </button>

        <button
            class="feature-btn btn-darkblue"
            type="button"
            onclick="getGPSLocation()">
            <span>🏢</span>
            <span>الملاحة الداخلية</span>
        </button>
    </div>

    <div class="bottom-grid">
        <button
            class="feature-btn btn-darkblue"
            type="button"
            onclick="notifyUnderDevelopment('دعم بدون إنترنت')">
            <span>⚡</span>
            <span>دعم بدون إنترنت</span>
        </button>

        <button
            class="feature-btn btn-darkred"
            type="button"
            onclick="triggerAction('حالة الطوارئ', 'tel:123', 'جاري الاتصال بالطوارئ')">
            <span>🚨</span>
            <span>طوارئ</span>
        </button>
    </div>

    <div id="statusBox">
        أهلاً بك في تطبيق بصير. الكاميرا جاهزة للتحليل.
    </div>

    <script>
        let currentStream = null;
        let currentPrompt =
            "صف لي ما يوجد في هذا المشهد بشكل دقيق ومفيد لشخص مكفوف.";
        let isAnalyzing = false;

        /*
          للاختبار فقط.
          لا تنشر المفتاح داخل HTML.
          ألغِ المفتاح القديم الذي ظهر في رسالتك.
        */
        const GEMINI_API_KEY = "ضع_مفتاحك_الجديد_هنا";
        const GEMINI_MODEL = "gemini-2.5-flash";

            return document.getElementById(id);
        }

        function setStatus(message, shouldSpeak = false) {
            getElement("statusBox").innerText = message;

            if (shouldSpeak) {
                speakText(message);
            }
        }

        function speakText(
