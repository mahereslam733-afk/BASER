<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>قارئ المستندات العربي</title>

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap');

body{
    font-family:'Cairo',sans-serif;
}

button,label{
    -webkit-tap-highlight-color:transparent;
}

</style>

</head>


<body class="bg-slate-900 text-white min-h-screen p-4">


<!-- =====================================================
     شاشة البداية
===================================================== -->

<div id="welcomeOverlay"
class="fixed inset-0 bg-slate-950/98 z-50
flex items-center justify-center p-6 text-center">

<div class="bg-indigo-900 border-4 border-indigo-500
p-8 rounded-3xl max-w-sm shadow-2xl">

<h2 class="text-3xl font-bold mb-4">
قارئ المستندات 👁️
</h2>

<p class="text-indigo-200 mb-8">
قارئ سريع للنصوص العربية
</p>

<button id="startAppBtn"
class="w-full bg-emerald-600
hover:bg-emerald-500
font-extrabold py-5 px-6
rounded-2xl text-xl">

🚀 اضغط للبدء

</button>

</div>
</div>


<!-- =====================================================
     العنوان
===================================================== -->

<header class="bg-indigo-800 p-4
text-center rounded-2xl mb-4">

<h1 class="text-2xl font-extrabold">
قارئ المستندات
</h1>

<p class="text-indigo-200 text-xs mt-1">
قراءة النصوص العربية من الكاميرا
</p>

</header>


<main class="max-w-md mx-auto w-full">


<!-- =====================================================
     الكاميرا
===================================================== -->

<div class="relative w-full aspect-[3/4]
bg-black rounded-3xl overflow-hidden
border-4 border-indigo-500 mb-4">

<video id="cameraStream"
autoplay
playsinline
muted
class="w-full h-full object-cover">
</video>

<canvas id="snapshotCanvas"
class="hidden">
</canvas>

<div id="cameraPlaceholder"
class="absolute inset-0 flex
items-center justify-center
text-slate-300 text-lg text-center p-5">

جاري تشغيل الكاميرا...

</div>

</div>


<!-- =====================================================
     زر الالتقاط
===================================================== -->

<button id="captureBtn"
class="w-full bg-emerald-600
hover:bg-emerald-500
font-extrabold text-xl
py-4 rounded-2xl mb-3">

📸 التقاط وقراءة الصفحة

</button>


<!-- =====================================================
     المعرض
===================================================== -->

<label
class="w-full bg-blue-600
hover:bg-blue-500
font-bold py-3 rounded-2xl
flex items-center justify-center
cursor-pointer mb-3">

📁 اختيار صورة من المعرض

<input
id="galleryInput"
type="file"
accept="image/*"
class="hidden">

</label>


<!-- =====================================================
     إعادة القراءة
===================================================== -->

<button id="repeatBtn"
class="w-full bg-amber-600
hover:bg-amber-500
font-bold py-3 rounded-2xl">

🔊 إعادة قراءة النص

</button>


<!-- =====================================================
     الحالة
===================================================== -->

<div id="statusBox"
class="mt-4 bg-indigo-950
border border-indigo-800
rounded-2xl p-3 text-center text-sm">

جاهز لقراءة الصفحة

</div>


<!-- =====================================================
     النص
===================================================== -->

<div class="mt-3 bg-slate-800
border border-slate-700
p-4 rounded-2xl">

<h2 class="text-indigo-300 text-sm mb-2">
النص المستخرج:
</h2>

<div id="resultText"
class="text-white text-sm
leading-8 min-h-[120px]">

وجه الكاميرا نحو الصفحة
ثم اضغط التقاط.

</div>

</div>

</main>


<script>


/* =====================================================
   العناصر
===================================================== */

const video =
document.getElementById("cameraStream");

const canvas =
document.getElementById("snapshotCanvas");

const placeholder =
document.getElementById("cameraPlaceholder");

const captureBtn =
document.getElementById("captureBtn");

const galleryInput =
document.getElementById("galleryInput");

const repeatBtn =
document.getElementById("repeatBtn");

const resultText =
document.getElementById("resultText");

const statusBox =
document.getElementById("statusBox");

const welcomeOverlay =
document.getElementById("welcomeOverlay");

const startAppBtn =
document.getElementById("startAppBtn");


let worker = null;

let lastSpokenText = "";


/* =====================================================
   الحالة
===================================================== */

function setStatus(text){

    statusBox.innerText = text;

}


/* =====================================================
   النطق العربي
===================================================== */

function speakArabic(text){

    if(!text){
        return;
    }


    if(!("speechSynthesis" in window)){
        return;
    }


    speechSynthesis.cancel();


    const utterance =
    new SpeechSynthesisUtterance(text);


    utterance.lang =
    "ar-EG";


    utterance.rate =
    0.78;


    utterance.pitch =
    1;


    utterance.volume =
    1;


    const voices =
    speechSynthesis.getVoices();


    const arabicVoice =
    voices.find(
        voice =>
        voice.lang === "ar-EG"
    )
    ||
    voices.find(
        voice =>
        voice.lang.startsWith("ar")
    );


    if(arabicVoice){

        utterance.voice =
        arabicVoice;

    }


    speechSynthesis.speak(
        utterance
    );


    lastSpokenText =
    text;

}


/* =====================================================
   تشغيل الكاميرا
===================================================== */

async function startCamera(){

    try{

        const stream =
        await navigator.mediaDevices.getUserMedia({

            video:{

                facingMode:{
                    ideal:"environment"
                },

                width:{
                    ideal:1920
                },

                height:{
                    ideal:1080
                }

            },

            audio:false

        });


        video.srcObject =
        stream;


        placeholder.style.display =
        "none";


        setStatus(
            "الكاميرا جاهزة. ضع الصفحة كاملة أمام الكاميرا."
        );

    }

    catch(error){

        console.log(
            "Camera error:",
            error
        );


        try{

            const stream =
            await navigator.mediaDevices.getUserMedia({

                video:true,

                audio:false

            });


            video.srcObject =
            stream;


            placeholder.style.display =
            "none";

        }

        catch(e){

            placeholder.innerText =
            "تعذر تشغيل الكاميرا.\nاستخدم المعرض.";

            setStatus(
                "الكاميرا غير متاحة."
            );

        }

    }

}


/* =====================================================
   بدء التطبيق
===================================================== */

startAppBtn.addEventListener(
"click",
async function(){

    welcomeOverlay.style.display =
    "none";


    await startCamera();


    setTimeout(
        function(){

            speakArabic(
                "التطبيق جاهز. وجه الكاميرا نحو الصفحة واضغط التقاط."
            );

        },
        500
    );

});


/* =====================================================
   تحميل الصورة
===================================================== */

function loadImage(source){

    return new Promise(
        function(resolve,reject){

            const img =
            new Image();


            img.onload =
            function(){

                resolve(img);

            };


            img.onerror =
            function(){

                reject(
                    new Error(
                        "تعذر تحميل الصورة"
                    )
                );

            };


            img.src =
            source;

        }
    );

}


/* =====================================================
   تحسين خفيف للصورة
===================================================== */

async function prepareImage(source){

    const img =
    await loadImage(source);


    /*
       لا نستخدم أبيض وأسود قوي.
       نحافظ على شكل الحروف.
    */

    const maxWidth =
    1800;


    let width =
    img.naturalWidth;


    let height =
    img.naturalHeight;


    /*
       تقليل الحجم إذا كان ضخمًا جدًا
       لتسريع OCR
    */

    if(width > maxWidth){

        const ratio =
        maxWidth / width;

        width =
        Math.floor(width * ratio);

        height =
        Math.floor(height * ratio);

    }


    const c =
    document.createElement(
        "canvas"
    );


    c.width =
    width;

    c.height =
    height;


    const ctx =
    c.getContext(
        "2d",
        {
            willReadFrequently:true
        }
    );


    /*
       تحسين بسيط جدًا
    */

    ctx.filter =
    "contrast(1.12) brightness(1.03)";


    ctx.drawImage(
        img,
        0,
        0,
        width,
        height
    );


    return c;

}


/* =====================================================
   محرك OCR
===================================================== */

async function getWorker(){

    if(worker){

        return worker;

    }


    setStatus(
        "جاري تحميل محرك اللغة العربية..."
    );


    worker =
    await Tesseract.createWorker(
        "ara"
    );


    /*
       إعداد مناسب للصفحات
       التي تحتوي على نص عربي
    */

    await worker.setParameters({

        tessedit_pageseg_mode:
        "3",

        preserve_interword_spaces:
        "1",

        user_defined_dpi:
        "300"

    });


    return worker;

}


/* =====================================================
   تنظيف النص
===================================================== */

function cleanArabicText(text){

    if(!text){

        return "";

    }


    /*
       حذف الرموز الغريبة فقط
    */

    text =
    text.replace(
        /[|_~`{}[\]\\^<>]+/g,
        " "
    );


    /*
       حذف النقاط المتكررة الغريبة
    */

    text =
    text.replace(
        /[•·]{2,}/g,
        " "
    );


    /*
       توحيد المسافات
    */

    text =
    text.replace(
        /[ \t]+/g,
        " "
    );


    /*
       الحفاظ على فواصل الأسطر
    */

    text =
    text
    .split("\n")
    .map(
        line =>
        line.trim()
    )
    .filter(
        line =>
        line.length > 0
    )
    .join("\n");


    return text.trim();

}


/* =====================================================
   إزالة الأسطر التالفة جدًا
===================================================== */

function removeBadLines(text){

    const lines =
    text.split("\n");


    const goodLines = [];


    for(
        const line of lines
    ){

        const arabic =
        (
            line.match(
                /[\u0600-\u06FF]/g
            ) || []
        ).length;


        const numbers =
        (
            line.match(
                /[0-9]/g
            ) || []
        ).length;


        const total =
        line.replace(
            /\s/g,
            ""
        ).length;


        /*
           لا نحذف السطر بسهولة.
           نحذف فقط الأسطر التي
           تبدو ضوضاء واضحة جدًا.
        */

        if(
            total > 2 &&
            arabic >= 2
        ){

            goodLines.push(line);

        }
        else if(
            total > 4 &&
            numbers < total
        ){

            goodLines.push(line);

        }

    }


    return goodLines.join("\n");

}


/* =====================================================
   قراءة الصورة
===================================================== */

async function readImage(source){

    captureBtn.disabled =
    true;


    captureBtn.style.opacity =
    "0.5";


    try{

        resultText.innerText =
        "جاري قراءة الصفحة...";


        setStatus(
            "جاري تجهيز الصورة..."
        );


        /*
           تحسين خفيف فقط
        */

        const image =
        await prepareImage(
            source
        );


        setStatus(
            "جاري قراءة النص العربي..."
        );


        const ocr =
        await getWorker();


        /*
           عملية OCR واحدة فقط
        */

        const result =
        await ocr.recognize(
            image
        );


        let text =
        result.data.text || "";


        /*
           تنظيف
        */

        text =
        cleanArabicText(
            text
        );


        /*
           إزالة الأسطر
           التالفة جدًا
        */

        text =
        removeBadLines(
            text
        );


        if(!text){

            resultText.innerText =
            "لم يتم العثور على نص واضح.";


            setStatus(
                "لم أتمكن من قراءة النص."
            );


            speakArabic(
                "لم أتمكن من قراءة النص. حاول تقريب الكاميرا من الصفحة."
            );


            return;

        }


        /*
           عرض النص
        */

        resultText.innerText =
        text;


        setStatus(
            "تمت قراءة الصفحة."
        );


        /*
           النطق
        */

        speakArabic(
            text
        );

    }

    catch(error){

        console.log(
            "OCR ERROR:",
            error
        );


        resultText.innerText =
        "حدث خطأ أثناء القراءة.";


        setStatus(
            "حدث خطأ أثناء قراءة الصفحة."
        );


        speakArabic(
            "حدث خطأ أثناء قراءة الصفحة. حاول مرة أخرى."
        );

    }

    finally{

        captureBtn.disabled =
        false;


        captureBtn.style.opacity =
        "1";

    }

}


/* =====================================================
   التقاط صورة الكاميرا
===================================================== */

captureBtn.addEventListener(
"click",
async function(){

    if(!video.srcObject){

        speakArabic(
            "الكاميرا غير مفعلة."
        );

        return;

    }


    if(
        !video.videoWidth ||
        !video.videoHeight
    ){

        speakArabic(
            "انتظر حتى تصبح الكاميرا جاهزة."
        );

        return;

    }


    /*
       استخدام الدقة الحقيقية
    */

    canvas.width =
    video.videoWidth;


    canvas.height =
    video.videoHeight;


    const ctx =
    canvas.getContext(
        "2d"
    );


    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    const image =
    canvas.toDataURL(
        "image/jpeg",
        0.95
    );


    await readImage(
        image
    );

});


/* =====================================================
   صورة من المعرض
===================================================== */

galleryInput.addEventListener(
"change",
function(event){

    const file =
    event.target.files[0];


    if(!file){

        return;

    }


    if(
        !file.type.startsWith(
            "image/"
        )
    ){

        speakArabic(
            "الملف المختار ليس صورة."
        );

        return;

    }


    const reader =
    new FileReader();


    reader.onload =
    async function(e){

        await readImage(
            e.target.result
        );

    };


    reader.readAsDataURL(
        file
    );


    /*
       السماح باختيار نفس الصورة
       مرة أخرى
    */

    event.target.value =
    "";

});


/* =====================================================
   إعادة القراءة
===================================================== */

repeatBtn.addEventListener(
"click",
function(){

    if(!lastSpokenText){

        speakArabic(
            "لا يوجد نص لقراءته."
        );

        return;

    }


    speakArabic(
        lastSpokenText
    );

});


/* =====================================================
   تجهيز الأصوات
===================================================== */

if(
    "speechSynthesis" in window
){

    speechSynthesis.onvoiceschanged =
    function(){

        speechSynthesis.getVoices();

    };

}

</script>

</body>
</html>
