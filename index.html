*{

body{
background:#030712;
color:#fff;
padding:10px;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.phone-container{
width:100%;
max-width:420px;
background:#030712;
border-radius:35px;
padding:15px 12px;
border:1px solid #1e293b;
box-shadow:0 0 40px rgba(0,0,0,.9);
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:5px 5px 10px;
}

.header-icon-btn{
width:42px;
height:42px;
border-radius:50%;
border:1px solid #1e293b;
background:#0b1120;
color:#94a3b8;
font-size:18px;
cursor:pointer;
}

.welcome-title{
text-align:center;
}

.welcome-title h1{
font-size:1.35rem;
font-weight:700;
}

.welcome-title p{
font-size:.8rem;
color:#94a3b8;
}

.mic-section{
display:flex;
justify-content:center;
margin:8px 0 15px;
}

.mic-glow-btn{
width:82px;
height:82px;
border-radius:50%;
background:#0a1128;
border:3px solid #38bdf8;
color:#38bdf8;
font-size:28px;
cursor:pointer;
box-shadow:0 0 25px rgba(56,189,248,.3);
}

.screen{
display:none;
}

.screen.active{
display:flex;
flex-direction:column;
gap:10px;
}

.grid-container{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

.btn-card{
min-height:90px;
padding:10px 4px;
border-radius:16px;
border:1px solid rgba(255,255,255,.06);
color:#fff;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:6px;
cursor:pointer;
}

.btn-card:active,
.header-icon-btn:active,
.mic-glow-btn:active,
.action-special-btn:active,
.camera-btn:active,
.back-btn:active{
transform:scale(.96);
}

.btn-card i{
font-size:20px;
}

.btn-card span{
font-size:.74rem;
font-weight:600;
text-align:center;
line-height:1.2;
}

.c-dark-1{background:linear-gradient(145deg,#0b132b,#1e293b)}

.bottom-actions{

}

.action-special-btn{

font-size:.82rem;
font-weight:bold;
color:#fff;
cursor:pointer;
}

.btn-emergency{
background:linear-gradient(145deg,#581c87,#7f1d1d);
border:1px solid #ef4444;
}

.btn-offline{
background:linear-gradient(145deg,#090d16,#0f172a);
border:1px solid #1e3a8a;
}

.sub-screen-header{
display:flex;

padding-bottom:8px;
margin-bottom:5px;
}

.sub-screen-header h2{
font-size:1.05rem;
color:#38bdf8;
}
