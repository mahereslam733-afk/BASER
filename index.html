<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0,
maximum-scale=1.0, user-scalable=no">

<title>قارئ عربي بدون إنترنت</title>

<!-- Tesseract المحلي -->
<script src="./tesseract.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:15px;
    background:#0f172a;
    color:white;
    font-family:Arial,Tahoma,sans-serif;
}

.app{
    max-width:600px;
    margin:auto;
}

h1{
    text-align:center;
    background:#3730a3;
    padding:18px;
    border-radius:20px;
    margin-top:0;
}

.camera{
    position:relative;
    width:100%;
    height:60vh;
    min-height:350px;
    background:#000;
    border:4px solid #6366f1;
    border-radius:22px;
    overflow:hidden;
}

video{
    width:100%;
    height:100%;
    object-fit:cover;
}

.camera-message{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:18px;
    padding:20px;
}

button,
.file-button{
    width:100%;
    border:0;
    border-radius:18px;
    padding:17px;
    margin-top:12px;
    color:white;
    font-size:18px;
    font-weight:bold;
}

button{
    cursor:pointer;
}

.capture{
    background:#059669;
}

.gallery{
    background:#2563eb;
}

.repeat{
    background:#d97706;
}

.stop{
    background:#dc2626;
}

input{
    display:none;
}

.status{
    background:#172554;
    border-radius:15px;
    padding:13px;
    margin-top:15px;
    text-align:center;
}

.result{
    background:#1e293b;
    border-radius:18px;
    padding:15px;
    margin-top:15px;
}

.result-title{
    color:#a5b4fc;
    font-weight:bold;
    margin-bottom:10px;
}

#result{
    white-space:pre-wrap;
    line-height:2;
    font-size:18px;
    min-height:120px;
}

#welcome{
    position:fixed;
    inset:0;
    z-index:9999;
    background:#020617;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.welcome-box{
    width:100%;
    max-width:400px;
    background:#312e81;
    border:3px solid #6366f1;
    border-radius:25px;
    padding:30px 20px;
    text-align:center;
}

.start{
    background:#059669;
}

#loading{
    display:none;
    position:fixed;
    inset:0;
    z-index:10000;
    background:rgba(0,0,0,.85);
    align-items:center;
    justify-content:center;
}

.loading-box{
    width:90%;
    max-width:350px;
    background:#1e293b;
    border-radius:20px;
    padding:30px;
    text-align:center;
}

.spinner{
    width:45px;
    height:45px;
    border:5px solid #475569;
    border-top-color:#22c55e;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:0 auto 15px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

</style>

</head>


<body>


<!-- شاشة البداية -->

<div id="welcome">

    <div class="welcome-box">

        <h2>
            📖 قارئ المستندات العربي
        </h2>

        <p>
            قراءة النصوص العربية
        </p>

        <p style="color:#c7d2fe">
            يعمل بدون Gemini وبدون API
        </p>

        <button
            id="start"
            class="start">

            🚀 ابدأ التطبيق

        </button>

    </div>

</div>


<!-- شاشة التحميل -->

<div id="loading">

    <div class="loading-box">

        <div class="spinner"></div>

        <div id="loadingText">
            جاري تشغيل قارئ العربية...
        </div>

    </div>

</div>


<div class="app">

    <h1>
        📖 قارئ المستندات
    </h1>


    <!-- الكاميرا -->

    <div class="camera">

        <video
            id="video"
            autoplay
            playsinline
            muted>
        </video>

        <div
            id="cameraMessage"
            class="camera-message">

            الكاميرا غير مفعلة

        </div>

    </div>


    <canvas
        id="canvas"
        style="display:none">
    </canvas>


    <!-- تصوير -->

    <button
        id="capture"
        class="capture">

        📸 تصوير وقراءة الصفحة

    </button>


    <!-- المعرض -->

    <label
        class="file-button gallery">

        📁 اختيار صورة من الهاتف

        <input
            id="file"
            type="file"
            accept="image/*">

    </label>


    <!-- إعادة القراءة -->

    <button
        id="repeat"
        class="repeat">

        🔊 إعادة قراءة النص

    </button>


    <!-- إيقاف الصوت -->

    <button
        id="stop"
        class="stop">

        🔇 إيقاف القراءة

    </button>


    <!-- الحالة -->

    <div
        id="status"
        class="status">

        جاهز

    </div>


    <!-- النتيجة -->

    <div class="result">

        <div class="result-title">
            النص المستخرج:
        </div>

        <div id="result">

            وجّه الكاميرا نحو المستند
            واضغط تصوير.

        </div>

    </div>

</div>


<script>

/* =====================================================
   عناصر التطبيق
===================================================== */

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const start =
document.getElementById("start");

const capture =
document.getElementById("capture");

const file =
document.getElementById("file");

const repeat =
document.getElementById("repeat");

const stop =
document.getElementById("stop");

const result =
document.getElementById("result");

const status =
document.getElementById("status");

const welcome =
document.getElementById("welcome");

const cameraMessage =
document.getElementById("cameraMessage");

const loading =
document.getElementById("loading");

const loadingText =
document.getElementById("loadingText");


let stream = null;

let worker = null;

let lastText = "";

let reading = false;


/* =====================================================
   تغيير الحالة
===================================================== */

function setStatus(text){

    status.textContent = text;

}


/* =====================================================
   النطق العربي
===================================================== */

function speak(text){

    if(!text){
        return;
    }

    if(!("speechSynthesis" in window)){
        return;
    }

    speechSynthesis.cancel();

    const voice =
        new SpeechSynthesisUtterance(text);

    voice.lang = "ar-EG";

    voice.rate = 0.8;

    voice.pitch = 1;

    voice.volume = 1;

    const voices =
        speechSynthesis.getVoices();

    const arabicVoice =
        voices.find(
            v => v.lang === "ar-EG"
        )
        ||
        voices.find(
            v => v.lang.startsWith("ar")
        );

    if(arabicVoice){
        voice.voice = arabicVoice;
    }

    speechSynthesis.speak(voice);

    lastText = text;

}


/* =====================================================
   تشغيل الكاميرا
===================================================== */

async function startCamera(){

    try{

        stream =
        await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:{
                    ideal:"environment"
                }
            },

            audio:false

        });

        video.srcObject =
            stream;

        cameraMessage.style.display =
            "none";

        setStatus(
            "الكاميرا جاهزة"
        );

    }

    catch(error){

        console.error(error);

        cameraMessage.innerHTML =
            "تعذر تشغيل الكاميرا.<br><br>استخدم اختيار صورة.";

        setStatus(
            "الكاميرا غير متاحة"
        );

    }

}


/* =====================================================
   تشغيل Tesseract المحلي
===================================================== */

async function startOCR(){

    if(worker){
        return worker;
    }

    loading.style.display =
        "flex";

    loadingText.textContent =
        "جاري تشغيل محرك OCR...";

    try{

        worker =
        await Tesseract.createWorker({

            workerPath:
                "./worker.min.js",

            langPath:
                "./tessdata/",

            corePath:
                "./tesseract-core.wasm.js",

            logger:
            function(info){

                console.log(
                    info
                );

                if(info.status){

                    loadingText.textContent =
                        info.status;

                }

            }

        });


        await worker.loadLanguage(
            "ara"
        );


        await worker.initialize(
            "ara"
        );


        await worker.setParameters({

            tessedit_pageseg_mode:
                "6",

            preserve_interword_spaces:
                "1",

            user_defined_dpi:
                "300"

        });


        setStatus(
            "قارئ العربية جاهز"
        );


        return worker;

    }

    catch(error){

        console.error(
            "OCR ERROR:",
            error
        );

        worker = null;

        result.textContent =
            "تعذر تشغيل محرك OCR. تأكد من وجود ملفات Tesseract ونموذج اللغة العربية.";

        setStatus(
            "خطأ في محرك OCR"
        );

        throw error;

    }

    finally{

        loading.style.display =
            "none";

    }

}


/* =====================================================
   تجهيز الصورة
===================================================== */

function prepareImage(source){

    return new Promise(
        (resolve,reject)=>{

            const img =
                new Image();

            img.onload =
            function(){

                let width =
                    img.naturalWidth;

                let height =
                    img.naturalHeight;


                const maxWidth =
                    1800;


                if(
                    width > maxWidth
                ){

                    const ratio =
                        maxWidth /
                        width;

                    width =
                        Math.round(
                            width * ratio
                        );

                    height =
                        Math.round(
                            height * ratio
                        );

                }


                canvas.width =
                    width;

                canvas.height =
                    height;


                const ctx =
                    canvas.getContext(
                        "2d"
                    );


                ctx.drawImage(
                    img,
                    0,
                    0,
                    width,
                    height
                );


                resolve(
                    canvas
                );

            };


            img.onerror =
            function(){

                reject(
                    new Error(
                        "تعذر فتح الصورة"
                    )
                );

            };


            img.src =
                source;

        }
    );

}


/* =====================================================
   تنظيف النص
===================================================== */

function cleanText(text){

    return text
        .replace(/\r/g,"")
        .replace(/[|{}[\]<>~`^]/g," ")
        .replace(/[ \t]+/g," ")
        .split("\n")
        .map(
            line => line.trim()
        )
        .filter(
            line => line.length > 0
        )
        .join("\n")
        .trim();

}


/* =====================================================
   قراءة الصورة
===================================================== */

async function readImage(source){

    if(reading){
        return;
    }

    reading = true;

    capture.disabled = true;

    try{

        result.textContent =
            "جاري قراءة الصفحة...";

        setStatus(
            "جاري تجهيز الصورة..."
        );


        const image =
            await prepareImage(
                source
            );


        const ocr =
            await startOCR();


        setStatus(
            "جاري قراءة النص العربي..."
        );


        const data =
            await ocr.recognize(
                image
            );


        let text =
            data.data.text || "";


        text =
            cleanText(
                text
            );


        if(!text){

            result.textContent =
                "لم يتم العثور على نص واضح.";

            setStatus(
                "لم يتم العثور على نص"
            );

            speak(
                "لم أتمكن من قراءة النص. حاول تصوير الصفحة بشكل أوضح."
            );

            return;

        }


        result.textContent =
            text;

        lastText =
            text;


        setStatus(
            "تمت قراءة الصفحة بنجاح"
        );


        speak(
            text
        );

    }

    catch(error){

        console.error(
            error
        );

        result.textContent =
            "حدث خطأ أثناء قراءة الصفحة. تأكد من ملفات Tesseract المحلية.";

        setStatus(
            "خطأ أثناء القراءة"
        );

        speak(
            "حدث خطأ أثناء قراءة الصفحة."
        );

    }

    finally{

        reading = false;

        capture.disabled = false;

        loading.style.display =
            "none";

    }

}


/* =====================================================
   زر البداية
===================================================== */

start.addEventListener(
    "click",
    async function(){

        welcome.style.display =
            "none";

        await startCamera();

        setTimeout(
            function(){

                speak(
                    "التطبيق جاهز. ضع المستند أمام الكاميرا واضغط تصوير."
                );

            },
            500
        );

    }
);


/* =====================================================
   التقاط صورة بالكاميرا
===================================================== */

capture.addEventListener(
    "click",
    async function(){

        if(!video.videoWidth){

            speak(
                "الكاميرا غير جاهزة."
            );

            return;

        }


        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;


        const ctx =
            canvas.getContext(
                "2d"
            );


        ctx.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
        );


        const image =
            canvas.toDataURL(
                "image/jpeg",
                0.95
            );


        await readImage(
            image
        );

    }
);


/* =====================================================
   صورة من المعرض
===================================================== */

file.addEventListener(
    "change",
    function(event){

        const selectedFile =
            event.target.files[0];

        if(!selectedFile){
            return;
        }


        const reader =
            new FileReader();


        reader.onload =
        async function(){

            await readImage(
                reader.result
            );

        };


        reader.readAsDataURL(
            selectedFile
        );


        file.value = "";

    }
);


/* =====================================================
   إعادة القراءة
===================================================== */

repeat.addEventListener(
    "click",
    function(){

        if(lastText){

            speak(
                lastText
            );

        }
        else{

            speak(
                "لا يوجد نص لقراءته."
            );

        }

    }
);


/* =====================================================
   إيقاف الصوت
===================================================== */

stop.addEventListener(
    "click",
    function(){

        if(
            "speechSynthesis"
            in window
        ){

            speechSynthesis.cancel();

        }

    }
);


/* =====================================================
   تحميل أصوات الهاتف
===================================================== */

if(
    "speechSynthesis"
    in window
){

    speechSynthesis.onvoiceschanged =
    function(){

        speechSynthesis.getVoices();

    };

}

</script>

</body>

</html>
