<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق قارئ - القراءة الصوتية بالذكاء الاصطناعي</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 15px;
            margin: 0;
        }
        h1 {
            color: #4CAF50;
            font-size: 24px;
            margin-bottom: 5px;
        }
        p {
            color: #b0b0b0;
            font-size: 14px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        input[type="file"] {
            display: none;
        }
        .upload-btn {
            display: block;
            width: 100%;
            background-color: #4CAF50;
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin: 15px 0;
            box-sizing: border-box;
        }
        .upload-btn:hover {
            background-color: #45a049;
        }
        #result {
            margin-top: 15px;
            text-align: right;
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            min-height: 100px;
            font-size: 16px;
            line-height: 1.5;
            color: #fff;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>تطبيق قارئ 👁️</h1>
        <p>مساعدك الذكي لقراءة النصوص ووصف الصور</p>

        <!-- زرار التقاط أو رفع الصورة المباشر -->
        <label for="imageInput" class="upload-btn">📸 التقاط أو اختيار صورة</label>
        <input type="file" id="imageInput" accept="image/*" capture="environment" onchange="analyzeImage()">

        <div id="result">قم باختاط أو التقاط صورة لتبدأ القراءة...</div>
    </div>

    <script>
        // مفتاح الـ API المدمج ليعمل على جميع الأجهزة تلقائياً
        const API_KEY = "AQ.Ab8RN6JdueyorB_VkmV_RiMW7d1RVg5srAAwezPOVGkkxg-CJQ";

        async function analyzeImage() {
            const imageInput = document.getElementById('imageInput').files[0];
            const resultDiv = document.getElementById('result');

            if (!imageInput) return;

            resultDiv.innerText = '⏳ جاري تحليل الصورة وقراءة النصوص بدقة... يرجى الانتظار...';

            try {
                const base64Image = await toBase64(imageInput);
                const base64Data = base64Image.split(',')[1];

                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
                
                const res = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "قم بقراءة جميع النصوص العربية والإنجليزية الموجودة في هذه الصورة بدقة شديدة ووضوح، ثم وصف محتواها باختصار لمساعدة شخص كفيف." },
                                { inline_data: { mime_type: imageInput.type, data: base64Data } }
                            ]
                        }]
                    })
                });

                const data = await res.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const textResult = data.candidates[0].content.parts[0].text;
                    resultDiv.innerText = textResult;
                    
                    // قراءة النص صوتاً تلقائياً
                    speakText(textResult);
                } else {
                    resultDiv.innerText = 'عذراً، لم نتمكن من استخلاص نص واضح من الصورة. جرب التقاطها بضوء أفضل.';
                }

            } catch (error) {
                console.error(error);
                resultDiv.innerText = 'حدث خطأ أثناء الاتصال بالخادم. تحقق من الإنترنت وحاول مرة أخرى.';
            }
        }

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // إيقاف أي قراءة سابقة
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA'; // لغة عربية واضحة
                utterance.rate = 1.0; // سرعة طبيعية
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>

</body>
</html>
