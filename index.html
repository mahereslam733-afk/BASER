<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق بصير الذكي - Baser AI</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        h2 {
            font-size: 18px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .mic-container {
            margin-bottom: 20px;
        }
        .mic-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #0f172a;
            border: 3px solid #00f2fe;
            color: #00f2fe;
            font-size: 32px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        #mediaContainer {
            max-width: 500px;
            margin: 0 auto 15px auto;
            display: none;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            border: 2px solid #00f2fe;
        }
        video {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            display: block;
        }
        .close-cam {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            z-index: 10;
        }
        .action-btn {
            margin: 5px auto;
            padding: 12px 20px;
            background-color: #00f2fe;
            color: #0b0f19;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            display: none;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 500px;
            margin: 0 auto;
        }
        .feature-btn {
            padding: 12px 5px;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 85px;
            transition: 0.2s;
        }
        .feature-btn:active {
            transform: scale(0.95);
        }
        .btn-teal { background-color: #115e59; }
        .btn-purple { background-color: #581c87; }
        .btn-orange { background-color: #7c2d12; }
        .btn-blue { background-color: #1e3a8a; }
        .btn-darkblue { background-color: #1e293b; }
        .btn-darkred { background-color: #7f1d1d; background-image: linear-gradient(to right, #7f1d1d, #4c1d95); }

        .feature-btn span:first-child {
            font-size: 20px;
            margin-bottom: 5px;
        }
        .bottom-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            max-width: 500px;
            margin: 10px auto 0 auto;
        }
        #statusBox {
            margin-top: 15px;
            padding: 15px;
            background: #1e293b;
            border-radius: 8px;
            font-size: 15px;
            color: #38bdf8;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            text-align: right;
            border-right: 4px solid #00f2fe;
        }
    </style>
</head>
<body>

    <h2>كيف يمكنني مساعدتك اليوم؟</h2>

    <div class="mic-container">
        <button class="mic-btn" onclick="speakText('مرحباً بك في تطبيق بصير الذكي')">🎤</button>
    </div>

    <!-- نافذة عرض الكاميرا -->
    <div id="mediaContainer">
        <button class="close-cam" onclick="stopCamera()">إغلاق الكاميرا ✕</button>
        <video id="cameraStream" autoplay playsinline></video>
    </div>
    
    <!-- زر التحليل الذكي الموحد -->
    <button id="aiAnalyzeBtn" class="action-btn" onclick="analyzeWithAI()">تحليل المشهد بالذكاء الاصطناعي 🧠</button>
    <canvas id="canvas" style="display:none;"></canvas>

    <!-- شبكة الأزرار -->
    <div class="grid-container">
        <button class="feature-btn btn-teal" onclick="triggerAction('الاتصال بمطوع', 'tel:01000000000', 'جاري الاتصال بالمطوع')">
            <span>📞</span><span>اتصل بمطوع</span>
        </button>
        <button class="feature-btn btn-teal" onclick="startCameraForAI('اقرأ النصوص الموجودة في الصورة بدقة بالغة وذكر النص حرفياً إن وجد باللغة العربية.')">
            <span>📄</span><span>قراءة النصوص</span>
        </button>
        <button class="feature-btn btn-purple" onclick="startCameraForAI('صف لي ما يوجد في هذا المشهد بشكل دقيق ومفيد جداً لشخص مكفوف باللغة العربية.')">
            <span>📷</span><span>التعرف على الأشياء</span>
        </button>

        <button class="feature-btn btn-purple" onclick="notifyUnderDevelopment('المساعد الصوتي')">
            <span>🎧</span><span>المساعد الصوتي</span>
        </button>
        <button class="feature-btn btn-orange" onclick="startCameraForAI('اقرأ لي محتوى الكتاب أو المستند الظاهر في الصورة بدقة.')">
            <span>📖</span><span>الكتب والمستندات</span>
        </button>
        <button class="feature-btn btn-blue" onclick="getGPSLocation()">
            <span>🧭</span><span>الملاحة والتنقل</span>
        </button>

        <button class="feature-btn btn-blue" onclick="notifyUnderDevelopment('قراءة الباركود')">
            <span>📊</span><span>قراءة الباركود</span>
        </button>
        <button class="feature-btn btn-orange" onclick="notifyUnderDevelopment('التعلم والتعليم')">
            <span>🎓</span><span>التعلم والتعليم</span>
        </button>
        <button class="feature-btn btn-teal" onclick="notifyUnderDevelopment('البحث الصوتي')">
            <span>🔍</span><span>البحث الصوتي</span>
        </button>

        <button class="feature-btn btn-teal" onclick="notifyUnderDevelopment('التعرف على الوجوه')">
            <span>👤</span><span>التعرف على الوجوه</span>
        </button>
        <button class="feature-btn btn-purple" onclick="notifyUnderDevelopment('التعرف على الألوان')">
            <span>🎨</span><span>التعرف على الألوان</span>
        </button>
        <button class="feature-btn btn-blue" onclick="startCameraForAI('حدد لي فئة ونوع العملة الورقية الظاهرة في الصورة بصدق ودقة.')">
            <span>🪙</span><span>التعرف على العملات</span>
        </button>

        <button class="feature-btn btn-darkblue" onclick="notifyUnderDevelopment('سجل المعلومات')">
            <span>🕒</span><span>سجل المعلومات</span>
        </button>
        <button class="feature-btn btn-blue" onclick="getGPSLocation()">
            <span>📍</span><span>مشاركة موقعي</span>
        </button>
        <button class="feature-btn btn-darkblue" onclick="getGPSLocation()">
            <span>🏢</span><span>الملاحة الداخلية</span>
        </button>
    </div>

    <div class="bottom-grid">
        <button class="feature-btn btn-darkblue" onclick="notifyUnderDevelopment('دعم بدون إنترنت')">
            <span>⚡</span><span>دعم بدون إنترنت</span>
        </button>
        <button class="feature-btn btn-darkred" onclick="triggerAction('حالة الطوارئ', 'tel:123', 'جاري الاتصال بالطوارئ')">
            <span>🚨</span><span>طوارئ</span>
        </button>
    </div>

    <div id="statusBox">أهلاً بك في تطبيق بصير. اختر وظيفة للبدء.</div>

    <script>
        let currentStream = null;
        let currentPrompt = "صف لي ما يوجد في هذا المشهد بشكل دقيق لشخص مكفوف.";
        
        // المفتاح القديم الذي أرسلته سابقاً
        const GEMINI_API_KEY = "AQ.Ab8RN6JnrvtQcVzi6PPHobCFv56kqvE_8LXVtmARZZcRABPk6w"; 

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA';
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        async function startCameraForAI(promptText) {
            currentPrompt = promptText;
            const container = document.getElementById('mediaContainer');
            const video = document.getElementById('cameraStream');
            container.style.display = 'block';
            document.getElementById('aiAnalyzeBtn').style.display = 'inline-block';
            
            document.getElementById('statusBox').innerText = "تم فتح الكاميرا. وجهها نحو الهدف واضغط زر التحليل.";
            speakText("تم فتح الكاميرا، اضغط زر التحليل عند الاستعداد");

            try {
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }
                currentStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { exact: "environment" } } 
                }).catch(() => {
                    return navigator.mediaDevices.getUserMedia({ video: true });
                });
                video.srcObject = currentStream;
            } catch (err) {
                document.getElementById('statusBox').innerText = "تعذر فتح الكاميرا، يرجى السماح بالصلاحيات.";
                speakText("تعذر فتح الكاميرا");
            }
        }

        function stopCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
            document.getElementById('mediaContainer').style.display = 'none';
            document.getElementById('aiAnalyzeBtn').style.display = 'none';
            document.getElementById('statusBox').innerText = "تم إغلاق الكاميرا.";
            speakText("تم إغلاق الكاميرا");
        }

        async function analyzeWithAI() {
            const video = document.getElementById('cameraStream');
            const canvas = document.getElementById('canvas');
            const statusBox = document.getElementById('statusBox');
            
            if (!video.srcObject) {
                alert("الكاميرا غير مفعلة!");
                return;
            }

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            let ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            let base64Image = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];

            statusBox.innerText = "جاري إرسال الصورة وتحليلها عبر الذكاء الاصطناعي... انتظر لحظات";
            speakText("جاري التحليل");

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: currentPrompt },
                                {
                                    inline_data: {
                                        mime_type: "image/jpeg",
                                        data: base64Image
                                    }
                                }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    let aiReply = data.candidates[0].content.parts[0].text.trim();
                    statusBox.innerText = "النتيجة: " + aiReply;
                    speakText(aiReply);
                } else if (data.error) {
                    statusBox.innerText = "خطأ من الخادم: " + data.error.message;
                    speakText("عذراً، حدث خطأ في النظام");
                } else {
                    statusBox.innerText = "لم يتم تلقي استجابة صحيحة من الذكاء الاصطناعي.";
                    speakText("عذراً، لم أستطع تحليل الصورة بدقة");
                }
            } catch (err) {
                document.getElementById('statusBox').innerText = "حدث خطأ في الاتصال بالشبكة.";
                speakText("حدث خطأ في الاتصال");
            }
        }

        function notifyUnderDevelopment(featureName) {
            let msg = `خاصية ${featureName} قيد التطوير وسيتم تفعيلها قريباً`;
            document.getElementById('statusBox').innerText = msg;
            speakText(msg);
        }

        function triggerAction(name, link, speechMessage) {
            document.getElementById('statusBox').innerText = "تم تفعيل: " + name;
            speakText(speechMessage);
            if (link) {
                setTimeout(() => { window.location.href = link; }, 2000);
            }
        }

        function getGPSLocation() {
            document.getElementById('statusBox').innerText = "جاري تحديد الموقع الجغرافي...";
            speakText("جاري تحديد موقعك الجغرافي للملاحة");
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    let lat = pos.coords.latitude.toFixed(4);
                    let lng = pos.coords.longitude.toFixed(4);
                    let text = `موقعك الحالي - خط العرض: ${lat}، خط الطول: ${lng}`;
                    document.getElementById('statusBox').innerText = text;
                    speakText("تم تحديد موقعك بنجاح");
                }, () => {
                    document.getElementById('statusBox').innerText = "تعذر تحديد الموقع، تأكد من تفعيل GPS.";
                    speakText("تعذر تحديد الموقع");
                });
            }
        }
    </script>
</body>
</html>
