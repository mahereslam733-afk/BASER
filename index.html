<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0,user-scalable=no">

<title>قارئ المستندات العربي</title>

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap');

body{
    font-family:'Cairo',sans-serif;
}

button,label{
    -webkit-tap-highlight-color:transparent;
}
</style>
</head>

<body class="bg-slate-900 text-white min-h-screen p-4">

<!-- البداية -->

<div id="welcomeOverlay"
class="fixed inset-0 bg-slate-950/98 z-50
flex items-center justify-center p-6 text-center">

<div class="bg-indigo-900 border-4 border-indigo-500
p-8 rounded-3xl max-w-sm shadow-2xl">

<h2 class="text-3xl font-bold mb-4">
قارئ المستندات 👁️
</h2>

<p class="text-indigo-200 mb-8">
قارئ للنصوص العربية من الكاميرا أو المعرض
</p>

<button id="startAppBtn"
class="w-full bg-emerald-600 hover:bg-emerald-500
font-extrabold py-5 px-6 rounded-2xl text-xl">

🚀 اضغط للبدء

</button>

</div>
</div>


<!-- العنوان -->

<header class="bg-indigo-800 p-4 text-center rounded-2xl mb-4">

<h1 class="text-2xl font-extrabold">
قارئ المستندات
</h1>

<p class="text-indigo-200 text-xs mt-1">
قراءة النص العربي بالكاميرا
</p>

</header>


<main class="max-w-md mx-auto w-full">

<!-- الكاميرا -->

<div class="relative w-full aspect-[3/4]
bg-black rounded-3xl overflow-hidden
border-4 border-indigo-500 mb-4">

<video id="cameraStream"
autoplay
playsinline
muted
class="w-full h-full object-cover">
</video>

<canvas id="snapshotCanvas"
class="hidden">
</canvas>

<div id="cameraPlaceholder"
class="absolute inset-0 flex items-center
justify-center text-slate-300 text-lg">

جاري تشغيل الكاميرا...

</div>

</div>


<!-- الالتقاط -->

<button id="captureBtn"
class="w-full bg-emerald-600
hover:bg-emerald-500
font-extrabold text-xl
py-4 rounded-2xl mb-3">

📸 التقاط وقراءة الصفحة

</button>


<!-- المعرض -->

<label
class="w-full bg-blue-600
hover:bg-blue-500
font-bold py-3 rounded-2xl
flex items-center justify-center
cursor-pointer mb-3">

📁 اختيار صورة من المعرض

<input id="galleryInput"
type="file"
accept="image/*"
class="hidden">

</label>


<!-- إعادة القراءة -->

<button id="repeatBtn"
class="w-full bg-amber-600
hover:bg-amber-500
font-bold py-3 rounded-2xl">

🔊 إعادة قراءة النص

</button>


<!-- الحالة -->

<div id="statusBox"
class="mt-4 bg-indigo-950
border border-indigo-800
rounded-2xl p-3 text-center text-sm">

جاهز لقراءة الصفحة

</div>


<!-- النص -->

<div class="mt-3 bg-slate-800
border border-slate-700
p-4 rounded-2xl">

<h2 class="text-indigo-300 text-sm mb-2">
النص المستخرج:
</h2>

<div id="resultText"
class="text-white text-sm
leading-8 min-h-[100px]">

وجه الكاميرا نحو الصفحة
ثم اضغط التقاط.

</div>

</div>

</main>


<script>

/* =========================================================
   العناصر
========================================================= */

const video =
document.getElementById("cameraStream");

const canvas =
document.getElementById("snapshotCanvas");

const placeholder =
document.getElementById("cameraPlaceholder");

const captureBtn =
document.getElementById("captureBtn");

const galleryInput =
document.getElementById("galleryInput");

const repeatBtn =
document.getElementById("repeatBtn");

const resultText =
document.getElementById("resultText");

const statusBox =
document.getElementById("statusBox");

const welcomeOverlay =
document.getElementById("welcomeOverlay");

const startAppBtn =
document.getElementById("startAppBtn");


let lastSpokenText = "";

let worker = null;


/* =========================================================
   الحالة
========================================================= */

function status(text){

    statusBox.innerText = text;

}


/* =========================================================
   النطق العربي
========================================================= */

function speakArabic(text){

    if(!text) return;

    if(!("speechSynthesis" in window)) return;

    speechSynthesis.cancel();

    const u =
    new SpeechSynthesisUtterance(text);

    u.lang = "ar-EG";

    u.rate = 0.78;

    u.pitch = 1;

    u.volume = 1;


    const voices =
    speechSynthesis.getVoices();

    const voice =
    voices.find(v => v.lang === "ar-EG") ||
    voices.find(v => v.lang.startsWith("ar")) ||
    voices.find(v =>
        /Arabic|العربية|عربي/i.test(v.name)
    );

    if(voice){
        u.voice = voice;
    }

    speechSynthesis.speak(u);

    lastSpokenText = text;

}


/* =========================================================
   الكاميرا
========================================================= */

async function startCamera(){

    try{

        const stream =
        await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:{
                    ideal:"environment"
                },

                width:{
                    ideal:1920
                },

                height:{
                    ideal:1080
                }
            },

            audio:false

        });

        video.srcObject = stream;

        placeholder.style.display = "none";

        status(
            "الكاميرا جاهزة. ضع الصفحة كاملة أمام الكاميرا."
        );

    }

    catch(error){

        console.log(error);

        try{

            const stream =
            await navigator.mediaDevices.getUserMedia({
                video:true,
                audio:false
            });

            video.srcObject = stream;

            placeholder.style.display = "none";

        }

        catch(e){

            placeholder.innerText =
            "تعذر تشغيل الكاميرا. استخدم المعرض.";

            status("الكاميرا غير متاحة.");

        }

    }

}


/* =========================================================
   بدء التطبيق
========================================================= */

startAppBtn.addEventListener(
"click",
async function(){

    welcomeOverlay.style.display = "none";

    await startCamera();

    setTimeout(
        () => speakArabic(
            "التطبيق جاهز. ضع الصفحة أمام الكاميرا واضغط التقاط."
        ),
        700
    );

});


/* =========================================================
   تحميل الصورة
========================================================= */

function loadImage(src){

    return new Promise(
        (resolve,reject)=>{

            const img = new Image();

            img.onload = () =>
            resolve(img);

            img.onerror = reject;

            img.src = src;

        }
    );

}


/* =========================================================
   معالجة الصورة
========================================================= */

async function preprocess(
    source,
    mode
){

    const img =
    await loadImage(source);


    /*
       نكبر الصورة 2.5 مرة
    */

    const scale = 2.5;

    const width =
    Math.floor(img.width * scale);

    const height =
    Math.floor(img.height * scale);


    const c =
    document.createElement("canvas");

    c.width = width;

    c.height = height;


    const ctx =
    c.getContext(
        "2d",
        {willReadFrequently:true}
    );


    /*
       رسم الصورة
    */

    ctx.drawImage(
        img,
        0,
        0,
        width,
        height
    );


    const data =
    ctx.getImageData(
        0,
        0,
        width,
        height
    );


    const p = data.data;


    /*
       تحويل إلى رمادي
       وتحسين التباين
    */

    for(let i=0;i<p.length;i+=4){

        const r=p[i];

        const g=p[i+1];

        const b=p[i+2];


        let gray =
        0.299*r +
        0.587*g +
        0.114*b;


        /*
           إزالة بعض الظلال
        */

        if(mode === 1){

            gray =
            (gray - 128) * 1.55 + 128;

        }


        /*
           نسخة أبيض وأسود
        */

        if(mode === 2){

            gray =
            gray > 165 ? 255 : 0;

        }


        /*
           نسخة قوية للنصوص
        */

        if(mode === 3){

            gray =
            (gray - 128) * 2 + 128;

            gray =
            gray > 155 ? 255 : 0;

        }


        /*
           منع القيم الخارجة
        */

        gray =
        Math.max(
            0,
            Math.min(255,gray)
        );


        p[i] =
        gray;

        p[i+1] =
        gray;

        p[i+2] =
        gray;

    }


    ctx.putImageData(
        data,
        0,
        0
    );


    return c;

}


/* =========================================================
   تشغيل Tesseract
========================================================= */

async function getWorker(){

    if(worker){
        return worker;
    }


    status(
        "جاري تجهيز محرك القراءة العربية..."
    );


    worker =
    await Tesseract.createWorker("ara");


    await worker.setParameters({

        /*
           صفحة تحتوي على مجموعة نصوص
        */

        tessedit_pageseg_mode:"6",

        /*
           دقة المستند
        */

        user_defined_dpi:"300",

        /*
           الحفاظ على المسافات
        */

        preserve_interword_spaces:"1"

    });


    return worker;

}


/* =========================================================
   OCR
========================================================= */

async function recognize(canvasImage){

    const w =
    await getWorker();

    const result =
    await w.recognize(canvasImage);

    return {

        text:
        result.data.text || "",

        confidence:
        Number(result.data.confidence || 0)

    };

}


/* =========================================================
   تنظيف النص
========================================================= */

function cleanText(text){

    if(!text){
        return "";
    }


    /*
       إزالة الرموز التي تظهر بسبب OCR
    */

    text =
    text.replace(
        /[|_~`{}[\]\\^<>]+/g,
        " "
    );


    /*
       إزالة النقاط الغريبة المتكررة
    */

    text =
    text.replace(
        /[·•]{2,}/g,
        " "
    );


    /*
       الاحتفاظ بالحروف العربية
       والأرقام وعلامات الترقيم
    */

    text =
    text.replace(
        /[^\u0600-\u06FF0-9A-Za-z\s،؛:.؟!()/\-]/g,
        " "
    );


    /*
       المسافات
    */

    text =
    text.replace(
        /[ \t]+/g,
        " "
    );


    /*
       الأسطر الفارغة
    */

    text =
    text
    .split("\n")
    .map(x => x.trim())
    .filter(x => x.length > 0)
    .join("\n");


    return text.trim();

}


/* =========================================================
   تقييم نتيجة OCR
========================================================= */

function scoreText(text,confidence){

    if(!text){
        return -1000;
    }


    const arabic =
    (text.match(/[\u0600-\u06FF]/g)||[])
    .length;


    const latin =
    (text.match(/[A-Za-z]/g)||[])
    .length;


    const numbers =
    (text.match(/[0-9]/g)||[])
    .length;


    const strange =
    (text.match(/[|_~`{}[\]\\^<>]/g)||[])
    .length;


    let score =
    confidence;


    /*
       نفضل العربية
    */

    score +=
    arabic * 1.5;


    /*
       نعاقب الرموز
    */

    score -=
    strange * 10;


    /*
       نعاقب النتائج القصيرة جداً
    */

    if(text.length < 10){

        score -= 30;

    }


    /*
       نعاقب النتائج التي معظمها أرقام
    */

    if(
        numbers > arabic &&
        numbers > 5
    ){

        score -= 25;

    }


    return score;

}


/* =========================================================
   القراءة الرئيسية
========================================================= */

async function processImage(source){

    captureBtn.disabled = true;

    captureBtn.style.opacity = "0.5";


    try{

        resultText.innerText =
        "جاري تجهيز الصورة...";


        status(
            "جاري تحسين الصورة للقراءة العربية..."
        );


        /*
           النسخة الأولى
        */

        const img1 =
        await preprocess(
            source,
            1
        );


        status(
            "جاري قراءة النص العربي..."
        );


        const r1 =
        await recognize(img1);


        let best =
        r1;


        let bestScore =
        scoreText(
            cleanText(r1.text),
            r1.confidence
        );


        /*
           النسخة الثانية
        */

        if(bestScore < 100){

            status(
                "أحاول قراءة النص بطريقة ثانية..."
            );


            const img2 =
            await preprocess(
                source,
                2
            );


            const r2 =
            await recognize(img2);


            const t2 =
            cleanText(r2.text);


            const s2 =
            scoreText(
                t2,
                r2.confidence
            );


            if(s2 > bestScore){

                best = r2;

                bestScore = s2;

            }

        }


        /*
           النسخة الثالثة
        */

        if(bestScore < 100){

            status(
                "أجرب معالجة إضافية..."
            );


            const img3 =
            await preprocess(
                source,
                3
            );


            const r3 =
            await recognize(img3);


            const t3 =
            cleanText(r3.text);


            const s3 =
            scoreText(
                t3,
                r3.confidence
            );


            if(s3 > bestScore){

                best = r3;

                bestScore = s3;

            }

        }


        /*
           النتيجة النهائية
        */

        const finalText =
        cleanText(best.text);


        if(!finalText){

            resultText.innerText =
            "لم يتم العثور على نص واضح.";

            status(
                "لم أتمكن من قراءة النص."
            );


            speakArabic(
                "لم أتمكن من قراءة النص. حاول تقريب الكاميرا من الورقة وتحسين الإضاءة."
            );


            return;

        }


        resultText.innerText =
        finalText;


        status(
            "تمت قراءة الصفحة."
        );


        /*
           نطق النص
        */

        speakArabic(
            finalText
        );

    }

    catch(error){

        console.log(
            "OCR ERROR:",
            error
        );


        resultText.innerText =
        "حدث خطأ أثناء قراءة الصورة.";


        status(
            "حدث خطأ أثناء القراءة."
        );


        speakArabic(
            "حدث خطأ أثناء قراءة الصورة. حاول مرة أخرى."
        );

    }

    finally{

        captureBtn.disabled =
        false;

        captureBtn.style.opacity =
        "1";

    }

}


/* =========================================================
   التقاط الكاميرا
========================================================= */

captureBtn.addEventListener(
"click",
async function(){

    if(!video.srcObject){

        speakArabic(
            "الكاميرا غير مفعلة."
        );

        return;

    }


    if(
        !video.videoWidth ||
        !video.videoHeight
    ){

        speakArabic(
            "الكاميرا لم تصبح جاهزة بعد."
        );

        return;

    }


    /*
       نستخدم الدقة الحقيقية
       للكاميرا
    */

    canvas.width =
    video.videoWidth;

    canvas.height =
    video.videoHeight;


    const ctx =
    canvas.getContext("2d");


    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    const image =
    canvas.toDataURL(
        "image/jpeg",
        1.0
    );


    await processImage(
        image
    );

});


/* =========================================================
   المعرض
========================================================= */

galleryInput.addEventListener(
"change",
function(event){

    const file =
    event.target.files[0];


    if(!file){
        return;
    }


    if(
        !file.type.startsWith("image/")
    ){

        speakArabic(
            "الملف ليس صورة."
        );

        return;

    }


    const reader =
    new FileReader();


    reader.onload =
    async function(e){

        await processImage(
            e.target.result
        );

    };


    reader.readAsDataURL(file);


    event.target.value = "";

});


/* =========================================================
   إعادة القراءة
========================================================= */

repeatBtn.addEventListener(
"click",
function(){

    if(!lastSpokenText){

        speakArabic(
            "لا يوجد نص لقراءته."
        );

        return;

    }


    speakArabic(
        lastSpokenText
    );

});


/* =========================================================
   تحميل الأصوات
========================================================= */

if("speechSynthesis" in window){

    speechSynthesis.onvoiceschanged =
    function(){

        speechSynthesis.getVoices();

    };

}

</script>

</body>
</html>
